# Mantiene despierto el proyecto de Supabase.
#
# El plan gratuito de Supabase PAUSA un proyecto tras 7 dias sin actividad en su API,
# y ya paso una vez: con el proyecto pausado el juego no tiene ranking, ni duelos, ni
# codigos ALU-, y el panel del profesor no entra. El trabajo de pg_cron (la foto semanal)
# corre DENTRO de la base y no cuenta como actividad.
#
# Cada 3 dias hace una consulta de solo lectura (kimun_oa_asignatura), que no escribe ni
# crea nada. Si no responde lo esperado, el trabajo FALLA y GitHub avisa por correo:
# un aviso que llega es mejor que enterarse cuando un alumno no puede entrar.
#
# La clave que usa es la publicable (sb_publishable_...), la misma que va en cada
# juego: es publica por diseno. Se lee del propio juego para no tener dos copias.

name: Supabase despierto

on:
  schedule:
    - cron: "17 12 */3 * *"   # cada 3 dias, 12:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: 8vo/index.html
          sparse-checkout-cone-mode: false

      - name: Consulta de solo lectura
        id: ping
        run: |
          URL=$(grep -o 'https://[a-z0-9]*\.supabase\.co' 8vo/index.html | head -1)
          KEY=$(grep -o 'sb_publishable_[A-Za-z0-9_-]*' 8vo/index.html | head -1)
          test -n "$URL" && test -n "$KEY" || { echo "No encontre la URL o la clave en 8vo/index.html"; exit 1; }
          R=$(curl -s -m 30 -X POST "$URL/rest/v1/rpc/kimun_oa_asignatura" \
                -H "apikey: $KEY" -H "Content-Type: application/json" \
                -d '{"p_oa":"MA06 OA 01"}')
          echo "Respuesta: $R"
          echo "respuesta=$R" >> "$GITHUB_OUTPUT"
          test "$R" = '"MA06"' || { echo "Supabase no respondio lo esperado: puede estar pausado"; exit 1; }

      # Aviso por correo en CADA corrida (bien o mal), via Resend, el mismo servicio que ya
      # manda los correos de Supabase. Necesita dos secretos del repositorio:
      #   RESEND_API_KEY  -> una API key de Resend (solo envio)
      #   AVISO_CORREO    -> a quien avisar (va como secreto: el repo es publico)
      # Sin esos secretos el paso se salta solo y el trabajo no falla por eso.
      - name: Aviso por correo
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          AVISO_CORREO: ${{ secrets.AVISO_CORREO }}
          RESULTADO: ${{ steps.ping.outcome }}
          RESPUESTA: ${{ steps.ping.outputs.respuesta }}
          CORRIDA: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$RESEND_API_KEY" ] || [ -z "$AVISO_CORREO" ]; then
            echo "Sin RESEND_API_KEY o AVISO_CORREO: no se manda aviso."; exit 0
          fi
          if [ "$RESULTADO" = "success" ]; then
            ASUNTO="VULPO: Supabase despierto (OK)"
            TEXTO="La consulta de cada 3 dias respondio bien ($RESPUESTA). El proyecto sigue activo."
          else
            ASUNTO="VULPO: Supabase NO respondio"
            TEXTO="La consulta fallo (respuesta: ${RESPUESTA:-ninguna}). Puede estar pausado: entra al panel de Supabase y reactivalo."
          fi
          TEXTO="$TEXTO

          Detalle de la corrida: $CORRIDA"
          jq -n --arg to "$AVISO_CORREO" --arg s "$ASUNTO" --arg t "$TEXTO" \
            '{from:"VULPO <noreply@vulpo.cl>", to:[$to], subject:$s, text:$t}' > correo.json
          C=$(curl -s -o /dev/null -w '%{http_code}' -X POST https://api.resend.com/emails \
                -H "Authorization: Bearer $RESEND_API_KEY" -H "Content-Type: application/json" \
                --data @correo.json)
          echo "Resend respondio $C"
          test "$C" = "200" || echo "::warning::No se pudo mandar el aviso por correo (HTTP $C)"
