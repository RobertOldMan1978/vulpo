name: App Android (Capacitor)

# Compila el APK de VULPO en la nube. Se dispara A MANO (workflow_dispatch) o al empujar
# la rama feature/android — nunca desde main, para no tocar el sitio en vivo. El android/
# se genera aca en cada corrida (no vive en el repo).
on:
  workflow_dispatch:
  push:
    branches: [feature/android]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Java (para Gradle/Android)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # El keystore de debug se genera al azar en cada corrida, asi que cada APK queda
      # firmado distinto y Android se niega a ACTUALIZAR uno sobre otro ("conflicto de
      # paquetes"): habria que desinstalar cada vez y perder la voz descargada. Lo dejamos
      # ESTABLE cacheandolo entre corridas, con las credenciales estandar de debug de
      # Android (android / androiddebugkey) que Gradle usa por convencion. No es secreto:
      # firma solo builds de depuracion, nunca el release de Play. La primera corrida lo
      # crea; hay que desinstalar UNA vez para adoptar la firma nueva, y despues los APK
      # se actualizan sin desinstalar.
      - name: Keystore de debug estable (cache)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: vulpo-debug-keystore-v1

      - name: Generar el keystore de debug si falta
        run: |
          if [ ! -f ~/.android/debug.keystore ]; then
            mkdir -p ~/.android
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Dependencias de Capacitor
        run: npm install

      - name: Armar el webDir (www/)
        run: python3 scripts/armar-webdir.py

      - name: Agregar la plataforma Android
        run: npx cap add android

      - name: Copiar el sitio al proyecto Android
        run: npx cap sync android

      # Mismo nivel de API que el release (36), para que el APK de prueba se comporte igual.
      - name: Subir el nivel de API objetivo a 36 (requisito de Play)
        run: python3 scripts/patch-target-sdk.py

      # El icono de la app (launcher): el zorro Vulpi, legacy + adaptativo. Ver android-release.yml.
      - name: Icono de la app (zorro Vulpi)
        run: npx capacitor-assets generate --android --assetPath resources

      # El Android Gradle Plugin genera un keystore de debug AL AZAR por build (firma
      # distinta cada vez), asi que hay que forzarlo a usar el estable de ~/.android/. Sin
      # esto, Android rechaza actualizar la app ("conflicto de paquetes") y toca desinstalar.
      - name: Firmar el debug con el keystore estable
        run: python3 scripts/patch-debug-signing.py

      # Red de seguridad: asegura el SDK de Android 36 en el runner (ver android-release.yml).
      - name: Asegurar el SDK de Android 36
        run: (yes | sdkmanager "platforms;android-36" "build-tools;36.0.0") >/dev/null 2>&1 || true

      - name: Compilar el APK de depuracion
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir el APK (para instalar en el telefono)
        uses: actions/upload-artifact@v4
        with:
          name: vulpo-apk-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
