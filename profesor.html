<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>VULPO · Profesores</title>
<meta name="robots" content="noindex,follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<!-- Inter, la misma de la landing (y por el mismo motivo: las dos le hablan a un adulto).
     Titan One y Nunito salieron de aquí en la Sesión 106: son del juego, y el panel lo mira
     una UTP con un presupuesto en la mano. El juego NO se toca. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/kimun-180.png">
<!-- supabase-js auto-hospedado (no desde CDN): el panel maneja la sesión del profesor, así
     que un CDN comprometido podría exfiltrar su sesión. Versión fija 2.112.4. -->
<!-- Catálogo de niveles y asignaturas, compartido. Agregar un curso es una fila ahí. -->
<script src="assets/js/niveles.js"></script>
<script>/* Respaldo: un 404 de niveles.js degrada el panel a mostrar códigos en vez de
   nombres, pero NO lo tumba. Sin esto, `NIV` sin definir mataría todo el JavaScript y el
   síntoma engaña: la pantalla se ve bien y ningún botón responde. */
if(!window.NIV) window.NIV={ASIGS:{},NIVELES:[],TRANSVERSALES:{},ETIQUETA_8:{},
 codigos:function(){return[];}, nombre:function(c){return c;},
 carpeta:function(){return null;}, deNivel:function(){return[];},
 asigDe:function(o){return String(o||"").slice(0,4)||null;}};</script>
<script src="assets/vendor/supabase-js-2.112.4.min.js"></script>
<!-- QR de los enlaces de inscripción (compartido con el juego). Respaldo: un 404 deja el panel
     sin QR pero sin tumbarlo. -->
<script src="assets/vendor/qrcode-generator-1.4.4.min.js"></script>
<script src="assets/js/qr.js"></script>
<script>if(!window.QR)window.QR={pintar:function(){},grande:function(){}};</script>
<style>
/* Paleta del panel (Sesión 106). Los mismos SEIS nombres que el juego, con otros valores:
   casi todo el color de esta pantalla sale de estas variables —incluidos los estilos que el
   JavaScript escribe inline con var(--dim)—, así que el registro se cambia aquí y no
   persiguiendo reglas. Los tres semánticos (verde/ámbar/rosa) se conservan porque son
   INFORMACIÓN: marcan si un objetivo va bien, regular o mal. Lo que baja es la saturación
   del resto, para que el color signifique algo en vez de estar en todas partes. */
:root{--gold:#e0b341;--cyan:#7ba7d4;--green:#4bb583;--pink:#d4677f;--violet:#7460bd;
 --dim:#8b93a7;--panel:#161b26;--fondo:#0e1219;--linea:#ffffff14;--texto:#e6e9ef;
 /* Cuerpo de texto: entre --texto y --dim. Lo que se LEE (el enunciado de un objetivo)
    no debe pesar como un titular ni desvanecerse como una nota al pie. */
 --cuerpo:#c9cfdb}
*{box-sizing:border-box}
/* Peso 400, no 800. El body en negrita era lo que hacía que el texto de un objetivo pesara
   lo mismo que su porcentaje: con todo destacado, nada lo está. */
body{margin:0;background:var(--fondo);color:var(--texto);font-family:Inter,system-ui,sans-serif;
 font-weight:400;padding:16px;max-width:480px;margin:0 auto}
/* El panel del profesor lo usan adultos, casi siempre en un COMPUTADOR: es la única
   pantalla de VULPO que no es para un niño con un teléfono. Por eso crece en dos
   escalones y el teléfono sigue en 480px (mobile-first, por si lo miran desde el móvil). */
@media (min-width:760px){ body{max-width:880px} }
@media (min-width:1240px){ body{max-width:1180px} }
/* Los campos y textos largos no deben estirarse a lo ancho: se leen mejor acotados.
   Las tablas, acordeones y filas sí aprovechan todo el ancho. */
@media (min-width:760px){
  /* `select` va en la lista: sin él, los desplegables de nivel se estiraban a todo el
     ancho mientras el campo de al lado quedaba en 460 px, y el formulario se veía torcido. */
  body input:not([type=checkbox]):not([type=radio]), body textarea, body select{max-width:460px}
  /* Todo párrafo del panel, no solo los de primer nivel: los que viven dentro de un
     bloque (tendencia, participación, equipo) se estiraban a 1.100 px y una línea de
     ese largo se lee mal aunque quepa. */
  .card > p, #lista p{max-width:70ch}
  /* Un botón de 1.180 px de ancho no se lee como un botón. Se acotan al ancho de los
     campos que acompañan, así el formulario queda como una columna legible. */
  .btn{max-width:420px}
  .btn-fila .btn{max-width:none}
  /* La tarjeta de ingreso son dos campos y dos botones: estirada a 1.180 px es una banda
     casi vacía. El panel sí usa todo el ancho, porque ahí hay contenido que lo ocupa. */
  #cardAuth{max-width:560px}
}
/* Grupo de botones en línea: para las pantallas donde conviven dos o tres acciones
   (entrar/crear cuenta, reiniciar/volver). En el teléfono se apilan solos. */
.btn-fila{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn-fila .btn{width:auto;min-width:170px;margin-bottom:0;flex:0 1 auto}
/* El título va a la izquierda y en tamaño de encabezado, no centrado y enorme: esto es una
   herramienta, y su nombre no compite con el contenido. */
h1{font-weight:700;font-size:20px;letter-spacing:-.01em;color:var(--texto);
 text-align:left;margin:6px 0 16px}
.card{background:var(--panel);border:1px solid var(--linea);border-radius:10px;padding:16px;margin-bottom:14px}
/* Los rótulos de sección en versalitas y atenuados: nombran la caja, no compiten con ella. */
.card h3{margin:0 0 12px;font-size:12px;font-weight:600;letter-spacing:.03em;
 text-transform:uppercase;color:var(--dim)}
input,textarea,select{width:100%;padding:11px 12px;border-radius:8px;border:1px solid #ffffff1f;
 background:var(--fondo);color:var(--texto);font-weight:400;margin-bottom:10px;font-family:inherit}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--violet)}
textarea{resize:vertical;line-height:1.45}
/* Tres pesos de botón, y la diferencia NO es decorativa: antes todo era una barra
   violeta idéntica, así que "Cerrar sesión" pesaba lo mismo que "Crear curso" y el ojo
   no tenía dónde ir. La regla es UN primario por bloque; lo demás, secundario; y lo que
   no se puede deshacer, en texto —que se encuentra igual, pero no se toca sin querer—. */
.btn{width:100%;padding:11px;border:0;border-radius:8px;background:var(--violet);color:#fff;
 font-family:inherit;font-weight:600;font-size:14px;cursor:pointer;margin-bottom:8px}
.btn:hover{filter:brightness(1.12)}
/* El padding baja 1px para compensar el borde y que las dos alturas calcen. */
.btn.sec{background:transparent;border:1px solid #ffffff26;color:var(--cuerpo);padding:10px}
.btn.sec:hover{border-color:var(--violet);filter:none}
.btn.txt,.btn.peligro{background:none;border:0;color:var(--dim);font-size:13px;padding:9px;
 text-decoration:underline;text-underline-offset:3px}
.btn.peligro{color:var(--pink)}
.btn:disabled{opacity:.5;cursor:default}
.msg{text-align:center;font-size:13px;margin-top:8px;min-height:18px}
/* Etiqueta de un campo. Va en BLOQUE a propósito: un label inline que envuelve su
   <select> se acomoda a la derecha del campo anterior, y entonces parece que etiqueta a
   ese campo y no al suyo ("Nivel del curso" aparecía junto al nombre del curso). */
.campo{display:block;font-size:12px;color:var(--dim);margin:8px 0 2px}
.hide{display:none}
code{color:var(--cyan);font-weight:500;font-size:12px;
 font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
/* Marca del alumno que se inscribio solo: su nombre NO lo escribio el profesor. Va en
   la linea de abajo, no junto al nombre: la fila de arriba es la que desbordo a 375 px
   en la Sesion 26 y no se le suma nada. */
.ins-chip{color:var(--gold);font-weight:600}
/* El triángulo por omisión del desplegable se oculta: la fila del mapa ya se ve
   pulsable, y en WebKit "list-style:none" por sí solo no lo quita. */
.oa-fila>summary::-webkit-details-marker{display:none}
/* Igual para el bloque de participación: su summary usa list-style:none, que en
   Safari no basta para ocultar el triángulo (ver Sesión 25). */
#partBloque>summary::-webkit-details-marker,
#tendBloque>summary::-webkit-details-marker,
#admBloque>summary::-webkit-details-marker{display:none}

/* Filas de curso y de alumno, en dos líneas. En un teléfono de 375 px el nombre, el
   código, el XP y los botones no caben en la misma fila: el nombre no podía encogerse
   (flex:1 sin min-width:0) y el panel entero se desplazaba de lado. */
.cur-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.cur-nom,.alu-nom,.pro-nom{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;
 white-space:nowrap}
.alu{padding:6px 0;border-bottom:1px solid var(--linea)}
.alu-top{display:flex;align-items:center;gap:6px}
.alu-sub{font-size:12px;color:var(--dim);margin-top:2px}
/* Identidad del profesor. El CORREO se muestra porque es la cuenta con la que entró
   —hay quien administra más de una— y porque es el dato que se pide cuando algo hay que
   arreglarle desde el servidor. Antes esta línea enumeraba además todos sus cursos con
   su rol, que con varios se hacía larguísima y decía lejos lo que ahora dice cada curso. */
.prof-id{margin:0 0 14px;padding-bottom:12px;border-bottom:1px solid var(--linea)}
.pid-l1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pid-nom{font-weight:600;font-size:15px;color:var(--texto);min-width:0;
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pid-rango{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
 color:var(--cyan);border:1px solid var(--linea);border-radius:999px;padding:2px 8px}
.pid-mail{font-size:12px;color:var(--dim);margin-top:3px;
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Acordeón de cursos y de alumnos */
.curso{border:1px solid var(--linea);border-radius:10px;margin-bottom:10px;overflow:hidden;
 background:#12172080}
.curso>summary,.alumnos>summary{cursor:pointer;list-style:none;display:flex;
  align-items:center;gap:8px;flex-wrap:wrap}
.curso>summary{padding:10px}
.curso>summary::-webkit-details-marker,
.alumnos>summary::-webkit-details-marker,
.masivo>summary::-webkit-details-marker,
.equipo>summary::-webkit-details-marker{display:none}
.cur-chevron{color:var(--dim);font-size:12px;transition:transform .15s}
details[open]>summary>.cur-chevron{transform:rotate(90deg)}
.cur-alu{font-size:12px;color:var(--dim);flex-basis:100%;order:4}
.cur-jefe{font-size:12px;color:var(--dim);flex-basis:100%;order:5}
.cur-jefe.sin{color:var(--gold)}
.cur-part{font-size:12px;color:var(--cyan);flex-basis:100%;order:6}
/* Mi rol EN ESTE curso. Vivía enumerado en el encabezado del panel, o sea lejos del
   curso que describe; aquí se lee junto al nombre del curso, que es donde importa. */
.cur-rol{font-size:12px;color:var(--dim);flex-basis:100%;order:3}
.cur-rol b{color:var(--texto);font-weight:600}
.curso-cuerpo{padding:0 10px 10px}
/* Contraer / expandir todo. Con seis cursos abiertos hay que desplazarse para volver
   arriba, y cerrarlos de a uno son seis toques. */
.lista-barra{display:flex;justify-content:flex-end;gap:8px;margin:0 0 8px}

/* La franja de "qué necesita tu atención". Va arriba de todo porque es lo que convierte
   el panel de una lista de cursos en una herramienta que dice qué hacer.
   Cada línea es un BOTÓN de ancho completo y no un enlace: se toca en un teléfono, y un
   enlace de una línea entre otras tres es un blanco difícil. */
.franja{border:1px solid var(--linea);border-radius:10px;padding:10px 12px;margin:0 0 12px;
 background:#ffffff06}
.franja-tit{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
 color:var(--gold);margin-bottom:6px}
.franja-li{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
 background:none;border:0;border-top:1px solid var(--linea);padding:8px 2px;
 color:var(--texto);font:inherit;font-size:13px;cursor:pointer}
.franja-li:first-of-type{border-top:0}
.franja-li:hover{color:var(--gold)}
.franja-li:focus-visible{outline:2px solid var(--violet);outline-offset:2px;border-radius:6px}
.franja-ico{flex:0 0 auto}
.franja-li>span:nth-child(2){flex:1;min-width:0}   /* min-width:0 o un nombre largo estira la fila */
.franja-ver{flex:0 0 auto;color:var(--dim);font-size:12px}
/* Sin pendientes NO desaparece: una franja que unos días está y otros no hace dudar de si
   cargó. Dice que está todo al día, que es información. */
.franja-ok{color:var(--dim);font-size:12px}
/* La franja se acota a cuatro cursos: con seis, el primer curso quedaba a 1.300 px de
   scroll en un teléfono. El resto se dice en una línea, sin repetir la lista. */
.franja-resto{color:var(--dim);font-size:11px;padding:6px 2px 0;border-top:1px solid var(--linea)}
/* Bajo la mitad del curso sin entrar es lo único que se marca con color en el titular. No
   es un umbral de rendimiento: es "más de la mitad no abrió el juego". */
.part-baja{color:var(--gold)}

/* El pulso del colegio. Tabla y no tarjetas: se lee en pantalla y se imprime, y una
   tarjeta por curso ocuparía media hoja cada una.
   ⚠️ Las cabeceras son TEXTO PLANO, sin botones ni cursor de puntero: que no se pueda
   ordenar por columna es estructural y no un handler que a alguien se le olvidó. Ordenar
   por una columna de rendimiento sería un ranking de profesores, y por eso tampoco hay
   ninguna columna de acierto que ordenar. No convertir esto en una tabla ordenable. */
.pulso{width:100%;border-collapse:collapse;font-size:13px}
/* Reparto de columnas: la cobertura lleva el desglose por asignatura y necesita el ancho;
   sin esto quedaba apretada en dos líneas mientras sobraban 120 px de aire a su derecha.
   ⚠️ Va dentro de la media query de escritorio: en el teléfono las celdas pasan a bloque, y
   un 19% ahí dejaba el código del curso partido en dos ("· CUR-" / "3R09") y la
   participación en cuatro líneas. */
@media (min-width:760px){
  .pulso th:nth-child(1),.pulso td:nth-child(1){width:19%}
  .pulso th:nth-child(2),.pulso td:nth-child(2){width:52%}
  /* La columna del botón toma solo lo que necesita (width:1% + nowrap): con un porcentaje
     fijo quedaba tan estrecha que partía "Ver avance" en dos líneas y estiraba la fila. */
  .pulso td:nth-child(4){width:1%;white-space:nowrap;padding-left:10px}
}
.pulso th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.04em;
 text-transform:uppercase;color:var(--dim);padding:0 10px 6px 0;
 border-bottom:1px solid var(--linea);white-space:nowrap}
.pulso td{padding:10px 10px 10px 0;border-bottom:1px solid var(--linea);vertical-align:top}
.pulso tr:last-child td{border-bottom:0}
.pul-nom{color:var(--gold);font-weight:600;display:block}
/* Segunda línea de cada celda: el desglose por asignatura, el "sin empezar" y el código
   del curso. Atenuada porque acompaña al número, no compite con él. */
.pul-sub{display:block;color:var(--dim);font-size:12px;margin-top:2px}
/* Lo que falta configurar o no se pudo leer. En ámbar y NO en rosa: es un dato ausente,
   no un curso que va mal —y en esta pantalla el color no significa rendimiento. */
.pul-falta{color:var(--gold)}
.pul-nota{color:var(--dim);font-size:12px;line-height:1.5;margin:12px 0 0;max-width:70ch}
.pul-hoja{margin-bottom:12px}
.pul-hoja b{font-size:15px}
.solo-print{display:none}

/* El informe de cierre de unidad. Se lee en pantalla y se imprime para una reunión de
   departamento, así que hereda el mismo @media print del pulso. */
.cie-bloque{margin:0 0 18px;break-inside:avoid}
.cie-tit{color:var(--gold);font-weight:600;font-size:14px}
.cie-sub{color:var(--dim);font-size:12px;margin:2px 0 8px}
.cie-fila{padding:7px 0;border-bottom:1px solid var(--linea)}
.cie-fila:last-child{border-bottom:0}
.cie-texto{color:var(--cuerpo);font-size:13px;line-height:1.45;margin-bottom:4px}
.cie-medida{display:flex;align-items:center;gap:8px}
.cie-barra{flex:1;height:8px;background:#ffffff14;border-radius:4px;overflow:hidden;min-width:60px}
.cie-barra>div{height:100%}
.cie-medida b{min-width:42px;text-align:right}
.cie-medida small{color:var(--dim);font-size:11px;white-space:nowrap}
/* El "hoy" atenuado y a la derecha: acompaña al número del cierre, no compite con él. El
   dato de la hoja es cómo quedó la unidad; el de hoy explica por qué difiere. */
.cie-hoy{border-left:1px solid var(--linea);padding-left:8px}
.cie-vacio{color:var(--dim);font-size:12px;line-height:1.5;max-width:70ch}
/* En el teléfono la medida se parte: con el texto, la barra, el %, los alumnos y el "hoy"
   en una sola fila, la barra quedaba aplastada a cero píxeles —el mismo defecto que la
   etiqueta de "cuándo" produjo en el mapa, y que ningún "sin desborde" delata. */
@media (max-width:620px){
  .cie-medida{flex-wrap:wrap}
  .cie-barra{flex-basis:100%;order:3;margin-top:4px}
  .cie-hoy{border-left:0;padding-left:0}
}
/* La tabla de 4 columnas no cabe a 375 px —el panel ya desbordó de lado en la Sesión 26—,
   así que en el teléfono cada celda pasa a bloque y lleva su rótulo delante. */
@media (max-width:759px){
  .pulso thead{display:none}
  .pulso td,.pulso tr{display:block;width:100%}
  .pulso tr{border-bottom:1px solid var(--linea);padding:8px 0}
  .pulso tr:last-child{border-bottom:0}
  .pulso td{border-bottom:0;padding:2px 0}
  .pulso td[data-rot]:not(:first-child)::before{content:attr(data-rot);display:block;
    font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--dim);
    margin-top:6px}
}
/* En COMPUTADOR las cuatro metalíneas del curso —rol, alumnos, jefe, participación—
   caben en una sola: en el teléfono van apiladas porque no hay ancho, pero aquí sobra, y
   el ancho de este panel se gasta en densidad y no en aire. Cuatro cursos cerrados pasan
   de ocupar la pantalla entera a la mitad, que es de lo que se trata poder plegarlos. */
@media (min-width:900px){
  .cur-nom{flex:0 1 auto;max-width:300px}
  .cur-rol,.cur-alu,.cur-jefe,.cur-part{flex-basis:auto;min-width:0}
  /* Un punto entre grupo y grupo: sin él la fila se lee como una frase corrida, y varias
     de estas metalíneas ya traen puntos adentro ("14 alumnos · 3° básico"). */
  .cur-rol::before,.cur-alu::before,.cur-jefe::before,.cur-part::before{
    content:'·';margin-right:8px;color:var(--dim);opacity:.55}
  .curso>summary>.delcurso{order:9;margin-left:auto}
}
.alumnos{margin-top:8px;border-top:1px solid #ffffff14}
.alumnos>summary{padding:8px 0;color:var(--cyan);font-size:13px;font-weight:500}
.alumnos-cuerpo{padding-top:4px}
/* Área tocable de verdad: los botones de 21×25 px se fallaban con el dedo. */
.ico{background:none;border:0;font-family:inherit;font-weight:600;font-size:15px;
 line-height:1;cursor:pointer;padding:0;min-width:38px;height:38px;border-radius:10px;
 color:var(--cyan)}
.ico:active{background:#ffffff1a}
/* Borrar se aparta del resto: es lo único que no se puede deshacer. */
.ico-del{color:var(--pink);margin-left:12px}
.btn-chip{background:none;border:1px solid #ffffff26;color:var(--cuerpo);
 font-family:inherit;font-weight:500;font-size:13px;padding:7px 12px;border-radius:8px;
 cursor:pointer;margin-bottom:6px}
.btn-chip:hover{border-color:var(--violet)}
/* La acción principal de la tarjeta de un curso es VER SU AVANCE: es lo que el profesor
   hace todas las semanas, mientras que agregar un alumno se hace en marzo. Con el mismo
   chip gris que los demás quedaba por debajo del botón lleno de "Agregar alumno", o sea
   la jerarquía al revés. No se hace barra completa a propósito: la tarjeta del curso es
   una ficha, no un formulario. */
.btn-chip.principal{border-color:var(--violet);background:#7460bd26;color:var(--texto)}
.btn-chip.principal:hover{background:#7460bd3d}

/* Encabezado pegado arriba: con 60 objetivos, saber de qué curso es la tabla y volver
   al panel exigía subir miles de píxeles. */
.av-head{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;
 background:var(--panel);padding:10px 0;margin:0 0 8px;border-bottom:1px solid var(--linea)}
.av-head-tit{color:var(--gold);font-size:15px;font-weight:600;display:block;overflow:hidden;
 text-overflow:ellipsis;white-space:nowrap}
.av-head-sub{color:var(--dim);font-size:11px}
.av-filtros{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.av-chip{background:none;border:1px solid #ffffff1f;color:var(--dim);font-family:inherit;
 font-weight:500;font-size:12px;padding:6px 12px;border-radius:6px;cursor:pointer}
.av-chip.on{border-color:var(--cyan);color:var(--cyan);background:#7ba7d418}
/* Dos líneas por objetivo: los textos del currículum llegan a 250 caracteres, y con el
   texto entero caben tres por pantalla. Al desplegar la fila se muestra completo. */
.oa-texto{font-size:13px;font-weight:400;color:var(--cuerpo);margin-bottom:4px;display:-webkit-box;-webkit-box-orient:vertical;
 -webkit-line-clamp:2;line-clamp:2;overflow:hidden}
.oa-fila[open] .oa-texto{-webkit-line-clamp:unset;line-clamp:unset;overflow:visible}
/* De qué asignatura es el objetivo. Sin color propio: el color de esta tabla ya significa
   rendimiento, y un segundo eje compitiendo con ese estorba justo lo que se viene a ver. */
.oa-asig{color:var(--dim);font-size:10px;font-weight:600;letter-spacing:.04em;
 text-transform:uppercase;margin-right:8px;white-space:nowrap}
/* Cuándo se trabajó. Por el mismo motivo que la etiqueta de arriba, SIN color propio: lo
   que distingue una unidad viva de una cerrada es la palabra ("12 alumnos este mes" contra
   "sin movimiento desde junio"), no un tercer eje de color peleando con el rendimiento.
   ⚠️ Va en la zona de la MEDIDA y no junto al texto del objetivo: ahí el texto está
   recortado a dos líneas, así que la etiqueta quedaba fuera del recorte —presente en el
   DOM y **invisible**, con el conteo diciendo que estaba—. */
.oa-cuando{color:var(--dim);font-size:11px;white-space:nowrap;text-align:right}
.oa-cuando.ahora{color:var(--cuerpo)}
/* ⚠️ En el TELÉFONO la etiqueta baja a su propia línea. En la misma fila que la barra, el
   porcentaje y el detalle no cabía: dejaba la barra de progreso en CERO píxeles, y ni el
   "sin desborde" ni el "la etiqueta está dentro del viewport" lo delataban. */
@media (max-width:899px){
  .oa-medida{flex-wrap:wrap}
  .oa-cuando{flex-basis:100%;margin-top:2px}
}
@media (min-width:900px){ .oa-cuando{min-width:132px} }

/* Planificación del año. Una fila por unidad: nombre, fechas y la acción. */
.plan-fila{display:flex;flex-wrap:wrap;align-items:center;gap:8px;
 padding:7px 0;border-bottom:1px solid var(--linea)}
.plan-fila:last-child{border-bottom:0}
.plan-nom{flex:1;min-width:0;font-size:13px;color:var(--cuerpo);
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plan-fechas{font-size:12px;color:var(--texto);min-width:150px;text-align:right}
.plan-acc{display:flex;align-items:center;gap:6px}
/* La justificación va bajo su fila y en toda la línea: es una frase, no un dato al margen. */
.plan-nota{flex-basis:100%;font-size:11px;color:var(--dim);font-style:italic}
.plan-cambios{margin-left:8px;font-size:10px;font-weight:600;letter-spacing:.04em;
 text-transform:uppercase;color:var(--gold)}
/* El formulario ocupa la línea entera y sus campos NO se estiran al ancho del panel. */
.plan-form{flex-basis:100%}
.plan-form input[type=date],.plan-form input[type=text]{max-width:280px}
/* En el teléfono el nombre de la unidad va en su propia línea: compitiendo con las fechas
   y el lápiz le quedaban 140 px y se leía "U3 · Nuevo…", que no identifica nada. */
@media (max-width:759px){
  .plan-nom{flex-basis:100%;white-space:normal;overflow:visible}
  .plan-fechas{min-width:0;flex:1;text-align:left}
}
.plan-log{padding:7px 0;border-bottom:1px solid var(--linea);font-size:12px}
.plan-log-pie{color:var(--dim);font-size:11px;margin-top:2px}
/* Las fechas de la unidad en el mapa agrupado: dicen en qué momento del año se lee ese
   bloque, que es de lo que se trata. Atenuadas, como el resto de las metalíneas. */
.oa-grupo-fechas{color:var(--dim);font-weight:400;text-transform:none;letter-spacing:0}
.oa-grupo{margin-bottom:6px}
.oa-grupo-tit{color:var(--cuerpo);font-size:12px;font-weight:600;letter-spacing:.03em;
 text-transform:uppercase;padding:8px 0 4px;border-bottom:1px solid var(--linea)}
.oa-grupo-tit span{color:var(--dim);font-weight:400}
/* El corte entre lo que está en curso y el historial. Va en dorado —el acento de "esto es
   lo de ahora"— y solo aparece cuando hay algo cerrado que separar. */
.av-corte{color:var(--gold);font-size:13px;font-weight:600;letter-spacing:.02em;
 padding:2px 0 8px;margin-bottom:4px}
.av-corte span{color:var(--dim);font-weight:400}
.av-corte-sub{color:var(--dim);font-size:11px;margin:-4px 0 10px;max-width:70ch}
/* El sello de estado de una unidad. Solo el de "en clases" lleva acento —es lo único
   accionable de los tres— y los otros dos van atenuados, para que la mirada caiga donde
   hay algo que hacer. Nunca en verde/ámbar/rosa: en esta pantalla eso es rendimiento. */
.uni-sello{font-size:10px;font-weight:600;letter-spacing:.02em;text-transform:none;
 border-radius:99px;padding:2px 7px;margin-left:6px;white-space:nowrap;
 border:1px solid #ffffff1f;color:var(--dim)}
.uni-clases{color:var(--gold);border-color:#d8a43a55;background:#d8a43a12}
.av-corte-vacio{color:var(--dim);font-size:12px;margin:0 0 12px}
/* El historial: atenuado, pero NO invisible. Es consulta y no acción, así que no compite
   con lo de arriba — pero puede guardar la mayoría de los objetivos del año, y una línea
   gris de 11 px al pie se lee como "perdí datos". Fondo tenue y un poco de cuerpo para
   que se vea que hay algo ahí y se pueda tocar. */
.av-hist{margin-top:18px;border:1px solid var(--linea);border-radius:8px;
 background:#ffffff05;padding:2px 12px}
.av-hist>summary{color:var(--cuerpo);font-size:13px;font-weight:600;cursor:pointer;
 padding:10px 0;list-style:none}
.av-hist>summary::-webkit-details-marker{display:none}   /* Safari, el de siempre */
.av-hist>summary::before{content:'▸ ';color:var(--dim)}
.av-hist[open]>summary::before{content:'▾ '}
.av-hist>summary span{color:var(--dim);opacity:.75}
.av-hist-nota{color:var(--dim);font-size:11px;margin:2px 0 12px;max-width:70ch}
.hist-asig{margin-bottom:14px}
.hist-asig-tit{color:var(--cuerpo);font-size:12px;font-weight:700;letter-spacing:.05em;
 text-transform:uppercase;padding:6px 0 2px;opacity:.85}
.hist-asig-tit span{color:var(--dim);font-weight:400;letter-spacing:0}
/* En un computador el objetivo y su medida caben en la MISMA línea, y eso es lo que
   acorta el scroll de verdad: un mapa de 60 objetivos pasa de tres pantallas a una y
   media sin recortar ni un texto. En el teléfono siguen apilados. */
@media (min-width:900px){
  .oa-fila>summary{display:flex;gap:18px;align-items:center}
  .oa-fila>summary>.oa-texto{flex:1;min-width:0;margin-bottom:0}
  /* 340 -> 480 px al sumarle la etiqueta de "cuándo se trabajó". El ancho sale del texto
     del objetivo, que sigue teniendo de sobra para sus dos líneas y además se abre entero
     al desplegar la fila. */
  .oa-fila>summary>.oa-medida{flex:0 0 480px}
  .oa-fila[open]>summary{align-items:flex-start}
  /* La lista de alumnos en columnas: 35 alumnos en una sola columna son cuatro
     pantallas de scroll en un espacio que tiene sitio para tres. */
  .alu-lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
   gap:0 22px;align-items:start}
  /* El informe de cierre, igual que el mapa: objetivo y medida en una línea. Apilados, una
     unidad de 10 objetivos ocupaba dos pantallas y la barra salía de 940 px de ancho para
     un 33% — mucha tinta para un número que ya está escrito al lado. */
  .cie-fila{display:flex;gap:18px;align-items:center}
  .cie-texto{flex:1;min-width:0;margin-bottom:0}
  .cie-medida{flex:0 0 420px}
}

/* Tendencia semanal. La franja se lee de un vistazo: cada semana su acierto, y la
   última —la que está corriendo— destacada, porque es la que el profesor viene a ver. */
.tend-franja{display:flex;gap:10px;overflow-x:auto;padding:4px 0 8px;align-items:flex-end}
.tend-sem{flex:0 0 74px;text-align:center}
.tend-barra{height:64px;display:flex;align-items:flex-end;justify-content:center}
.tend-barra>i{display:block;width:26px;border-radius:5px 5px 0 0;min-height:3px}
.tend-pct{font-size:13px;font-weight:600;margin-top:4px}
.tend-fecha{font-size:10px;color:var(--dim);margin-top:1px}
.tend-sem.ahora .tend-fecha{color:var(--cyan)}
.tend-vacio{opacity:.45}
#btnArriba{position:fixed;right:14px;bottom:14px;width:44px;height:44px;border-radius:50%;
 border:1px solid #ffffff26;background:var(--panel);color:var(--cuerpo);
 font-family:inherit;font-weight:600;font-size:18px;cursor:pointer;z-index:10;opacity:.95}
/* Equipo del curso: el CSS global pone width:100%/display:block a los input, que
   descoloca los radios y las casillas. Estas reglas lo anulan solo dentro del equipo. */
.equipo-cuerpo label{display:inline-flex;align-items:center;gap:6px}
.equipo-cuerpo .eq-casillas{display:flex;flex-wrap:wrap;gap:4px 12px}
.equipo-cuerpo input[type=radio],.equipo-cuerpo input[type=checkbox]{width:auto;margin:0}

/* ===== Impresión =====
   El panel es OSCURO, y una pantalla oscura impresa tal cual gasta un cartucho y sale
   ilegible. La palanca es la misma que cambió el registro visual en la Sesión 106: casi
   todo el color sale de estas variables, así que invertir la paleta a papel son ocho
   líneas y no perseguir reglas. Regla para el marcado nuevo: usar las variables y nunca
   un hex literal —los #ffffff22 que el JavaScript escribe inline desaparecen sobre
   blanco—. Los navegadores no imprimen fondos por omisión, así que nada puede depender
   de un relleno para leerse. */
@media print{
  :root{--fondo:#fff;--panel:#fff;--texto:#000;--cuerpo:#222;--dim:#555;
        --linea:#bbb;--gold:#000;--cyan:#000;--violet:#000}
  @page{size:A4 portrait;margin:14mm}
  body{background:#fff;color:#000;max-width:none;padding:0;font-size:11pt}
  body>h1,#btnSalir,#btnArriba,#panelMsg,.no-print{display:none}
  .card{border:0;padding:0;margin:0}
  /* La cabecera de navegación de las otras vistas sí se imprime (es lo único que dice de
     qué curso es la hoja), pero pierde su botón de volver y deja de flotar. */
  .av-head{position:static;border:0;padding:0;margin:0 0 4px}
  .av-head button{display:none}
  .solo-print{display:block}
  /* Si algún día un colegio pasa de una página, que la cabecera se repita y que ninguna
     fila quede partida en dos hojas. */
  .pulso thead{display:table-header-group}
  .pulso tr{break-inside:avoid}
  .pul-nom{color:#000}
  /* El informe de cierre SÍ conserva sus tres colores semánticos —dicen si un objetivo va
     bien, regular o mal, que es el contenido de la hoja— pero en tonos oscuros: así se
     distinguen también en una impresión en blanco y negro, que es como sale la mayoría.
     ⚠️ La barra se OCULTA: es un relleno de fondo, y los navegadores no imprimen fondos
     por omisión, así que en el papel habría salido una caja vacía del mismo largo para
     todos. En la hoja manda el número, que sí se imprime.
     Y van en `.cie-bloque` y no en `:root` para no pisarle el `--gold:#000` al pulso, que
     en su hoja no significa rendimiento sino "falta configurar esto". */
  .cie-bloque{--green:#1d5e3a;--gold:#7a5a10;--pink:#8a2340}
  .cie-barra{display:none}
  .cie-fila,.cie-bloque{break-inside:avoid}
  .cie-tit{color:#000}
}
</style>
</head>
<body>
<h1>VULPO · Profesores</h1>

<div class="card" id="cardAuth">
  <h3 id="authTitulo">Ingresar</h3>
  <input id="correo" type="email" placeholder="Correo" autocomplete="email">
  <input id="clave" type="password" placeholder="Contraseña" autocomplete="current-password">
  <input id="nombre" class="hide" placeholder="Tu nombre">
  <div class="btn-fila">
    <button class="btn" id="btnEntrar">Entrar</button>
    <button class="btn sec" id="btnCambiar">Crear mi cuenta</button>
  </div>
  <p class="msg" id="authMsg"></p>
</div>

<div class="card hide" id="cardPanel">
  <div id="profId" class="prof-id hide"></div>
  <h3 id="panelTitulo">Mis cursos</h3>
  <div id="lista"></div>
  <p class="msg" id="panelMsg"></p>
  <!-- Cerrar sesión va en texto, no como botón lleno: es de las acciones menos
       frecuentes del panel y competía de igual a igual con "Crear curso". -->
  <button class="btn txt" id="btnSalir">Cerrar sesión</button>
</div>

<button id="btnArriba" class="hide" title="Volver arriba" aria-label="Volver arriba">↑</button>

<script>
const SUPA_URL='https://bdgzpjzlqidcexdkjhzy.supabase.co';
const SUPA_KEY='sb_publishable_I3FWEIOQf-_7ni_46PGSSQ_PLD3mQpM';
// storageKey propio: sin esto, la sesión del profesor reemplazaría la del alumno
// que juega en este mismo navegador, y el niño perdería su identidad.
const SB=window.supabase.createClient(SUPA_URL,SUPA_KEY,
  {auth:{storageKey:'kimun-profesor',persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id);
let MODO='entrar', YO=null;

const ERRORES={
  no_autorizado:'No tienes permiso para esto. Si es tu primera vez, pídele acceso al administrador.',
  sin_sesion:'La sesión se cerró. Vuelve a entrar.',
  sin_correo:'Tu cuenta no tiene un correo confirmado. Revisa el correo de confirmación y vuelve a entrar.',
  correo_invalido:'Ese correo no es válido.',
  profesor_invalido:'Ese profesor no existe.',
  no_te_puedes_quitar:'No puedes quitarte a ti mismo.',
  nombre_vacio:'Escribe un nombre.',
  curso_invalido:'Ese curso no existe.',
  alumno_invalido:'Ese alumno no existe.'
};
// Mensaje del caso más frecuente: la cuenta existe, lo que falta es la autorización.
// Decirle "no tienes permiso" a secas lo manda a revisar su contraseña, que está bien.
const SIN_AUTORIZACION='Tu cuenta se creó, pero tu correo todavía no está autorizado. '+
  'Pídele acceso al administrador y vuelve a entrar.';

function traducir(e){
  // supabase-js trae un código aparte del mensaje; se miran los dos.
  const t=((e&&e.message)||'')+' '+((e&&e.code)||'');
  for(const k in ERRORES) if(t.includes(k)) return ERRORES[k];
  if(t.includes('Invalid login')) return 'Correo o contraseña incorrectos.';
  if(t.includes('already registered')) return 'Ese correo ya tiene cuenta. Usa "Entrar".';
  if(t.includes('at least')) return 'La contraseña debe tener al menos 6 caracteres.';
  // El servicio de correo integrado de Supabase permite 2 envíos por hora, así que
  // esto aparece en cuanto se dan de alta varios profesores seguidos.
  if(t.includes('over_email_send_rate_limit')||t.includes('email rate limit'))
    return 'Supabase ya envió demasiados correos por ahora. Espera un rato y vuelve a intentarlo.';
  if(t.includes('email_address_invalid')) return 'Ese correo no es válido.';
  if(t.includes('Failed to fetch')||t.includes('NetworkError')||t.includes('Load failed'))
    return 'No hay conexión con el servidor. Revisa tu internet y vuelve a intentarlo.';
  if(t.includes('JWT')) return 'La sesión se cerró. Vuelve a entrar.';
  return 'No se pudo completar la acción. Intenta de nuevo.';
}

function esNoAutorizado(e){
  return (((e&&e.message)||'')+' '+((e&&e.code)||'')).includes('no_autorizado');
}

function mostrarIngreso(){
  $('cardPanel').classList.add('hide');
  $('cardAuth').classList.remove('hide');
}

// Un fallo de autorización deja la sesión abierta pero inútil: el botón de cerrar
// sesión vive dentro del panel, que sigue oculto, así que sin esto la persona no
// puede probar con otra cuenta salvo borrando el almacenamiento del navegador.
// Solo se cierra la sesión ante no_autorizado; un corte de red no debe expulsar a nadie.
async function manejarFalloDeIngreso(e){
  if(esNoAutorizado(e)){
    try{ await SB.auth.signOut(); }catch(_){}
    mostrarIngreso();
    aviso(SIN_AUTORIZACION);
    return;
  }
  aviso(traducir(e));
}
function aviso(t,color){
  const el = $('cardPanel').classList.contains('hide') ? $('authMsg') : $('panelMsg');
  el.style.color=color||'var(--pink)'; el.textContent=t;
  // El mensaje vive arriba del panel, y las acciones que lo disparan (equipo, enlace,
  // alumnos) ocurren abajo del todo: sin esto, un error queda FUERA DE PANTALLA justo
  // cuando mas se necesita, y la pantalla parece no responder. Paso de verdad.
  //
  // ⚠️ Solo si HAY mensaje, y solo si NO es un "estoy trabajando". Dos motivos distintos:
  //   * `aviso('')` borra el anterior, y varias vistas lo llaman justo después de
  //     irArriba(): desplazarse hacia un mensaje vacío —que vive al final del panel—
  //     deshacía ese irArriba y "Ver avance" abría el mapa por el pie.
  //   * `aviso('Cargando…','var(--dim)')` arranca un scroll SUAVE que sigue animando
  //     mientras irArriba() ya puso la página en cero, así que el mapa terminaba abierto
  //     81 px más abajo. Y un "Cargando…" no hay que ir a leerlo: la pantalla ya cambió.
  // El scrollIntoView existe para que un ERROR no quede fuera de pantalla, no para esto.
  if(t && color !== 'var(--dim)') try{ el.scrollIntoView({block:'center', behavior:'smooth'}); }catch(e){}
}
function esc(t){ return String(t==null?'':t)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

// Dentro del panel, "no autorizado" casi siempre significa que el curso o el alumno
// ya no existe —lo borró otra pestaña, u otro profesor—, no que falten permisos. El
// servidor responde lo mismo en ambos casos a propósito: separarlos permitiría
// descubrir qué códigos existen probándolos uno por uno.
function errorPanel(e){
  return esNoAutorizado(e)
    ? 'No tienes permiso para esto, o el curso o alumno ya no existe.'
    : traducir(e);
}

// Vuelve al panel sin dejar la pantalla en blanco si la lista no se puede cargar.
function volverAlPanel(){
  irArriba();
  pintarLista().catch(e=>aviso(errorPanel(e)));
}

// Cada vista se abre desde arriba. Sin esto, el profesor que pulsa "Ver avance" desde
// el final de una lista de 35 alumnos cae en mitad de la tabla nueva, sin saber de qué
// curso es ni que hay filtros más arriba.
function irArriba(){ window.scrollTo(0,0); }

/* Textos de los objetivos de aprendizaje. El código HI08 OA 01 no le dice nada a
   nadie: sin el texto real, la tabla es ilegible para un profesor. */
// 'HI08' -> 'historia-8basico'. Se deriva del código (assets/js/niveles.js): el nivel
// vive dentro de él, así que no hay lista que mantener al agregar un curso.
const OA_CARPETA = {};
NIV.codigos().forEach(c => { OA_CARPETA[c] = NIV.carpeta(c); });
const OA_TEXTO = {};        // "HI08 OA 01" -> "Analizar, apoyándose en diversas fuentes…"
const OA_CARGADA = {};      // carpetas ya pedidas
const OA_TOTAL = {};        // 'HI08' -> cuántos OA tiene la asignatura (de oa.json)
/* "HI05 OA 03" -> {id:'U1', titulo:'Historia', ids:Set}. Las unidades del año ya vienen
   declaradas en el oa.json, así que agrupar el mapa por unidad no cuesta una consulta.
   ⚠️ 9 objetivos de Lenguaje de 3° pertenecen a MÁS DE UNA unidad (uno a cuatro), porque
   sus capítulos son temáticos y un objetivo transversal se trabaja en varios. Se agrupan
   en la PRIMERA —así una fila sigue siendo un objetivo y los conteos cuadran— y la fila
   dice que está en más. */
const OA_UNIDAD = {};
const UNIDADES = {};        // 'HI08' -> [{id,titulo}] en el orden del oa.json
/* Lo que la vista de avance necesita saber del curso y NO puede leer del DOM: al entrar,
   `#lista` se reemplaza por la tabla y la tarjeta del curso deja de existir. Se llena en
   pintarLista y sobrevive a ese reemplazo. (`nivelDeCurso` sigue leyendo el DOM porque lo
   usan los bloques que viven DENTRO de la tarjeta, donde sí está.) */
const CURSO_INFO = {};      // 'CUR-BA04' -> {nivel:'08', misAsig:['HI08',…]}

async function cargarTextosOA(codigos){
  const carpetas = [...new Set(codigos.map(c => OA_CARPETA[String(c).slice(0,4)]).filter(Boolean))];
  await Promise.all(carpetas.map(async carpeta => {
    if(OA_CARGADA[carpeta]) return;
    OA_CARGADA[carpeta] = true;
    try{
      const r = await fetch('contenido/'+carpeta+'/oa.json');
      if(!r.ok) throw new Error('HTTP '+r.status);
      const d = await r.json();
      // Contar los OA de la asignatura para el denominador de cobertura del ranking. Sobre
      // un Set por carpeta para ser idempotente: cada carpeta es exactamente una asignatura,
      // así que vistos.size es su total de OA aunque se recargue.
      const vistos = OA_TOTAL['_set_'+carpeta] || (OA_TOTAL['_set_'+carpeta]=new Set());
      (d.oa||[]).forEach(o => {
        if(o && o.codigo){
          OA_TEXTO[o.codigo] = o.texto || o.codigo;
          vistos.add(o.codigo);
          OA_TOTAL[String(o.codigo).slice(0,4)] = vistos.size;
        }
      });
      /* Las unidades del año. ⚠️ Dos dialectos: Lenguaje de 7° las declara como
         `capitulos_del_juego` porque sus capítulos NO siguen las unidades del Programa
         —repartirían el mismo objetivo en siete—. Es el mismo caso que generar-tablero.py
         resuelve con helpers tolerantes, y medido: los 32 bancos declaran sus unidades y
         no queda ni un objetivo fuera de alguna.
         El Set hace esto idempotente, igual que el contador de arriba: recargar la misma
         carpeta no infla el "está en más de una unidad". */
      (d.unidades || d.capitulos_del_juego || []).forEach((g, i) => {
        const uid = g.id || g.n || '';
        const tit = g.titulo || g.nombre || uid;
        // El catálogo por asignatura, para poder listar las unidades que TODAVÍA no tienen
        // actividad: son justamente las que faltan por pasar, y sin ellas la planificación
        // solo mostraría el pasado.
        const pre = String((g.oa||[])[0]||'').slice(0,4);
        if(pre){
          const lista = UNIDADES[pre] || (UNIDADES[pre] = []);
          if(!lista.some(u => u.id === uid)) lista.push({id:uid, titulo:tit});
        }
        (g.oa||[]).forEach(cod => {
          // `orden` es el índice en el archivo y no el id: "U10" ordenado como texto cae
          // entre "U1" y "U2".
          const u = OA_UNIDAD[cod]
                 || (OA_UNIDAD[cod] = {id:uid, titulo:tit, orden:i, ids:new Set()});
          u.ids.add(uid);
        });
      });
    }catch(e){
      // Si falla, se olvida la marca: de lo contrario un corte momentáneo dejaría a esa
      // asignatura mostrando códigos en vez de textos durante toda la sesión.
      OA_CARGADA[carpeta] = false;
      console.error('OA:', e.message||e);
    }
  }));
}

// Completa el registro si esta cuenta todavía no tiene fila de profesor. Se llama
// al crear la cuenta Y al iniciar sesión, para que funcione con la confirmación de
// correo activada o desactivada.
async function asegurarAlta(nombre){
  if(await soyProfesor()) return;                   // ya está registrado
  const {error}=await SB.rpc('kimun_prof_alta',{p_nombre:nombre});
  if(error) throw error;
}

// OJO: kimun_prof_yo NO devuelve null para quien no es profesor, devuelve una fila
// con todos los campos vacíos, que en JavaScript es un objeto verdadero. Hay que
// mirar el id: sin esta comprobación, el panel se abre para cualquiera.
async function soyProfesor(){
  const {data,error}=await SB.rpc('kimun_prof_yo');
  // "No se pudo comprobar" no es lo mismo que "no eres profesor": si se traga el
  // error, un corte de red le dice a un profesor legítimo que pida un acceso que
  // ya tiene. Se propaga para que el mensaje diga lo que en verdad pasó.
  if(error) throw error;
  const fila = Array.isArray(data) ? data[0] : data;
  return (fila && fila.id) ? fila : null;
}

// Quién entró: nombre, rango y correo. Va en una función porque se pinta en DOS momentos
// —al abrir el panel y en cada repintado de la lista— y tenerlo escrito dos veces es
// exactamente como se desincronizan.
function pintarIdentidad(){
  const rango = (window.MI_ACCESO && window.MI_ACCESO.rango) ? window.MI_ACCESO.rango
    : YO.es_admin ? 'Administrador'
    : YO.es_operador ? 'Operador'
    : YO.es_super ? 'SuperUsuario' : 'Profesor';
  const nom = (YO.nombre||'').trim();
  // Sin nombre, el correo hace de nombre: repetirlo en las dos líneas sería ruido.
  $('profId').innerHTML =
    '<div class="pid-l1"><span class="pid-nom">👤 ' + esc(nom || YO.correo) + '</span>'
    + '<span class="pid-rango">' + esc(rango) + '</span></div>'
    + (nom ? '<div class="pid-mail">' + esc(YO.correo) + '</div>' : '');
}

// El acceso EFECTIVO viene del servidor (kimun_prof_mi_acceso, Fase 4 B0): el panel pinta
// identidad y visibilidad desde el GRANT, no desde la bandera cruda. Si la función todavía no
// está aplicada (404), MI_ACCESO queda null y todo cae al cálculo por bandera de siempre —
// degradación limpia, para poder publicar el panel antes o junto con el esquema.
async function cargarPanel(){
  YO = await soyProfesor();
  if(!YO){ throw new Error('no_autorizado'); }
  $('cardAuth').classList.add('hide');
  $('cardPanel').classList.remove('hide');
  try { const r = await SB.rpc('kimun_prof_mi_acceso'); window.MI_ACCESO = (r.data&&r.data[0]) || null; }
  catch(e){ window.MI_ACCESO = null; }
  const esAdminColegio = window.MI_ACCESO ? !!window.MI_ACCESO.es_admin_colegio
                                          : !!(YO.es_admin || YO.es_super || YO.es_operador);
  window.ESADMINCOLEGIO = esAdminColegio;   // usado por pintarLista y el bloque de equipo
  pintarIdentidad();
  $('panelTitulo').textContent = esAdminColegio ? 'Todos los cursos' : 'Mis cursos';
  await pintarLista();
}
// ¿Tengo la capacidad `campo` según el acceso efectivo? Con MI_ACCESO manda el grant; sin él
// (función no aplicada) cae al `legado` por bandera. Lo usan los botones de herramientas y el 🔑.
function accede(campo, legado){ return window.MI_ACCESO ? !!window.MI_ACCESO[campo] : legado; }

// Mi rol en ESTE curso, para el encabezado de su tarjeta.
// ⚠️ Solo si tengo membresía: a un Admin/Super sin membresía `kimun_prof_asignaturas` le
// devuelve TODAS las del nivel, así que enumerárselas no diría nada sobre su rol.
function rolEnCurso(c){
  if(c.miRol === 'jefe') return '<span class="cur-rol">Tú: <b>Profesor jefe</b></span>';
  if(c.miRol === 'asignatura' && c.misAsig && c.misAsig.length)
    return '<span class="cur-rol">Tú: <b>'
      + esc(c.misAsig.map(a=>ASIG_NOMBRE[a]||a).join(', ')) + '</b></span>';
  return '';
}

// Al cerrar un curso se cierra también todo lo de adentro. Sin esto, reabrirlo lo devuelve
// con la lista de alumnos y el equipo desplegados, que es justo lo que se venía de esconder.
function plegarDentro(det){ det.querySelectorAll('details').forEach(d=>{ d.open=false; }); }

/* Orden ASCENDENTE de cursos: primero por nivel (3° antes que 8°) y dentro de cada nivel
   por nombre. El servidor los devuelve ordenados solo por nombre, y con nombres como
   "8A Prueba" y "5° B" el alfabético no es el orden en que un colegio los piensa. Los
   cursos sin nivel —creados antes de que esa columna existiera— van al final, porque no
   hay dónde ponerlos sin adivinarles el nivel a partir del nombre.
   Vive en una función porque lo usan DOS pantallas (la lista y el pulso del colegio), y
   dos copias del mismo criterio es como terminan discrepando. Recibe {nombre, nivel}. */
function ordenCursos(a, b){
  const na = a.nivel || '99', nb = b.nivel || '99';
  return na !== nb ? na.localeCompare(nb)
    : String(a.nombre||'').localeCompare(String(b.nombre||''), 'es',
        {numeric:true, sensitivity:'base'});
}

/* Cuántos objetivos tiene el AÑO de un nivel: la suma de sus cuatro asignaturas. Es el
   denominador de la cobertura, y sale de los oa.json que cargarTextosOA ya lee —el mismo
   OA_TOTAL con el que el ranking dice "13/17 objetivos"—, no de una tabla en el servidor.
   Cada mitad se cuenta donde vive su dato: el total en el repositorio, lo trabajado en la
   base. Un espejo del total en SQL fallaría en silencio el día que un banco gane un OA.
   Devuelve 0 si falta cualquiera de las cuatro, y entonces la fila dice "no disponible"
   en vez de un denominador parcial, que se leería como un curso más adelantado de lo que va. */
function totalOaNivel(nivel){
  const asigs = NIV.deNivel(nivel);
  if(!asigs.length) return 0;
  let suma = 0;
  for(const a of asigs){
    if(!OA_TOTAL[a]) return 0;
    suma += OA_TOTAL[a];
  }
  return suma;
}

// El árbol Sostenedor › Colegio › Cursos (Sesión 116). En vez de reescribir las tarjetas de
// curso, las REPARENTA en el DOM bajo su colegio y sostenedor: así las tarjetas y todo su
// cableado (equipo, alumnos, inscripción, ver avance) quedan intactos. Solo lo ve quien
// administra el colegio; un Jefe / profe de asignatura ve sus cursos planos, sin envoltorio.
// Corre DESPUÉS de renderizar y restaurar el estado desplegado, así el reparenting conserva
// qué cursos estaban abiertos.
function agruparArbol(sostArbol, porCurso){
  const lista = document.getElementById('lista'); if(!lista) return;
  const adm = document.getElementById('admBloque');
  const arbol = document.createElement('div'); arbol.id = 'arbolInq';
  arbol.innerHTML = `<div class="arb-crear" style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0">
    <input id="sosNombre" placeholder="Nombre del sostenedor nuevo" style="max-width:280px">
    <button class="btn sec" id="btnSos">+ Crear sostenedor</button></div>`;
  const cajaDeColegio = {};   // colegio_id -> div donde van sus cursos
  (sostArbol||[]).forEach(s=>{
    const sn = document.createElement('details');
    sn.className = 'sos-nodo'; sn.open = true; sn.dataset.sos = s.id;
    sn.style.cssText = 'border-top:1px solid var(--linea);padding-top:8px;margin-top:8px';
    sn.innerHTML = `<summary style="cursor:pointer;list-style:none;font-size:14px;font-weight:600;padding:4px 0">
        <span class="cur-chevron" aria-hidden="true">▸</span> 🏢 ${esc(s.nombre)}
        <button class="ico sos-ren" data-sos="${esc(s.id)}" data-nom="${esc(s.nombre)}" title="Renombrar sostenedor" style="color:var(--gold)">✎</button>
        <button class="ico ico-del sos-del" data-sos="${esc(s.id)}" title="Borrar sostenedor">🗑️</button></summary>`;
    (s.colegios||[]).forEach(co=>{
      const cn = document.createElement('details');
      cn.className = 'col-nodo'; cn.open = true; cn.dataset.col = co.id;
      cn.style.cssText = 'margin:6px 0 6px 12px';
      cn.innerHTML = `<summary style="cursor:pointer;list-style:none;font-size:13px;font-weight:600;padding:3px 0">
          <span class="cur-chevron" aria-hidden="true">▸</span> 🏫 ${esc(co.nombre)}
          <span class="col-conteo" style="color:var(--dim);font-size:12px;font-weight:400"></span>
          <button class="ico col-ren" data-col="${esc(co.id)}" data-nom="${esc(co.nombre)}" title="Renombrar colegio" style="color:var(--gold)">✎</button>
          <button class="ico ico-del col-del" data-col="${esc(co.id)}" title="Borrar colegio">🗑️</button></summary>
        <div class="col-cursos" style="margin-left:4px"></div>`;
      cajaDeColegio[co.id] = cn.querySelector('.col-cursos');
      sn.appendChild(cn);
    });
    const cc = document.createElement('div');
    cc.className = 'arb-crear'; cc.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 6px 12px';
    cc.innerHTML = `<input class="in-colegio" data-sos="${esc(s.id)}" placeholder="Nombre del colegio nuevo" style="max-width:260px">
      <button class="btn sec col-crear" data-sos="${esc(s.id)}">+ Crear colegio</button>`;
    sn.appendChild(cc);
    arbol.appendChild(sn);
  });
  // Caja "Sin colegio" (solo se agrega si algún curso cae ahí).
  const sinNodo = document.createElement('details');
  sinNodo.className = 'col-nodo'; sinNodo.open = true;
  sinNodo.style.cssText = 'margin-top:8px;border-top:1px solid var(--linea);padding-top:8px';
  sinNodo.innerHTML = `<summary style="cursor:pointer;list-style:none;font-size:13px;font-weight:600;padding:3px 0">
      <span class="cur-chevron" aria-hidden="true">▸</span> 📄 Sin colegio</summary>
    <div class="col-cursos" style="margin-left:4px"></div>`;
  const sinCaja = sinNodo.querySelector('.col-cursos');
  let haySin = false;
  [...lista.querySelectorAll('details.curso')].forEach(cn=>{
    const colId = (porCurso[cn.dataset.cod]||{}).colegioId;
    if(colId && cajaDeColegio[colId]) cajaDeColegio[colId].appendChild(cn);
    else { sinCaja.appendChild(cn); haySin = true; }
  });
  if(haySin) arbol.appendChild(sinNodo);
  arbol.querySelectorAll('.col-nodo').forEach(cn=>{
    const n = cn.querySelectorAll('details.curso').length;
    const et = cn.querySelector('.col-conteo'); if(et) et.textContent = ' · '+n+' curso'+(n===1?'':'s');
  });
  lista.insertBefore(arbol, adm);
  conectarArbol();
}

function conectarArbol(){
  const bs = document.getElementById('btnSos');
  if(bs) bs.onclick = async () => {
    const n = (document.getElementById('sosNombre').value||'').trim();
    if(!n){ aviso('Escribe un nombre.'); return; }
    await accion(()=>SB.rpc('kimun_prof_sostenedor_crear',{p_nombre:n}), 'Sostenedor creado');
  };
  document.querySelectorAll('.col-crear').forEach(b=>b.onclick=async ()=>{
    const campo=document.querySelector('.in-colegio[data-sos="'+b.dataset.sos+'"]');
    const n=(campo.value||'').trim();
    if(!n){ aviso('Escribe un nombre.'); return; }
    await accion(()=>SB.rpc('kimun_prof_colegio_crear',{p_sostenedor:b.dataset.sos, p_nombre:n}), 'Colegio creado');
  });
  // Los ✎/🗑️ viven dentro de un <summary>: stopPropagation para que tocarlos no pliegue el nodo.
  document.querySelectorAll('.sos-ren').forEach(b=>b.onclick=async (e)=>{ e.preventDefault(); e.stopPropagation();
    const n=(prompt('Nuevo nombre del sostenedor:', b.dataset.nom)||'').trim(); if(!n) return;
    await accion(()=>SB.rpc('kimun_prof_sostenedor_renombrar',{p_id:b.dataset.sos, p_nombre:n}), 'Sostenedor renombrado'); });
  document.querySelectorAll('.sos-del').forEach(b=>b.onclick=async (e)=>{ e.preventDefault(); e.stopPropagation();
    if(!confirm('¿Borrar este sostenedor?\n\nSe borran también sus colegios; sus cursos quedan SIN colegio (no se borran).')) return;
    await accion(()=>SB.rpc('kimun_prof_sostenedor_borrar',{p_id:b.dataset.sos}), 'Sostenedor borrado'); });
  document.querySelectorAll('.col-ren').forEach(b=>b.onclick=async (e)=>{ e.preventDefault(); e.stopPropagation();
    const n=(prompt('Nuevo nombre del colegio:', b.dataset.nom)||'').trim(); if(!n) return;
    await accion(()=>SB.rpc('kimun_prof_colegio_renombrar',{p_id:b.dataset.col, p_nombre:n}), 'Colegio renombrado'); });
  document.querySelectorAll('.col-del').forEach(b=>b.onclick=async (e)=>{ e.preventDefault(); e.stopPropagation();
    if(!confirm('¿Borrar este colegio?\n\nSus cursos quedan SIN colegio (no se borran).')) return;
    await accion(()=>SB.rpc('kimun_prof_colegio_borrar',{p_id:b.dataset.col}), 'Colegio borrado'); });
  document.querySelectorAll('.colegio-sel').forEach(sel=>sel.onchange=async ()=>{
    await accion(()=>SB.rpc('kimun_prof_curso_colegio_fijar',
      {p_curso_codigo:sel.dataset.cod, p_colegio:sel.value||null}),
      sel.value ? 'Curso movido de colegio' : 'Curso sin colegio');
  });
}

async function pintarLista(){
  // Preservar qué cursos (y su sublista de alumnos) estaban desplegados, para que al
  // re-renderizar tras una acción (p. ej. agregar alumno) el curso no se contraiga solo.
  const abiertos=new Set([...document.querySelectorAll('details.curso[open]')].map(d=>d.dataset.cod));
  const aluAbiertos=new Set([...document.querySelectorAll('details.curso')]
    .filter(d=>{const a=d.querySelector('details.alumnos');return a&&a.open;}).map(d=>d.dataset.cod));
  // Administración se pliega sola en cada repintado, y `accion()` repinta tras CADA
  // acción: sin esto, autorizar tres profesores seguidos obliga a reabrirla tres veces.
  const admAbierto = !!(document.getElementById('admBloque')||{}).open;
  $('panelTitulo').classList.remove('hide');   // las vistas de avance lo ocultan
  $('profId').classList.remove('hide');
  pintarIdentidad();   // se re-fija en cada render para no acumular
  const {data,error}=await SB.rpc('kimun_prof_listar');
  if(error) throw error;
  const porCurso={};
  (data||[]).forEach(f=>{
    porCurso[f.curso_codigo]=porCurso[f.curso_codigo]||
      {nombre:f.curso, alumnos:[], gestiono:f.puede_gestionar, miRol:f.mi_rol,
       misAsig:f.mis_asignaturas, nivel:f.nivel||'',
       colegioId:f.colegio_id||null, colegio:f.colegio||''};
    if(f.pid) porCurso[f.curso_codigo].alumnos.push(f);   // pid: id de perfil (siempre presente); codigo_acceso puede venir null para un profe de asignatura
  });
  const cursos=Object.entries(porCurso);
  cursos.sort((a,b)=>ordenCursos(a[1], b[1]));   // por nivel y nombre; ver ordenCursos
  // Lo que la vista de avance va a necesitar cuando esta lista ya no exista en el DOM.
  cursos.forEach(([cod,c]) => { CURSO_INFO[cod] =
    {nivel:c.nivel||'', misAsig:c.misAsig||[], gestiono:!!c.gestiono, nombre:c.nombre}; });
  /* Árbol Sostenedor › Colegio › Cursos (Sesión 116): quien administra el colegio ve los
     cursos AGRUPADOS bajo su colegio y sostenedor. Se piden aquí, una vez, para agrupar; un
     Jefe / profe de asignatura no pasa el portero y ve sus cursos planos, sin el envoltorio. */
  let SOST_ARBOL = [];      // [{id, nombre, colegios:[{id,nombre}]}]
  const COLS_FLAT = [];     // {id, etiqueta} de todos los colegios, para mover un curso
  if(window.ESADMINCOLEGIO){
    const {data:sos} = await SB.rpc('kimun_prof_sostenedores');
    for(const s of (sos||[])){
      const {data:cols} = await SB.rpc('kimun_prof_colegios',{p_sostenedor:s.id});
      SOST_ARBOL.push({id:s.id, nombre:s.nombre, colegios:cols||[]});
      (cols||[]).forEach(c=>COLS_FLAT.push({id:c.id, etiqueta:s.nombre+' · '+c.nombre}));
    }
  }
  const opcionesColegio = sel => '<option value="">Sin colegio</option>' +
    COLS_FLAT.map(x=>`<option value="${esc(x.id)}"${x.id===sel?' selected':''}>${esc(x.etiqueta)}</option>`).join('');
  /* La barra se arma por partes: "Contraer todo" solo tiene sentido con más de un curso,
     pero el pulso del colegio se ve igual con uno. Antes la barra entera dependía del
     conteo, así que un colegio de un solo curso se quedaba sin el botón nuevo. */
  const botones =
      (window.ESADMINCOLEGIO
        ? `<button class="btn-chip principal" type="button" id="btnPulso">🏫 El pulso del colegio</button>` : '')
    + (cursos.length > 1
        ? `<button class="btn-chip" type="button" id="btnPlegar">Contraer todo</button>` : '');
  const barra = botones ? `<div class="lista-barra">${botones}</div>` : '';
  /* La franja de atención va ANTES de la barra de botones y de los cursos: es lo primero
     que hay que ver al entrar. Nace vacía y la rellena cargarResumen, para no retrasar el
     render de la lista — si la consulta tarda, los cursos ya están a la vista. */
  $('lista').innerHTML = '<div id="franjaAtencion"></div>' + barra
   + (cursos.length ? cursos.map(([cod,c])=>`
    <details class="curso" data-cod="${esc(cod)}">
      <summary>
        <span class="cur-chevron" aria-hidden="true">▸</span>
        <b class="cur-nom" style="color:var(--gold)">${esc(c.nombre)}</b>
        <code>${esc(cod)}</code>
        ${rolEnCurso(c)}
        <span class="cur-alu">${c.alumnos.length} alumno${c.alumnos.length===1?'':'s'}${
          c.nivel?' · '+esc(NIVEL_NOMBRE(c.nivel)):''}</span>
        <span class="cur-jefe" data-cod="${esc(cod)}"></span>
        <span class="cur-part" data-cod="${esc(cod)}">Participación · …</span>
        ${window.ESADMINCOLEGIO?`<button class="ico ico-del delcurso" data-cod="${esc(cod)}" title="Eliminar curso">🗑️</button>`:''}
      </summary>
      <div class="curso-cuerpo">
        <button class="btn-chip principal avance" data-cod="${esc(cod)}" data-nom="${esc(c.nombre)}"
          data-gestiono="${c.gestiono?'1':''}">📊 Ver avance del curso</button>
        ${c.gestiono?`<details class="equipo" data-cod="${esc(cod)}" data-nivel="${esc(c.nivel)}" style="margin-top:6px">
          <summary style="cursor:pointer;color:var(--cyan);font-size:13px;font-weight:500;list-style:none">👥 Equipo del curso · Jefe, asignatura</summary>
          <div class="equipo-cuerpo" data-cod="${esc(cod)}">
            <p style="color:var(--dim);font-size:12px;margin:6px 0">Cargando…</p>
          </div>
        </details>`:''}
        <details class="alumnos">
          <summary><span class="cur-chevron" aria-hidden="true">▸</span>🧑‍🎓 Alumnos (${c.alumnos.length})</summary>
          <div class="alumnos-cuerpo">
            ${c.alumnos.length ? '<div class="alu-lista">'+c.alumnos.map(a=>`
              <div class="alu">
                <div class="alu-top">
                  <span>${esc(a.avatar)}</span><b class="alu-nom">${esc(a.alumno)}</b>
                  ${c.gestiono?`<button class="ico xp" data-cod="${esc(a.codigo_acceso)}" data-xp="${esc(a.xp)}"
                          title="Fijar XP" style="color:var(--gold)">✎</button>`:''}
                  <button class="ico avalum" data-pid="${esc(a.pid)}"
                          data-nom="${esc(a.alumno)}" data-curso="${esc(cod)}"
                          title="Ver avance">📊</button>
                  ${c.gestiono?`<button class="ico ico-del del" data-cod="${esc(a.codigo_acceso)}"
                          title="Eliminar alumno">✕</button>`:''}
                </div>
                <div class="alu-sub">${a.codigo_acceso?`<code>${esc(a.codigo_acceso)}</code> · `:''}${esc(a.xp)} XP${a.autoinscrito?` · <span class="ins-chip" title="Se inscribió por el enlace: este nombre lo escribió el alumno, no tú">se inscribió solo</span>`:''}</div>
              </div>`).join('')+'</div>'
             : '<p style="color:var(--dim);font-size:12px">Sin alumnos todavía.</p>'}
            ${c.gestiono?`<div style="margin-top:8px">
              <input class="in-alumno" data-curso="${esc(cod)}" placeholder="Nombre del alumno nuevo">
              <button class="btn sec add-alumno" data-curso="${esc(cod)}">+ Agregar alumno</button>
            </div>
            <details class="masivo" style="margin-top:6px">
              <summary style="cursor:pointer;color:var(--cyan);font-size:13px;font-weight:500;list-style:none">➕ Cargar varios de una vez</summary>
              <p style="color:var(--dim);font-size:12px;margin:6px 0">Pega un nombre por línea (como los copias de una lista).</p>
              <textarea class="in-masivo" data-curso="${esc(cod)}" rows="5" placeholder="Ana Pérez&#10;Benjamín Soto&#10;Catalina Rivas"></textarea>
              <button class="btn sec add-masivo" data-curso="${esc(cod)}">Agregar todos</button>
            </details>`:''}
          </div>
        </details>
        ${c.gestiono?`<details class="inscripcion" data-cod="${esc(cod)}" data-nivel="${esc(c.nivel)}" style="margin-top:6px">
          <summary style="cursor:pointer;color:var(--cyan);font-size:13px;font-weight:500;list-style:none">🔗 Enlace de inscripción</summary>
          <div class="inscripcion-cuerpo" data-cod="${esc(cod)}">
            <p style="color:var(--dim);font-size:12px;margin:6px 0">Cargando…</p>
          </div>
        </details>`:''}
        ${window.ESADMINCOLEGIO?`<div style="display:flex;gap:6px;align-items:center;margin-top:8px;font-size:12px;color:var(--dim)">
          Colegio <select class="colegio-sel" data-cod="${esc(cod)}" style="max-width:230px">${opcionesColegio(c.colegioId)}</select>
        </div>`:''}
      </div>
    </details>`).join('')
   : '<p style="color:var(--dim);font-size:13px">Aún no tienes cursos.</p>')
   /* Administración PLEGADA, y no es un detalle de estilo. Crear un curso, autorizar a un
      profesor o armar un enlace de muestra se hacen una vez al año; los cursos se miran
      todas las semanas. Desplegada, esos formularios ocupaban ~800 px bajo una tarjeta de
      curso de 130, o sea el 70% de la pantalla para lo que casi nunca se usa. */
   /* El violeta se reserva para las ACCIONES: como texto sobre el panel no llega al mínimo
      de contraste (3,4:1), y una línea violeta de 2 px separando la sección era ruido —lo
      que la separa es que está plegada, no un subrayado de color—. */
   + (window.ESADMINCOLEGIO ? `<details id="admBloque" style="margin-top:16px;
        border-top:1px solid var(--linea);padding-top:12px">
        <summary style="cursor:pointer;list-style:none;color:var(--texto);font-size:14px;
                 font-weight:600;padding:4px 0">
          <span class="cur-chevron" aria-hidden="true">▸</span> ⚙️ Administración</summary>
        <div style="padding-top:10px">
          <h3 style="font-size:12px;margin:0 0 8px">Curso nuevo</h3>
          <input id="cursoNombre" placeholder="Nombre del curso nuevo (8° A)">
          <label class="campo">Nivel del curso
            <select id="cursoNivel">${NIVELES_MUESTRA.map(n=>`<option value="${n.nivel}">${n.nombre}</option>`).join('')}</select></label>
          <button class="btn" id="btnCurso">+ Crear curso</button>

          <h3 style="font-size:12px;margin:16px 0 8px">Profesores</h3>
          <input id="nuevoCorreo" type="email" placeholder="Correo del profesor nuevo">
          <button class="btn sec" id="btnAutorizar">+ Autorizar profesor</button>
          <div id="profes" style="margin:10px 0"></div>

          <h3 style="font-size:12px;margin:16px 0 8px">Herramientas</h3>
          <div class="btn-fila">
            <button class="btn sec" id="btnTablero">📊 Tablero de avance</button>
            ${accede('limpiar', YO.es_admin||YO.es_operador)?`<button class="btn peligro" id="btnLimpiar">🧹 Limpiar perfiles de prueba</button>`:''}
          </div>
          ${accede('armar', YO.es_admin||YO.es_operador)?`<label class="campo" style="margin-top:10px">🔗 Armar enlace de muestra</label>
          <select id="armarNivel">${NIVELES_MUESTRA.map(n=>`<option value="${n.ruta}">${n.nombre}</option>`).join('')}</select>
          <button class="btn sec" id="btnArmar">Abrir armador</button>`:''}
        </div>
      </details>` : '');
  conectarAcciones();
  // Restaurar el estado desplegado que había antes del re-render.
  document.querySelectorAll('details.curso').forEach(d=>{
    const cod=d.dataset.cod;
    if(abiertos.has(cod)) d.open=true;
    if(aluAbiertos.has(cod)){ const a=d.querySelector('details.alumnos'); if(a) a.open=true; }
  });
  const adm=document.getElementById('admBloque'); if(adm && admAbierto) adm.open=true;
  /* Contraer / expandir todo. Un solo botón que ALTERNA, como el Todos/Ninguno del
     armador: dos botones para lo mismo llenan la barra de controles. Se conecta después
     de restaurar el estado, así el rótulo nace diciendo la verdad. */
  const btnPulso = document.getElementById('btnPulso');
  if(btnPulso) btnPulso.onclick = () => verPulso();
  const btnPlegar = document.getElementById('btnPlegar');
  const refrescarPlegar = () => {
    if(btnPlegar) btnPlegar.textContent =
      document.querySelector('details.curso[open]') ? 'Contraer todo' : 'Expandir todo';
  };
  document.querySelectorAll('details.curso').forEach(d => d.addEventListener('toggle', () => {
    if(!d.open) plegarDentro(d);
    refrescarPlegar();
  }));
  if(btnPlegar) btnPlegar.onclick = () => {
    const abrir = !document.querySelector('details.curso[open]');
    document.querySelectorAll('details.curso').forEach(d => {
      d.open = abrir;
      if(!abrir) plegarDentro(d);
    });
    refrescarPlegar();
  };
  refrescarPlegar();
  // El equipo del curso se pide la primera vez que se abre su desplegable (carga perezosa).
  document.querySelectorAll('details.inscripcion').forEach(det => det.addEventListener('toggle', () => {
    if(det.open && !det.dataset.cargado){ det.dataset.cargado='1'; cargarInscripcion(det.dataset.cod, det.dataset.nivel); }
  }));
  document.querySelectorAll('details.equipo').forEach(det => det.addEventListener('toggle', () => {
    if(det.open && !det.dataset.cargado){ det.dataset.cargado='1'; cargarEquipo(det.dataset.cod, det.dataset.nivel); }
  }));
  cargarResumen(cursos.map(([cod])=>cod));
  cargarJefes(cursos.map(([cod])=>cod));

  if(window.ESADMINCOLEGIO){
    // El HTML de este bloque vive en el template de arriba, dentro de <details>; aquí
    // solo se cablea. Ojo: los botones existen aunque el desplegable esté cerrado, así
    // que plegarlo no cambia nada del cableado.
    $('btnAutorizar').onclick=async ()=>{
      const c=($('nuevoCorreo').value||'').trim();
      if(!c){ aviso('Escribe un correo.'); return; }
      await accion(()=>SB.rpc('kimun_prof_autorizar',{p_correo:c}), 'Correo autorizado');
    };
    $('btnTablero').onclick=()=>{ window.location.href='dev/tablero.html'; };
    // "Limpiar perfiles de prueba" y el armador son herramientas operativas (perfiles.limpiar /
    // enlace.armar). Solo se cablean si su botón se dibujó, que ya lo decide `accede(...)` arriba.
    if($('btnLimpiar')) $('btnLimpiar').onclick=limpiarPruebas;
    if($('btnArmar')) $('btnArmar').onclick=()=>{ window.location.href=$('armarNivel').value+'?armar=1'; };
    const {data:profes,error:errProfes}=await SB.rpc('kimun_prof_profesores');
    if(errProfes){
      $('profes').innerHTML='<p style="color:var(--pink);font-size:12px">No se pudo cargar la lista de profesores.</p>';
    }else{
      $('profes').innerHTML=(profes||[]).map(p=>{
        const rango = p.es_admin ? 'Administrador'
          : p.es_operador ? 'Operador'
          : p.es_super ? 'SuperUsuario' : (p.registrado?'Profesor':'sin registrar');
        // Nombrar SuperUsuario: lo hace un Admin o un Operador, nunca sobre un Admin ni un Operador.
        const btnSuper = ((YO.es_admin || YO.es_operador) && p.registrado && !p.es_admin && !p.es_operador)
          ? `<button class="btn-chip super-toggle" data-correo="${esc(p.correo)}" data-on="${p.es_super?'0':'1'}">${p.es_super?'Quitar Super':'Hacer Super'}</button>`
          : '';
        // Nombrar Operador: SOLO el Admin, y nunca sobre otro Admin.
        const btnOperador = (YO.es_admin && p.registrado && !p.es_admin)
          ? `<button class="btn-chip operador-toggle" data-correo="${esc(p.correo)}" data-on="${p.es_operador?'0':'1'}">${p.es_operador?'Quitar Operador':'Hacer Operador'}</button>`
          : '';
        // Revocar / cancelar invitación. Nunca a mí mismo ni a un Admin desde la UI;
        // un SuperUsuario no puede revocar a otro SuperUsuario (el servidor igual lo rechaza).
        const esYo = p.correo && (p.correo.toLowerCase() === (YO.correo||'').toLowerCase());
        // Refleja la matriz del servidor: a un Admin/Operador solo los revoca un Admin; a un
        // Super, un Admin u Operador; a un profe común, cualquiera que administre. El servidor manda.
        const puedeRevocar = !esYo && !p.es_admin && (
          p.es_operador ? YO.es_admin
          : p.es_super  ? (YO.es_admin || YO.es_operador)
          :               true);
        const btnRevocar = puedeRevocar
          ? `<button class="ico ico-del prof-quitar" data-correo="${esc(p.correo)}" data-reg="${p.registrado?'1':''}"
               title="${p.registrado?'Revocar profesor':'Cancelar invitación'}">✕</button>`
          : '';
        // Mantenedor de permisos granular (Fase 3): lo opera Admin/Operador, sobre un profesor
        // ya registrado que no sea uno mismo ni un Admin (a un Admin no se le gestionan grants:
        // salta todo por es_admin). El servidor igual valida la no-escalada.
        const btnPermisos = (accede('gestiona_permisos', YO.es_admin || YO.es_operador) && p.registrado && !esYo && !p.es_admin)
          ? `<button class="btn-chip prof-permisos" data-correo="${esc(p.correo)}">🔑 Permisos</button>`
          : '';
        return `<div style="display:flex;gap:8px;align-items:center;padding:4px 0;font-size:13px;flex-wrap:wrap">
           <span class="pro-nom">${esc(p.correo)}</span>
           <span style="color:var(--dim)">${esc(rango)}</span>
           <span style="color:var(--cyan)">${p.cursos} curso${p.cursos===1?'':'s'}</span>
           ${btnOperador}${btnSuper}${btnPermisos}${btnRevocar}
         </div>`;
      }).join('');
      document.querySelectorAll('.super-toggle').forEach(b=>b.onclick=async ()=>{
        const hacer=b.dataset.on==='1';
        if(!confirm(hacer?'¿Nombrar SuperUsuario a este profesor? Podrá administrar todos los cursos del colegio.'
                         :'¿Quitarle el rol de SuperUsuario?')) return;
        await accion(()=>SB.rpc('kimun_prof_super_fijar',{p_correo:b.dataset.correo, p_es_super:hacer}),
                     hacer?'Ahora es SuperUsuario':'Ya no es SuperUsuario');
      });
      document.querySelectorAll('.operador-toggle').forEach(b=>b.onclick=async ()=>{
        const hacer=b.dataset.on==='1';
        if(!confirm(hacer?'¿Nombrar Operador a este profesor? Podrá operar todos los cursos y gestionar SuperUsuarios, pero no tocar administradores.'
                         :'¿Quitarle el rol de Operador?')) return;
        await accion(()=>SB.rpc('kimun_prof_operador_fijar',{p_correo:b.dataset.correo, p_es_operador:hacer}),
                     hacer?'Ahora es Operador':'Ya no es Operador');
      });
      document.querySelectorAll('.prof-quitar').forEach(b=>b.onclick=async ()=>{
        const reg=b.dataset.reg==='1';
        if(!confirm(reg
          ? '¿Revocar a este profesor?\n\nPierde el acceso y sale de la lista blanca; sus cursos NO se borran (quedan sin dueño hasta reasignarlos). No afecta el desempeño de los alumnos.'
          : '¿Cancelar la invitación de este correo? Ya no podrá registrarse.')) return;
        await accion(()=>SB.rpc('kimun_prof_quitar',{p_correo:b.dataset.correo}),
                     reg?'Profesor revocado':'Invitación cancelada');
      });
      document.querySelectorAll('.prof-permisos').forEach(b=>b.onclick=()=>abrirMantenedor(b.dataset.correo));
    }
    // El árbol Sostenedor › Colegio › Cursos reparenta las tarjetas de curso ya renderizadas.
    // Va al final: corre después del render y de restaurar el estado desplegado. SOST_ARBOL y
    // porCurso están en scope.
    agruparArbol(SOST_ARBOL, porCurso);
  }
}

function conectarAcciones(){
  // El botón puede no existir: solo el admin de colegio ve "+ Crear curso".
  const bc=$('btnCurso');
  if(bc) bc.onclick=async ()=>{
    const n=($('cursoNombre').value||'').trim();
    if(!n){ aviso('Escribe un nombre.'); return; }
    const niv=($('cursoNivel')||{}).value||null;
    await accion(()=>SB.rpc('kimun_prof_curso_crear',{p_nombre:n, p_nivel:niv}), 'Curso creado');
  };
  document.querySelectorAll('.add-alumno').forEach(b=>b.onclick=async ()=>{
    const campo=document.querySelector('.in-alumno[data-curso="'+b.dataset.curso+'"]');
    const n=(campo.value||'').trim();
    if(!n){ aviso('Escribe un nombre.'); return; }
    await accion(()=>SB.rpc('kimun_prof_alumno_agregar',
      {p_curso_codigo:b.dataset.curso,p_nombre:n,p_avatar:'🦊'}), 'Alumno agregado');
  });
  // Carga masiva: un nombre por línea. Reusa la misma función, una llamada por nombre.
  document.querySelectorAll('.add-masivo').forEach(b=>b.onclick=async ()=>{
    const cod=b.dataset.curso;
    const ta=document.querySelector('.in-masivo[data-curso="'+cod+'"]');
    const nombres=(ta.value||'').split('\n').map(s=>s.trim()).filter(Boolean);
    if(!nombres.length){ aviso('Pega al menos un nombre (uno por línea).'); return; }
    b.disabled=true;
    let ok=0; const fallos=[];
    for(let i=0;i<nombres.length;i++){
      b.textContent='Agregando… '+(i+1)+'/'+nombres.length;
      try{ const {error}=await SB.rpc('kimun_prof_alumno_agregar',
             {p_curso_codigo:cod,p_nombre:nombres[i],p_avatar:'🦊'});
           if(error) throw error; ok++; }
      catch(e){ fallos.push(nombres[i]); }
    }
    await pintarLista();   // conserva el curso desplegado (ver pintarLista)
    const msg=ok+' alumno'+(ok===1?'':'s')+' agregado'+(ok===1?'':'s')
      +(fallos.length?' · '+fallos.length+' con error: '+fallos.slice(0,4).join(', ')+(fallos.length>4?'…':''):'');
    aviso(msg, fallos.length? undefined : 'var(--green)');
  });
  document.querySelectorAll('.xp').forEach(b=>b.onclick=async ()=>{
    const v=prompt('XP de este alumno:', b.dataset.xp);
    if(v===null) return;
    if(!/^\d+$/.test(v.trim())){ aviso('Escribe un número entero de 0 o más.'); return; }
    await accion(()=>SB.rpc('kimun_prof_xp_fijar',
      {p_codigo_acceso:b.dataset.cod,p_xp:parseInt(v,10)}), 'XP actualizado a '+parseInt(v,10));
  });
  document.querySelectorAll('.del').forEach(b=>b.onclick=async ()=>{
    if(!confirm('¿Eliminar a este alumno?\n\nPierde su lugar en el ranking y sus duelos. No se puede deshacer.')) return;
    await accion(()=>SB.rpc('kimun_prof_alumno_quitar',{p_codigo_acceso:b.dataset.cod}), 'Alumno eliminado');
  });
  document.querySelectorAll('.delcurso').forEach(b=>b.onclick=async (ev)=>{
    ev.stopPropagation(); ev.preventDefault();
    if(!confirm('¿Eliminar este curso?\n\nSe borran también todos sus alumnos y sus duelos. No se puede deshacer.')) return;
    await accion(()=>SB.rpc('kimun_prof_curso_quitar',{p_curso_codigo:b.dataset.cod}), 'Curso eliminado');
  });
  document.querySelectorAll('.avance').forEach(
    b=>b.onclick=()=>verAvance(b.dataset.cod, b.dataset.nom, b.dataset.gestiono==='1'));
  document.querySelectorAll('.avalum').forEach(
    b=>b.onclick=()=>verAvanceAlumno(b.dataset.pid, b.dataset.nom, b.dataset.curso));
}

/* ===== Enlace de inscripción del curso (jefe/admin) =====
   Un solo enlace vivo por curso, garantizado por un índice único en la base: crear uno
   nuevo cierra el anterior, que es lo que uno espera al pedir otro. */
async function cargarInscripcion(cursoCodigo, nivel){
  const caja=document.querySelector('.inscripcion-cuerpo[data-cod="'+cursoCodigo+'"]');
  if(!caja) return;
  caja.innerHTML='<p style="color:var(--dim);font-size:12px">Cargando…</p>';
  let fila=null;
  try{
    const {data,error}=await SB.rpc('kimun_prof_inscripcion_estado',{p_curso_codigo:cursoCodigo});
    if(error) throw error; fila=(data&&data.length)?data[0]:null;
  }catch(e){ caja.innerHTML='<p style="color:var(--pink);font-size:12px">'+errorPanel(e)+'</p>'; return; }

  const opciones=NIVELES_MUESTRA.map(n=>`<option value="${n.ruta}">${n.nombre}</option>`).join('');
  caja.innerHTML =
    (fila?`<p style="font-size:12px;margin:6px 0">
             <b style="color:var(--green)">${fila.usados} de ${fila.cupo}</b> se inscribieron ·
             ${fila.experimental?'modo experimental (capítulos abiertos, jefes cerrados)':'juego normal'}</p>
           <label class="campo">Nivel al que lleva el enlace
             <select class="ins-nivel">${opciones}</select></label>
           <input class="ins-url" readonly>
           <button class="btn ins-copiar">Copiar enlace</button>
           <div class="ins-qr" style="display:flex;justify-content:center;margin-top:12px"></div>
           <button class="btn sec ins-qr-grande" type="button" style="margin-top:8px">📱 Mostrar QR grande</button>`
        :`<p style="color:var(--dim);font-size:12px;margin:6px 0">Este curso todavía no tiene enlace.</p>`)
  + `<details style="margin-top:8px">
       <summary style="cursor:pointer;color:var(--cyan);font-size:13px;font-weight:500;list-style:none">${
         fila?'♻️ Crear otro enlace (cierra el de arriba)':'➕ Crear el enlace'}</summary>
       <p style="color:var(--dim);font-size:12px;margin:6px 0">
         ⚠️ El enlace <b>es</b> la credencial: quien lo reciba entra al curso hasta llenar el
         cupo. Ajústalo al grupo en vez de dejarlo holgado.</p>
       <label style="font-size:12px;color:var(--dim)">Cupo
         <input class="ins-cupo" type="number" min="1" max="500" value="${fila?fila.cupo:30}"></label>
       <label style="display:block;font-size:12px;color:var(--dim);margin:6px 0">
         <input class="ins-exper" type="checkbox" style="width:auto;margin-right:6px" ${
           fila&&fila.experimental?'checked':''}>
         Modo experimental: todos los capítulos abiertos y los jefes cerrados</label>
       <button class="btn sec ins-crear">Crear enlace</button>
     </details>`;

  const sel=caja.querySelector('.ins-nivel'), url=caja.querySelector('.ins-url');
