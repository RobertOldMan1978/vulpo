      // `multi` mira las filas QUE SE VEN, no el curso: con el filtro puesto hay una sola
      // asignatura a la vista y la etiqueta sobra.
      const multi = new Set(filas.map(f => String(f.oa).slice(0,4))).size > 1;
      // Agrupar por asignatura se cae si solo hay una a la vista; por UNIDAD no, que es
      // justo lo que le sirve al profe de asignatura.
      const modo = (agrupar === 'asig' && !multi) ? '' : agrupar;
      $('avCuerpo').innerHTML = filas.length
        ? cuerpoConHistorial(filas, modo, multi, true) : SIN_DATOS_ASIG;
      conectarFilasOA(cursoCodigo);
    };
    conectarFiltros(a => { filtro = a; pintarCuerpo(); });
    conectarAgrupar(v => { agrupar = v; pintarCuerpo(); });
    pintarCuerpo();
    /* ⚠️ El plan llega DESPUÉS de esta primera pintada —`cargarPlan` no se espera, para no
       dejar la pantalla en blanco mientras responde—, así que hay que repintar: sin esto,
       el corte abiertas/cerradas no aparecería hasta que el profesor tocara un filtro.
       La guarda es el NODO capturado y no el código del curso: si el usuario ya se fue a
       otra vista, ese nodo salió del documento y no hay nada que repintar — el mismo
       cuidado con el que `cargarParticipacion` evita escribir bajo el encabezado ajeno. */
    const nodoCuerpo = $('avCuerpo');
    planListo.then(() => { if(document.contains(nodoCuerpo)) pintarCuerpo(); });
    cargarRefuerzo(cursoCodigo, data);
    cargarRankingAsignatura(cursoCodigo, data);
    irArriba();
    aviso('');
  }catch(e){ aviso(errorPanel(e)); }
}

async function verAvanceAlumno(perfilId, alumnoNombre, cursoCodigo){
  aviso('Cargando…','var(--dim)');
  try{
    /* El plan va en el MISMO `Promise.all` que el avance, y no después: es lo que decide
       qué unidades están cerradas, así que pedirlo aparte dejaría la primera pintada sin
       el corte y obligaría a repintar. Aquí sí se puede esperar —son dos consultas y la
       pantalla no muestra nada hasta que llegan—, a diferencia de la vista del curso, que
       tiene mucho más que pintar mientras tanto.
       ⚠️ Su fallo NO rompe la ficha: sin plan no hay historial, que es exactamente lo que
       corresponde cuando no se sabe qué unidad terminó. */
    const [av, plan] = await Promise.all([
      SB.rpc('kimun_prof_dominio_alumno',{p_perfil:perfilId}),
      cursoCodigo ? traerPlan(cursoCodigo).catch(()=>{ PLAN_CURSO = null; })
                  : Promise.resolve()
    ]);
    const {data,error} = av;
    if(error) throw error;
    const titulo = alumnoNombre || 'Alumno';
    if(!data || !data.length){
      $('lista').innerHTML = cabeceraAvance(titulo, 'Avance por objetivo') + `
        <p style="color:var(--dim);font-size:13px">
        Este alumno todavía no tiene datos. Aparecen cuando juega las campañas.</p>
        <button class="btn sec" id="btnVolverPanel">← Volver</button>`;
      $('btnVolverCab').onclick = volverAlPanel;
      $('btnVolverPanel').onclick = volverAlPanel;
      irArriba(); aviso(''); return;
    }
    await cargarTextosOA(data.map(f => f.oa));
    $('lista').innerHTML = cabeceraAvance(titulo, 'Avance por objetivo') + `
      <p style="color:var(--dim);font-size:12px;margin-bottom:10px">
        Objetivos de este alumno, de menor a mayor acierto. ${AVISO_NO_CALIFICA}</p>
      ${filtrosAsignatura(data)}
      <div id="avCuerpo"></div>
      <button class="btn sec" id="btnVolverPanel" style="margin-top:14px">← Volver</button>`;
    $('btnVolverCab').onclick = volverAlPanel;
    $('btnVolverPanel').onclick = volverAlPanel;

    let filtro = '';
    let agrupar = '';                                 // '' | 'unidad' | 'asig'
    const pintarCuerpo = () => {
      const filas = filtro ? data.filter(f => String(f.oa).slice(0,4) === filtro) : data;
      /* ⚠️ NO `filas.map(filaAvance)`: `map` pasa el ÍNDICE como segundo argumento, así que
         `multi` valdría 0 en la primera fila y 1 en todas las demás — la etiqueta aparecería
         desde la segunda. */
      const multi = new Set(filas.map(f => String(f.oa).slice(0,4))).size > 1;
      const modo = (agrupar === 'asig' && !multi) ? '' : agrupar;
      /* `false`: la ficha de un alumno NO lleva los tres bloques del curso —"Para reforzar"
         y compañía salen del corte de 10 alumnos, y aquí el alumno es uno solo, así que
         `kimun_prof_dominio_alumno` ni siquiera devuelve `alumnos_1`—. */
      $('avCuerpo').innerHTML = filas.length
        ? cuerpoConHistorial(filas, modo, multi, false) : SIN_DATOS_ASIG;
      // Aquí la fila NO se despliega: esta vista es de un solo alumno, así que no hay
      // grupos que mostrar. Sin esto quedaría un desplegable con "Cargando…" para siempre.
      document.querySelectorAll('#avCuerpo .oa-fila').forEach(det => {
        det.querySelector('summary').style.cursor = 'default';
        det.addEventListener('click', e => e.preventDefault());   // no despliega
        // Como no se puede desplegar, el recorte a dos líneas dejaría los textos largos
        // truncados para siempre; en esta vista se muestran enteros.
        const t = det.querySelector('.oa-texto'); if(t) t.classList.remove('oa-texto');
        const d = det.querySelector('.oa-detalle'); if(d) d.remove();
      });
    };
    conectarFiltros(a => { filtro = a; pintarCuerpo(); });
    /* ⚠️ Esta línea FALTABA, y los tres botones "Agrupar por" llevaban dos sesiones
       dibujándose aquí sin responder a nada: vienen dentro de `filtrosAsignatura`, que es
       compartido, pero solo la vista del curso los cableaba. Un control que se dibuja y no
       hace nada no da ningún error — se ve igual que uno que sí funciona. */
    conectarAgrupar(v => { agrupar = v; pintarCuerpo(); });
    pintarCuerpo();
    irArriba();
    aviso('');
  }catch(e){ aviso(errorPanel(e)); }
}

// Una fila del mapa. El porcentaje es el del PRIMER intento: cuántos acertaron la primera
// vez que vieron ese contenido. El acumulado con reintentos se muestra aparte, como señal
// de cuánto costó, porque mezclarlos sesga el número (quien no entiende reintenta, y así
// pesa más en el promedio del curso).
/* `multi` = hay más de una asignatura a la vista. Solo entonces se dibuja la etiqueta:
   con el filtro puesto en Historia, poner "Historia" en las treinta filas es ruido. */
// "junio" · "junio de 2025" si fue otro año. Una hoja de diciembre se lee en marzo.
function mesLargo(t){
  const M = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto',
             'septiembre','octubre','noviembre','diciembre'];
  const d = new Date(t);
  return M[d.getMonth()] + (d.getFullYear() !== new Date().getFullYear()
    ? ' de ' + d.getFullYear() : '');
}

/* Cuándo se trabajó este objetivo. Devuelve null si el servidor no manda `ultima` —el
   esquema todavía sin aplicar—, y entonces la fila sale exactamente como antes.
   ⚠️ Dice el NÚMERO de alumnos y no un veredicto: con la fecha a secas, un solo alumno
   que repasó en noviembre haría ver como viva una unidad de abril, y cualquier umbral de
   "cuántos son suficientes" sería inventado. El profesor sabe cuántos son sus alumnos. */
function etiquetaActividad(f){
  if(!f || !f.ultima) return null;
  const t = new Date(f.ultima).getTime();
  if(!isFinite(t)) return null;
  const dias = Math.floor((Date.now() - t) / 86400000);
  // En la ficha de UN alumno el servidor no manda `recientes`: con una sola persona no hay
  // nada que distinguir entre "la clase está en esto" y "uno repasó por su cuenta".
  if(f.recientes == null)
    return {texto: dias <= 7 ? 'esta semana' : 'última vez en ' + mesLargo(t),
            clase: dias <= 30 ? 'ahora' : ''};
  const rec = Number(f.recientes) || 0;
  /* "N jugaron" y no "N alumnos": al lado va el detalle, que ya dice "21 alumnos" —los que
     aportaron un primer intento, que es OTRA cosa—, y con la misma palabra las dos cifras
     se leen como una repetición en vez de como dos datos distintos. */
  if(rec > 0) return {texto: rec + (rec===1 ? ' jugó' : ' jugaron') + ' este mes',
                      clase: 'ahora'};
  return {texto: 'sin movimiento desde ' + mesLargo(t), clase: ''};
}

function filaAvance(f, multi){
  const r1 = Number(f.resp_1)||0, o1 = Number(f.ok_1)||0;
  const total = Number(f.respondidas)||0;
  const alumnos = Number(f.alumnos_1 != null ? f.alumnos_1 : f.alumnos)||0;
  const reintentos = Math.max(0, total - r1);
  const pct = r1 ? Math.round(o1*100/r1) : 0;
  // Cortes calibrados al piso del azar: con 4 opciones, responder sin saber da 25%.
  // Un 50% no es "la mitad": es un tercio de dominio real.
  const color = pct >= 70 ? 'var(--green)' : pct >= 45 ? 'var(--gold)' : 'var(--pink)';
  // En la vista de curso el respaldo son los alumnos; en la de un alumno concreto no hay
  // tal conteo, así que se muestran sus preguntas de primer intento.
  const base = alumnos ? `${alumnos} alumno${alumnos===1?'':'s'}`
             : r1     ? `${r1} pregunta${r1===1?'':'s'}`
             : 'sin primer intento';
  const detalle = base + (reintentos ? ` · ${reintentos} reintento${reintentos===1?'':'s'}` : '');
  /* CUÁNDO se trabajó, que es lo que le faltaba al mapa: en diciembre, un 45% de abril y
     uno de la semana pasada piden cosas muy distintas y hasta ahora se veían igual. */
  const cuando = etiquetaActividad(f);
  // El detalle se pide al abrir, no al cargar la tabla: con 50 objetivos serían 50
  // llamadas por adelantado para algo que casi nunca se mira entero.
  const idOa = String(f.oa).replace(/[^A-Za-z0-9]/g,'');
  // La etiqueta va como TEXTO atenuado y no con un color por asignatura: el color de esta
  // tabla ya significa rendimiento, y un segundo eje de color compitiendo con ese haría
  // más difícil justo lo que la tabla existe para ver.
  const asig = multi ? ASIG_NOMBRE[String(f.oa).slice(0,4)] : '';
  return `<details class="oa-fila" data-oa="${esc(f.oa)}" id="oa-${idOa}"
                   style="padding:8px 0;border-bottom:1px solid var(--linea)">
    <summary style="cursor:pointer;list-style:none">
      <div class="oa-texto">${asig?`<span class="oa-asig">${esc(asig)}</span>`:''}${esc(OA_TEXTO[f.oa]||f.oa)}</div>
      <div class="oa-medida" style="display:flex;align-items:center;gap:8px">
        <div style="flex:1;height:8px;background:#ffffff14;border-radius:4px;overflow:hidden">
          <div style="width:${pct}%;height:100%;background:${color}"></div>
        </div>
        <b style="color:${color};min-width:42px;text-align:right">${pct}%</b>
        <small style="color:var(--dim);min-width:120px;text-align:right">${detalle}</small>
        ${cuando ? `<small class="oa-cuando ${cuando.clase}">${esc(cuando.texto)}</small>` : ''}
      </div>
    </summary>
    <div class="oa-detalle" style="padding-top:6px;color:var(--dim);font-size:12px">Cargando…</div>
  </details>`;
}

// Reparte a los alumnos de un objetivo en cuatro grupos. Los umbrales son los mismos que
// los colores del mapa (45 y 70), que ya están calibrados al piso del azar.
// "Sin evidencia" recoge a quienes no lo jugaron y a quienes tienen menos de 4 preguntas
// de primer intento: con una sola pregunta —caso típico de un jefe final, donde cae una de
// cada objetivo— un alumno queda en 0% o 100%, y mandarlo al refuerzo por eso sería una
// decisión injusta tomada sobre nada.
const APOYO_MIN_PREGUNTAS = 4;
function gruposApoyo(filas){
  const g = {apoyo:[], camino:[], logrado:[], sinDatos:[]};
  (filas||[]).forEach(f => {
    const r1 = Number(f.resp_1)||0, o1 = Number(f.ok_1)||0;
    if(r1 < APOYO_MIN_PREGUNTAS){ g.sinDatos.push(f); return; }
    const pct = o1*100/r1;
    if(pct <  45) g.apoyo.push(f);
    else if(pct < 70) g.camino.push(f);
    else g.logrado.push(f);
  });
  return g;
}

// Los nombres van como fichas en línea: 35 alumnos en columna serían cuatro pantallas
// en un teléfono. Sin porcentaje individual, a propósito: esta vista sirve para armar un
// grupo de refuerzo, no para comparar niños entre sí.
function fichasAlumnos(filas){
  return filas.map(f =>
    `<span style="display:inline-block;background:#ffffff14;border-radius:12px;
                  padding:3px 9px;margin:2px 3px 2px 0;font-size:12px">
       ${esc(f.avatar||'🦊')} ${esc(f.alumno)}</span>`).join('');
}

// Un grupo de alumnos como fichas dentro de un <details>. Compartido por la vista de
// apoyo (por objetivo) y por la de participación (por curso).
function grupoFichas(titulo, lista, color, plegado, nota){
  return !lista.length ? '' : `
    <details ${plegado?'':'open'} style="margin:6px 0 6px 10px">
      <summary style="color:${color};font-size:12px;cursor:pointer;padding:3px 0">
        ${titulo} (${lista.length})</summary>
      <div style="padding:4px 0">${fichasAlumnos(lista)}</div>
      ${nota?`<p style="color:var(--dim);font-size:11px;margin:2px 0 0">${nota}</p>`:''}
    </details>`;
}

function detalleApoyo(filas){
  const g = gruposApoyo(filas);
  return grupoFichas('Necesitan apoyo', g.apoyo, 'var(--pink)', false, '')
       + grupoFichas('En camino', g.camino, 'var(--gold)', false, '')
       + grupoFichas('Lo lograron', g.logrado, 'var(--green)', true, '')
       + grupoFichas('Todavía sin evidencia', g.sinDatos, 'var(--dim)', true,
               'No lo han jugado, o respondieron muy pocas preguntas para saberlo.');
}

// Separa por base en vez de atenuar. Ordenar de peor a mejor y a la vez atenuar las bases
// pequeñas se peleaba: la posición decía "mira esto primero" y la opacidad decía "ignora
// esto", de modo que la primera fila podía ser justo la menos confiable.
/* `agrupar` NO reemplaza los tres bloques: los SUBDIVIDE. Con 46 objetivos para reforzar
   mezclando cuatro asignaturas no se ve de cuál es cada uno, pero cambiar el corte a
   "una sección por asignatura" perdería la distinción entre lo que hay que reforzar, lo
   que va bien y lo que todavía no tiene base — que es justo lo que este panel aporta.
   Así se conservan las dos lecturas: primero qué hacer, después de qué materia. */
/* Las fechas planificadas de una unidad, para el encabezado de su grupo en el mapa. La
   clave es la misma que usa la planificación ('HI08|U1'), así que el mapa y esa pantalla
   no pueden discrepar. Vacío si nadie las declaró: la ausencia no estorba.
   ⚠️ `conSello` va en FALSE dentro del historial y de la sección de las futuras: ahí el
   encabezado de la sección ya dice el estado, y repetir "📚 Terminada" en cada unidad de
   una lista que se llama "unidades ya terminadas" es ruido. Donde sí aporta es agrupando
   por unidad arriba y en la planificación del año, que no tienen ese encabezado. */
function fechasDeUnidad(clave, conSello){
  const p = PLAN[clave];
  if(!p || (!p.inicio && !p.termino)) return '';
  const [asig, uid] = String(clave).split('|');
  return (conSello ? selloUnidad(asig, uid) : '')
    + ` <span class="oa-grupo-fechas">${esc(fechaCortita(p.inicio)||'?')} → ${
    esc(fechaCortita(p.termino)||'?')}</span>`;
}

/* El agrupado de una lista de objetivos: por asignatura, por unidad, o plano.
   ⚠️ Vive APARTE de `bloquesAvance` porque lo usan las DOS vistas y no pueden compartir
   esa: la del curso reparte en "Para reforzar / Van bien / Pocos datos" con el corte de
   10 alumnos, y `kimun_prof_dominio_alumno` **no devuelve `alumnos_1`** —es un alumno—,
   así que ahí todo caería en "pocos datos", que además va plegado. */
function agruparFilas(data, agrupar, multi){
  // Agrupado: en el orden canónico del curso, y el orden DENTRO de cada asignatura es el
  // que ya traía el servidor (de peor a mejor), así que no se reordena nada.
  const porAsignatura = filas => {
    const g = {};
    filas.forEach(f => { const a = String(f.oa).slice(0,4); (g[a]=g[a]||[]).push(f); });
    return ASIG_ORDEN.filter(a => g[a]).map(a => `
      <div class="oa-grupo">
        <div class="oa-grupo-tit">${esc(ASIG_NOMBRE[a]||a)} <span>(${g[a].length})</span></div>
        ${g[a].map(f => filaAvance(f, false)).join('')}
      </div>`).join('');
  };
  /* Por UNIDAD, que es como el profesor piensa su año: "la unidad 2 la pasé en junio".
     Sale gratis porque el oa.json de cada banco ya declara qué objetivos tiene cada unidad
     —medido: los 32 bancos, sin un solo objetivo fuera de alguna—.
     ⚠️ 9 objetivos de Lenguaje de 3° están en MÁS de una unidad (uno en cuatro), porque
     sus capítulos son temáticos y un objetivo transversal se trabaja en varios. Se agrupan
     en la PRIMERA, para que una fila siga siendo un objetivo y los conteos del bloque
     cuadren con su encabezado. La contra, asumida: en ese banco una unidad se ve sin un
     objetivo que también le toca. `OA_UNIDAD[oa].ids` guarda todas por si hace falta. */
  const porUnidad = filas => {
    const g = {};
    filas.forEach(f => {
      const u = OA_UNIDAD[f.oa];
      const asig = String(f.oa).slice(0,4);
      const k = u ? asig + '|' + u.id : '_sin';
      if(!g[k]) g[k] = {
        asig, orden: u ? u.orden : 99,
        tit: u ? u.titulo : 'Sin unidad declarada', filas: []
      };
      g[k].filas.push(f);
    });
    // Orden CURRICULAR —por asignatura y luego por unidad—, no el del servidor (de peor a
    // mejor), que mezclaría las unidades entre sí. Un año se lee en su orden.
    return Object.keys(g).sort((a,b) => {
      const A = g[a], B = g[b];
      const ia = ASIG_ORDEN.indexOf(A.asig), ib = ASIG_ORDEN.indexOf(B.asig);
      return ia !== ib ? ia - ib : A.orden - B.orden;
    }).map(k => `
      <div class="oa-grupo">
        <div class="oa-grupo-tit">${multi && ASIG_NOMBRE[g[k].asig]
            ? esc(ASIG_NOMBRE[g[k].asig]) + ' · ' : ''}${esc(g[k].tit)}
          <span>(${g[k].filas.length})</span>${fechasDeUnidad(k, true)}</div>
        ${g[k].filas.map(f => filaAvance(f, false)).join('')}
      </div>`).join('');
  };
  return agrupar === 'asig'   ? porAsignatura(data)
       : agrupar === 'unidad' ? porUnidad(data)
       : data.map(f => filaAvance(f, multi)).join('');
}

function bloquesAvance(data, agrupar, multi){
  const conBase = data.filter(f => (Number(f.alumnos_1)||0) >= 10);
  const sinBase = data.filter(f => (Number(f.alumnos_1)||0) <  10);
  const pctDe = f => (Number(f.resp_1)||0) ? (Number(f.ok_1)||0)*100/(Number(f.resp_1)||1) : 0;
  const reforzar = conBase.filter(f => pctDe(f) <  70);
  const bien     = conBase.filter(f => pctDe(f) >= 70);
  const cuerpo = filas => agruparFilas(filas, agrupar, multi);
  const seccion = (titulo, filas, plegada) => !filas.length ? '' : `
    <details ${plegada?'':'open'} style="margin-bottom:10px">
      <summary style="color:var(--cyan);font-size:13px;cursor:pointer;padding:6px 0">
        ${titulo} (${filas.length})</summary>
      ${cuerpo(filas)}
    </details>`;
  return seccion('Para reforzar', reforzar, false)
       + seccion('Van bien', bien, false)
       + seccion('Todavía con pocos datos', sinBase, true);
}

/* ===== Lo que está en curso arriba, lo cerrado al historial =====
   Responde la pregunta con la que Roberto abrió la planificación: *"no sirve mostrar
   avances en diciembre de asignaturas que se pasaron en abril"*. El mapa mezclaba los
   objetivos del año entero y los mostraba igual, así que un 45% no decía si hay que actuar
   o si eso ya se cerró hace ocho meses.

   ⚠️ **Sin una sola unidad cerrada la pantalla queda EXACTAMENTE como antes**, sin
   encabezado y sin sección extra, y eso no es una comodidad: la planificación es opcional
   y hoy casi ningún curso la tiene llena. Una feature que le cambia la pantalla a quien no
   la usa es una feature que estorba.

   ⚠️ **El historial NO lleva los tres bloques** (Para reforzar / Van bien / Pocos datos):
   decirle "refuerza esto" sobre una unidad que ya se cerró es justo el problema que esto
   viene a resolver. Va por asignatura, que es como se busca algo pasado. */
function cuerpoConHistorial(data, agrupar, multi, conBloques){
  const armar = filas => conBloques ? bloquesAvance(filas, agrupar, multi)
                                    : agruparFilas(filas, agrupar, multi);
  const por = {clases:[], futura:[], cerrada:[], '':[]};
  data.forEach(f => por[estadoDeOA(f.oa)].push(f));
  // Sin fechas no hay estado, así que esos objetivos van con lo que se está pasando: es
  // donde el profesor los busca, y sacarlos de ahí castigaría al curso sin planificar.
  const ahora = por.clases.concat(por['']);
  if(!por.cerrada.length && !por.futura.length) return armar(data);   // nada que separar

  const E = ESTADO_UNIDAD;
  return `<div class="av-corte">${E.clases.ico} ${E.clases.txt} <span>(${ahora.length})</span></div>
    <p class="av-corte-sub">Lo que el curso está pasando en estas semanas.${
      por.futura.length ? ` Hay ${por.futura.length} objetivo${por.futura.length>1?'s':''} de
      unidades que todavía no empiezan y ` : ' Los '}${
      por.cerrada.length ? `${por.cerrada.length} de unidades ya terminadas` : 'ninguna terminada'
      }, más abajo.</p>`
    + (ahora.length ? armar(ahora) : `
       <p class="av-corte-vacio">Ninguna unidad en clases tiene objetivos medidos todavía.</p>`)
    /* Las que no empiezan van PLEGADAS y en su propia sección: si tienen datos es porque
       alguien jugó adelantado, así que son información y no una tarea de esta semana. */
    + (!por.futura.length ? '' : `
      <details class="av-hist av-futura" style="margin-top:14px">
        <summary>${E.futura.ico} ${E.futura.txt} <span>(${por.futura.length})</span></summary>
        <p class="av-hist-nota">Sus unidades empiezan más adelante. Si ya hay respuestas es
          porque algún alumno se adelantó jugando por su cuenta, no porque el curso las
          esté viendo.</p>
        ${agruparFilas(por.futura, 'unidad', multi)}
      </details>`)
    + (!por.cerrada.length ? '' : historialHTML(por.cerrada));
}

/* El historial: por ASIGNATURA, plegado y con su fecha de cierre. Plegado porque es
   consulta y no acción — quien entra al mapa viene a decidir qué hacer esta semana—, y por
   asignatura porque así se busca algo pasado: "¿cómo quedó Historia?". */
function historialHTML(filas){
  const g = {};
  filas.forEach(f => { const a = String(f.oa).slice(0,4); (g[a]=g[a]||[]).push(f); });
  const cuerpo = ASIG_ORDEN.filter(a => g[a]).map(a => {
    // Dentro de la asignatura, por unidad y en orden curricular: un año se lee en su orden,
    // no de peor a mejor, que mezclaría abril con octubre.
    const porU = {};
    g[a].forEach(f => {
      const u = OA_UNIDAD[f.oa];
      const k = u ? u.id : '_sin';
      if(!porU[k]) porU[k] = {orden: u ? u.orden : 99,
                              tit: u ? u.titulo : 'Sin unidad declarada',
                              clave: claveUnidad(a, u ? u.id : ''), filas: []};
      porU[k].filas.push(f);
    });
    const unidades = Object.keys(porU).sort((x,y) => porU[x].orden - porU[y].orden);
    return `<div class="hist-asig">
      <div class="hist-asig-tit">${esc(ASIG_NOMBRE[a]||a)} <span>(${g[a].length})</span></div>
      ${unidades.map(k => `
        <div class="oa-grupo">
          <div class="oa-grupo-tit">${esc(porU[k].tit)}
            <span>(${porU[k].filas.length})</span>${fechasDeUnidad(porU[k].clave, false)}</div>
          ${porU[k].filas.map(f => filaAvance(f, false)).join('')}
        </div>`).join('')}
    </div>`;
  }).join('');
  return `<details class="av-hist" style="margin-top:16px">
    <summary>📚 Historial · unidades terminadas <span>(${filas.length})</span></summary>
    <p class="av-hist-nota">Su fecha de término ya pasó, así que este porcentaje es el
      registro de cómo quedaron, no una tarea de esta semana. Para ver el curso <b>tal como
      estaba al cerrar</b> una unidad —y no como está hoy— usa <b>📸 Cómo quedó</b> en la
      planificación.</p>
    ${cuerpo}
  </details>`;
}

async function reiniciarMediciones(cursoCodigo, cursoNombre, gestiono){
  if(!confirm('¿Reiniciar las mediciones de este curso?\n\n'+
    'Los porcentajes vuelven a cero y se empieza a medir de nuevo. Sirve al comenzar una '+
    'unidad o un semestre. No se borra ningún alumno ni su XP, pero las mediciones '+
    'anteriores no se pueden recuperar.')) return;
  try{
    const {error}=await SB.rpc('kimun_prof_dominio_reiniciar',{p_curso_codigo:cursoCodigo});
    if(error) throw error;
    await verAvance(cursoCodigo, cursoNombre, gestiono);
    aviso('Mediciones reiniciadas','var(--green)');
  }catch(e){ aviso(errorPanel(e)); }
}

// Ejecuta una acción, informa y refresca la lista. Centraliza el manejo de errores:
// supabase-js no lanza excepción cuando la función SQL falla, devuelve {data, error}.
async function accion(fn, exito){
  try{
    const {error}=await fn();
    if(error) throw error;
    await pintarLista();
    aviso(exito,'var(--green)');
  }catch(e){
    aviso(errorPanel(e));                   // ver el comentario de errorPanel
    try{ await pintarLista(); }catch(_){}   // refresca para mostrar la realidad
  }
}

async function limpiarPruebas(){
  try{
    const {data:n,error}=await SB.rpc('kimun_prof_limpiar_pruebas',{p_ejecutar:false});
    if(error) throw error;
    if(!n){ aviso('No hay perfiles de prueba','var(--green)'); return; }
    if(!confirm('Se van a borrar '+n+' perfil'+(n===1?'':'es')+' de prueba.\n\n'+
      'Son los que se crean solos cuando alguien abre el juego y nunca escribió un código de alumno.\n\n'+
      'También se pierden sus duelos. No se borran los alumnos inscritos ni los rivales de práctica.\n\n¿Continuar?')) return;
    const {data:b,error:e2}=await SB.rpc('kimun_prof_limpiar_pruebas',{p_ejecutar:true});
    if(e2) throw e2;
    await pintarLista();
    aviso('Se borraron '+b+' perfil'+(b===1?'':'es')+' de prueba','var(--green)');
  }catch(e){ aviso(traducir(e)); }
}

.mant-cerrar:hover{color:var(--texto)}
.mant-modal hr{border:0;border-top:1px solid var(--linea);margin:14px 0}
.mant-h3{font-size:13px;margin:0 0 8px}
.mant-grant{border:1px solid var(--linea);border-radius:8px;padding:8px 10px;margin:6px 0;
  display:flex;gap:8px;align-items:flex-start}
.mant-grant .g-ambito{font-weight:600;font-size:13px}
.mant-grant .g-caps{color:var(--dim);font-size:11px;margin-top:2px;line-height:1.4}
.mant-ambito{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:8px}
.mant-radio{font-size:13px;display:flex;align-items:center;gap:5px}
.mant-radio input,.mant-cap input{width:auto;margin:0}
.mant-nodo{margin-bottom:10px}
.mant-nodo select{width:100%;max-width:none;padding:8px;border-radius:8px;background:var(--fondo);
  color:var(--texto);border:1px solid var(--linea);font-family:inherit;font-size:13px}
.mant-mats{margin-top:8px;padding:8px;border:1px dashed var(--linea);border-radius:8px}
.mant-mats-h{font-size:11px;color:var(--dim);margin-bottom:4px}
.mant-presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.mant-lbl{font-size:12px;color:var(--dim)}
.mant-total{margin:2px 0 8px;font-size:14px}
.mant-cat{border:1px solid var(--linea);border-radius:8px;padding:8px 10px;margin:8px 0}
.mant-cat h4{margin:0 0 4px;font-size:12px;color:var(--cyan);display:flex;justify-content:space-between;align-items:center}
.mant-catall{background:none;border:0;color:var(--violet);font-family:inherit;font-size:11px;cursor:pointer;padding:2px 4px}
.mant-cap{display:flex;gap:8px;align-items:flex-start;padding:3px 0;font-size:13px;line-height:1.3}
.mant-msg{font-size:12px;min-height:16px;margin:8px 0}
</style>
<div id="mantOverlay"><div class="mant-modal">
  <button class="mant-cerrar" id="mantCerrar" aria-label="Cerrar">✕</button>
  <h2>🔑 Editar permisos</h2>
  <p class="mant-sub" id="mantCorreo"></p>
  <div id="mantGrants"></div>
  <hr>
  <div id="mantEditor"></div>
</div></div>
<script>
// Etiquetas legibles de cada capacidad (los códigos son estables; esto es lo que ve el humano).
const CAP_LABEL = {
  'curso.crear':'Crear cursos','curso.borrar':'Borrar cursos','curso.nivel':'Fijar el nivel del curso',
  'alumno.gestionar':'Gestionar alumnos (agregar, XP, borrar)','inscripcion.crear':'Crear enlace de inscripción',
  'dominio.reiniciar':'Reiniciar mediciones',
  'equipo.jefe':'Nombrar/quitar Profesor Jefe','equipo.asignatura':'Agregar/editar profes de asignatura',
  'avance.ver':'Ver el avance','pulso.ver':'Ver el pulso del colegio','plan.fijar':'Fijar fechas de las unidades',
  'plan.historial':'Ver el historial de planificación','refuerzo.gestionar':'Lanzar/cerrar refuerzos',
  'profesor.autorizar':'Autorizar/revocar profesores','permisos.gestionar':'Operar el mantenedor de permisos',
  'perfiles.limpiar':'Limpiar perfiles de prueba','enlace.armar':'Armar enlaces de muestra'
};
// Las cuatro categorías del spec §2.1, en el orden en que se muestran.
const CAP_CATS = [
  ['Cursos y alumnos', ['curso.crear','curso.borrar','curso.nivel','alumno.gestionar','inscripcion.crear','dominio.reiniciar']],
  ['Equipo', ['equipo.jefe','equipo.asignatura']],
  ['Seguimiento', ['avance.ver','pulso.ver','plan.fijar','plan.historial','refuerzo.gestionar']],
  ['Administración', ['profesor.autorizar','permisos.gestionar','perfiles.limpiar','enlace.armar']]
];
const MANT = { correo:null, caps:[], sostenedores:[], colegios:[], cursos:[], grants:[], sel:null };

function mantErr(e){ try{ return errorPanel(e); }catch(_){ return (e&&e.message)||String(e); } }
function mantAviso(t,color){ const m=$('mantMsg'); if(m){ m.textContent=t||''; m.style.color=color||'var(--pink)'; } }

async function abrirMantenedor(correo){
  MANT.correo=correo; $('mantCorreo').textContent=correo;
  $('mantGrants').innerHTML='<p style="color:var(--dim);font-size:12px">Cargando…</p>'; $('mantEditor').innerHTML='';
  $('mantOverlay').classList.add('on');
  try{
    if(!MANT.caps.length){ const {data}=await SB.rpc('kimun_prof_capacidades_todas'); MANT.caps=data||[]; }
    const {data:sosts}=await SB.rpc('kimun_prof_sostenedores'); MANT.sostenedores=sosts||[];
    MANT.colegios=[];
    for(const s of MANT.sostenedores){
      const {data:cols}=await SB.rpc('kimun_prof_colegios',{p_sostenedor:s.id});
      (cols||[]).forEach(c=>MANT.colegios.push({id:c.id, nombre:c.nombre}));
    }
    const {data:cursos}=await SB.rpc('kimun_prof_cursos'); MANT.cursos=cursos||[];
    await cargarGrants();
    renderEditor();
  }catch(e){ $('mantGrants').innerHTML='<p style="color:var(--pink);font-size:12px">'+esc(mantErr(e))+'</p>'; }
}

async function cargarGrants(){
  const {data:grants,error}=await SB.rpc('kimun_prof_permisos_ver',{p_correo:MANT.correo});
  if(error) throw error;
  MANT.grants=grants||[]; renderGrants();
}

function renderGrants(){
  if(!MANT.grants.length){
    $('mantGrants').innerHTML='<p style="color:var(--dim);font-size:12px">Sin permisos asignados por el mantenedor. '+
      'Puede tener acceso por su rol clásico (Super/Operador/equipo) mientras no se apague en el cutover.</p>';
    return;
  }
  $('mantGrants').innerHTML = MANT.grants.map(g=>{
    const mat=(g.asignaturas&&g.asignaturas.length)?' · '+g.asignaturas.map(a=>esc((window.NIV&&NIV.nombre)?NIV.nombre(a):a)).join(', '):'';
    return `<div class="mant-grant">
      <div style="flex:1">
        <div class="g-ambito">${esc(g.ambito_nombre||g.ambito_tipo)}${mat}</div>
        <div class="g-caps">${g.capacidades.length} capacidad${g.capacidades.length===1?'':'es'}: ${g.capacidades.map(c=>esc(CAP_LABEL[c]||c)).join(' · ')}</div>
      </div>
      <button class="btn-chip g-editar" data-id="${esc(g.id)}">Editar</button>
      <button class="ico ico-del g-revocar" data-id="${esc(g.id)}" title="Revocar este grant">✕</button>
    </div>`;
  }).join('');
  document.querySelectorAll('.g-revocar').forEach(b=>b.onclick=async ()=>{
    if(!confirm('¿Revocar este grant? El usuario pierde estas capacidades sobre ese ámbito.')) return;
    try{ const {error}=await SB.rpc('kimun_prof_permisos_revocar',{p_id:b.dataset.id}); if(error) throw error;
      await cargarGrants(); mantAviso('Grant revocado','var(--green)');
    }catch(e){ mantAviso(mantErr(e)); }
  });
  document.querySelectorAll('.g-editar').forEach(b=>b.onclick=()=>{
    const g=MANT.grants.find(x=>x.id===b.dataset.id); if(g) renderEditor(g);
  });
}

// El editor de UN grant. Si se pasa `g`, precarga su ámbito y capacidades (Editar); si no, parte
// en un curso vacío. Todo el estado vive en MANT.sel y cada interacción re-pinta desde ahí.
function renderEditor(g){
  MANT.sel = {
    tipo: g? g.ambito_tipo : 'curso',
    id:   g? g.ambito_id : (MANT.cursos[0]?MANT.cursos[0].id:null),
    materias: new Set((g&&g.asignaturas)||[]),
    checked:  new Set((g&&g.capacidades)||[])
  };
  pintarEditor();
}

function pintarEditor(){
  const sel=MANT.sel;
  const tipos=[['plataforma','Plataforma'],['sostenedor','Sostenedor'],['colegio','Colegio'],['curso','Curso']];
  const radios=tipos.map(([t,l])=>`<label class="mant-radio"><input type="radio" name="mant-ambito" value="${t}" ${sel.tipo===t?'checked':''}> ${l}</label>`).join('');
  let nodo='';
  if(sel.tipo==='sostenedor'){
    nodo=`<select id="mantNodo">${MANT.sostenedores.map(s=>`<option value="${esc(s.id)}" ${sel.id===s.id?'selected':''}>${esc(s.nombre)}</option>`).join('')}</select>`;
  }else if(sel.tipo==='colegio'){
    nodo=`<select id="mantNodo">${MANT.colegios.map(c=>`<option value="${esc(c.id)}" ${sel.id===c.id?'selected':''}>${esc(c.nombre)}</option>`).join('')}</select>`;
  }else if(sel.tipo==='curso'){
    nodo=`<select id="mantNodo">${MANT.cursos.map(c=>`<option value="${esc(c.id)}" ${sel.id===c.id?'selected':''}>${esc(c.nombre)}${c.nivel?' ('+esc(c.nivel)+'°)':''}</option>`).join('')}</select>`;
    const cur=MANT.cursos.find(c=>c.id===sel.id);
    const mats=(cur&&cur.nivel&&window.NIV&&NIV.deNivel)?NIV.deNivel(cur.nivel):[];
    if(mats.length){
      nodo+=`<div class="mant-mats"><div class="mant-mats-h">Materias (vacío = todas):</div>`+
        mats.map(m=>`<label class="mant-cap"><input type="checkbox" class="mant-mat" value="${esc(m)}" ${sel.materias.has(m)?'checked':''}> ${esc(NIV.nombre?NIV.nombre(m):m)}</label>`).join('')+`</div>`;
    }
  }
  const total=MANT.caps.length && sel.checked.size===MANT.caps.length;
  const cats=CAP_CATS.map(([nom,codes])=>{
    const items=codes.map(c=>`<label class="mant-cap"><input type="checkbox" class="mant-cap-cb" value="${c}" ${sel.checked.has(c)?'checked':''}> ${esc(CAP_LABEL[c]||c)}</label>`).join('');
    return `<div class="mant-cat"><h4>${esc(nom)} <button class="mant-catall" data-cat="${esc(nom)}">marcar todas</button></h4>${items}</div>`;
  }).join('');
  const presets=[['sostenedor','Sostenedor'],['super','Super'],['jefe','Jefe'],['asignatura','Asignatura']]
    .map(([p,l])=>`<button class="btn-chip mant-preset" data-preset="${p}">${l}</button>`).join('');
  $('mantEditor').innerHTML=`
    <h3 class="mant-h3">Agregar o reemplazar un permiso</h3>
    <div class="mant-ambito">${radios}</div>
    <div class="mant-nodo">${nodo}</div>
    <div class="mant-presets"><span class="mant-lbl">Aplicar rol:</span> ${presets}</div>
    <label class="mant-cap mant-total"><input type="checkbox" id="mantTotal" ${total?'checked':''}> <b>Acceso total</b></label>
    ${cats}
    <div id="mantMsg" class="mant-msg"></div>
    <button class="btn" id="mantGuardar">Guardar</button>`;
  wireEditor();
}

function wireEditor(){
  const sel=MANT.sel;
  document.querySelectorAll('input[name=mant-ambito]').forEach(r=>r.onchange=()=>{
    sel.tipo=r.value;
    sel.id = sel.tipo==='sostenedor' ? (MANT.sostenedores[0]&&MANT.sostenedores[0].id)
           : sel.tipo==='colegio'    ? (MANT.colegios[0]&&MANT.colegios[0].id)
           : sel.tipo==='curso'      ? (MANT.cursos[0]&&MANT.cursos[0].id) : null;
    sel.materias=new Set(); pintarEditor();
  });
  const nodo=$('mantNodo'); if(nodo) nodo.onchange=()=>{ sel.id=nodo.value; sel.materias=new Set(); pintarEditor(); };
  document.querySelectorAll('.mant-cap-cb').forEach(cb=>cb.onchange=()=>{
    if(cb.checked) sel.checked.add(cb.value); else sel.checked.delete(cb.value); pintarEditor();
  });
  document.querySelectorAll('.mant-mat').forEach(cb=>cb.onchange=()=>{
    if(cb.checked) sel.materias.add(cb.value); else sel.materias.delete(cb.value);
  });
  document.querySelectorAll('.mant-catall').forEach(b=>b.onclick=()=>{
    const cat=CAP_CATS.find(c=>c[0]===b.dataset.cat); const all=cat[1].every(c=>sel.checked.has(c));
    cat[1].forEach(c=>all?sel.checked.delete(c):sel.checked.add(c)); pintarEditor();
  });
  document.querySelectorAll('.mant-preset').forEach(b=>b.onclick=async ()=>{
    const {data:caps}=await SB.rpc('kimun_prof_preset',{p_nombre:b.dataset.preset});
    sel.checked=new Set(caps||[]); pintarEditor();
  });
  const t=$('mantTotal'); if(t) t.onchange=()=>{ sel.checked = t.checked ? new Set(MANT.caps) : new Set(); pintarEditor(); };
  $('mantGuardar').onclick=guardarGrant;
}

async function guardarGrant(){
  const sel=MANT.sel;
  if(sel.tipo!=='plataforma' && !sel.id){ mantAviso('Elige un ámbito.'); return; }
  const caps=[...sel.checked];
  const mats=sel.tipo==='curso'?[...sel.materias]:[];
  try{
    const {error}=await SB.rpc('kimun_prof_permisos_fijar',{
      p_correo:MANT.correo, p_ambito_tipo:sel.tipo,
      p_ambito_id: sel.tipo==='plataforma'?null:sel.id,
      p_capacidades:caps, p_asignaturas:mats});
    if(error) throw error;
    await cargarGrants();
    mantAviso(caps.length?'Permiso guardado':'Grant quitado (sin capacidades = revocar ese ámbito)','var(--green)');
  }catch(e){ mantAviso(mantErr(e)); }
}

$('mantCerrar').onclick=()=>$('mantOverlay').classList.remove('on');
$('mantOverlay').onclick=(e)=>{ if(e.target===$('mantOverlay')) $('mantOverlay').classList.remove('on'); };
</script>
</body>
</html>
