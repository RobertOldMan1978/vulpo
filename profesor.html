<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>VULPO · Profesores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=Titan+One&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/kimun-180.png">
<!-- supabase-js auto-hospedado (no desde CDN): el panel maneja la sesión del profesor, así
     que un CDN comprometido podría exfiltrar su sesión. Versión fija 2.112.4. -->
<!-- Catálogo de niveles y asignaturas, compartido. Agregar un curso es una fila ahí. -->
<script src="assets/js/niveles.js"></script>
<script>/* Respaldo: un 404 de niveles.js degrada el panel a mostrar códigos en vez de
   nombres, pero NO lo tumba. Sin esto, `NIV` sin definir mataría todo el JavaScript y el
   síntoma engaña: la pantalla se ve bien y ningún botón responde. */
if(!window.NIV) window.NIV={ASIGS:{},NIVELES:[],TRANSVERSALES:{},ETIQUETA_8:{},
 codigos:function(){return[];}, nombre:function(c){return c;},
 carpeta:function(){return null;}, deNivel:function(){return[];},
 asigDe:function(o){return String(o||"").slice(0,4)||null;}};</script>
<script src="assets/vendor/supabase-js-2.112.4.min.js"></script>
<style>
:root{--gold:#ffc93c;--cyan:#4dd8ff;--green:#3ee089;--pink:#ff4d8d;--violet:#8f6bff;
 --dim:#a89fd6;--panel:#241d4e}
*{box-sizing:border-box}
body{margin:0;background:#140f33;color:#fff;font-family:Nunito,sans-serif;font-weight:800;
 padding:16px;max-width:480px;margin:0 auto}
/* El panel del profesor lo usan adultos, casi siempre en un computador. En pantallas
   anchas se ensancha para que las tablas de avance respiren y se acorte el scroll; en
   el teléfono sigue en 480px (mobile-first, por si un profe lo mira desde el móvil). */
@media (min-width:760px){ body{max-width:880px} }
/* Los campos y textos largos no deben estirarse a lo ancho de 880px: se leen mejor
   acotados. Las tablas, acordeones y filas sí aprovechan todo el ancho. */
@media (min-width:760px){
  body input:not([type=checkbox]):not([type=radio]), body textarea{max-width:460px}
  .card > p, #lista > p{max-width:70ch}
}
h1{font-family:'Titan One',cursive;color:var(--gold);font-size:28px;text-align:center;margin:12px 0}
.card{background:var(--panel);border:2px solid #ffffff14;border-radius:16px;padding:16px;margin-bottom:14px}
.card h3{margin:0 0 12px;font-size:16px;color:var(--cyan)}
input,textarea,select{width:100%;padding:12px;border-radius:12px;border:2px solid var(--violet);
 background:#1a1440;color:#fff;font-weight:800;margin-bottom:10px;font-family:inherit}
textarea{resize:vertical;line-height:1.4;font-weight:600}
.btn{width:100%;padding:13px;border:0;border-radius:14px;background:var(--gold);color:#2a1c00;
 font-family:inherit;font-weight:900;font-size:15px;cursor:pointer;margin-bottom:8px}
.btn.sec{background:var(--violet);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.msg{text-align:center;font-size:13px;margin-top:8px;min-height:18px}
.hide{display:none}
code{color:var(--cyan);font-weight:900}
/* Marca del alumno que se inscribio solo: su nombre NO lo escribio el profesor. Va en
   la linea de abajo, no junto al nombre: la fila de arriba es la que desbordo a 375 px
   en la Sesion 26 y no se le suma nada. */
.ins-chip{color:var(--gold);font-weight:900}
/* El triángulo por omisión del desplegable se oculta: la fila del mapa ya se ve
   pulsable, y en WebKit "list-style:none" por sí solo no lo quita. */
.oa-fila>summary::-webkit-details-marker{display:none}
/* Igual para el bloque de participación: su summary usa list-style:none, que en
   Safari no basta para ocultar el triángulo (ver Sesión 25). */
#partBloque>summary::-webkit-details-marker{display:none}

/* Filas de curso y de alumno, en dos líneas. En un teléfono de 375 px el nombre, el
   código, el XP y los botones no caben en la misma fila: el nombre no podía encogerse
   (flex:1 sin min-width:0) y el panel entero se desplazaba de lado. */
.cur-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.cur-nom,.alu-nom,.pro-nom{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;
 white-space:nowrap}
.alu{padding:6px 0;border-bottom:1px solid #ffffff14}
.alu-top{display:flex;align-items:center;gap:6px}
.alu-sub{font-size:12px;color:var(--dim);margin-top:2px}
.prof-id{font-weight:900;color:var(--cyan);font-size:14px;margin-bottom:2px}
/* Acordeón de cursos y de alumnos */
.curso{border:1px solid #ffffff22;border-radius:12px;margin-bottom:10px;overflow:hidden}
.curso>summary,.alumnos>summary{cursor:pointer;list-style:none;display:flex;
  align-items:center;gap:8px;flex-wrap:wrap}
.curso>summary{padding:10px}
.curso>summary::-webkit-details-marker,
.alumnos>summary::-webkit-details-marker,
.masivo>summary::-webkit-details-marker,
.equipo>summary::-webkit-details-marker{display:none}
.cur-chevron{color:var(--dim);font-size:12px;transition:transform .15s}
details[open]>summary>.cur-chevron{transform:rotate(90deg)}
.cur-alu{font-size:12px;color:var(--dim);flex-basis:100%;order:4}
.cur-jefe{font-size:12px;color:var(--dim);flex-basis:100%;order:5}
.cur-jefe.sin{color:var(--gold)}
.cur-part{font-size:12px;color:var(--cyan);flex-basis:100%;order:6}
.curso-cuerpo{padding:0 10px 10px}
.alumnos{margin-top:8px;border-top:1px solid #ffffff14}
.alumnos>summary{padding:8px 0;color:var(--cyan);font-size:13px;font-weight:700}
.alumnos-cuerpo{padding-top:4px}
/* Área tocable de verdad: los botones de 21×25 px se fallaban con el dedo. */
.ico{background:none;border:0;font-family:inherit;font-weight:900;font-size:15px;
 line-height:1;cursor:pointer;padding:0;min-width:38px;height:38px;border-radius:10px;
 color:var(--cyan)}
.ico:active{background:#ffffff1a}
/* Borrar se aparta del resto: es lo único que no se puede deshacer. */
.ico-del{color:var(--pink);margin-left:12px}
.btn-chip{background:none;border:2px solid var(--violet);color:var(--cyan);
 font-family:inherit;font-weight:900;font-size:13px;padding:8px 12px;border-radius:12px;
 cursor:pointer;margin-bottom:6px}

/* Encabezado pegado arriba: con 60 objetivos, saber de qué curso es la tabla y volver
   al panel exigía subir miles de píxeles. */
.av-head{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;
 background:var(--panel);padding:10px 0;margin:0 0 8px;border-bottom:1px solid #ffffff22}
.av-head-tit{color:var(--gold);font-size:15px;display:block;overflow:hidden;
 text-overflow:ellipsis;white-space:nowrap}
.av-head-sub{color:var(--dim);font-size:11px}
.av-filtros{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.av-chip{background:none;border:2px solid #ffffff22;color:var(--dim);font-family:inherit;
 font-weight:900;font-size:12px;padding:7px 12px;border-radius:20px;cursor:pointer}
.av-chip.on{border-color:var(--cyan);color:var(--cyan)}
/* Dos líneas por objetivo: los textos del currículum llegan a 250 caracteres, y con el
   texto entero caben tres por pantalla. Al desplegar la fila se muestra completo. */
.oa-texto{font-size:13px;margin-bottom:4px;display:-webkit-box;-webkit-box-orient:vertical;
 -webkit-line-clamp:2;line-clamp:2;overflow:hidden}
.oa-fila[open] .oa-texto{-webkit-line-clamp:unset;line-clamp:unset;overflow:visible}
#btnArriba{position:fixed;right:14px;bottom:14px;width:44px;height:44px;border-radius:50%;
 border:2px solid var(--violet);background:var(--panel);color:var(--cyan);
 font-family:inherit;font-weight:900;font-size:18px;cursor:pointer;z-index:10;opacity:.93}
/* Equipo del curso: el CSS global pone width:100%/display:block a los input, que
   descoloca los radios y las casillas. Estas reglas lo anulan solo dentro del equipo. */
.equipo-cuerpo label{display:inline-flex;align-items:center;gap:6px}
.equipo-cuerpo .eq-casillas{display:flex;flex-wrap:wrap;gap:4px 12px}
.equipo-cuerpo input[type=radio],.equipo-cuerpo input[type=checkbox]{width:auto;margin:0}
</style>
</head>
<body>
<h1>VULPO · Profesores</h1>

<div class="card" id="cardAuth">
  <h3 id="authTitulo">Ingresar</h3>
  <input id="correo" type="email" placeholder="Correo" autocomplete="email">
  <input id="clave" type="password" placeholder="Contraseña" autocomplete="current-password">
  <input id="nombre" class="hide" placeholder="Tu nombre">
  <button class="btn" id="btnEntrar">Entrar</button>
  <button class="btn sec" id="btnCambiar">Crear mi cuenta</button>
  <p class="msg" id="authMsg"></p>
</div>

<div class="card hide" id="cardPanel">
  <div id="profId" class="prof-id hide"></div>
  <h3 id="panelTitulo">Mis cursos</h3>
  <div id="lista"></div>
  <p class="msg" id="panelMsg"></p>
  <button class="btn sec" id="btnSalir">Cerrar sesión</button>
</div>

<button id="btnArriba" class="hide" title="Volver arriba" aria-label="Volver arriba">↑</button>

<script>
const SUPA_URL='https://bdgzpjzlqidcexdkjhzy.supabase.co';
const SUPA_KEY='sb_publishable_I3FWEIOQf-_7ni_46PGSSQ_PLD3mQpM';
// storageKey propio: sin esto, la sesión del profesor reemplazaría la del alumno
// que juega en este mismo navegador, y el niño perdería su identidad.
const SB=window.supabase.createClient(SUPA_URL,SUPA_KEY,
  {auth:{storageKey:'kimun-profesor',persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id);
let MODO='entrar', YO=null;

const ERRORES={
  no_autorizado:'No tienes permiso para esto. Si es tu primera vez, pídele acceso al administrador.',
  sin_sesion:'La sesión se cerró. Vuelve a entrar.',
  sin_correo:'Tu cuenta no tiene un correo confirmado. Revisa el correo de confirmación y vuelve a entrar.',
  correo_invalido:'Ese correo no es válido.',
  profesor_invalido:'Ese profesor no existe.',
  no_te_puedes_quitar:'No puedes quitarte a ti mismo.',
  nombre_vacio:'Escribe un nombre.',
  curso_invalido:'Ese curso no existe.',
  alumno_invalido:'Ese alumno no existe.'
};
// Mensaje del caso más frecuente: la cuenta existe, lo que falta es la autorización.
// Decirle "no tienes permiso" a secas lo manda a revisar su contraseña, que está bien.
const SIN_AUTORIZACION='Tu cuenta se creó, pero tu correo todavía no está autorizado. '+
  'Pídele acceso al administrador y vuelve a entrar.';

function traducir(e){
  // supabase-js trae un código aparte del mensaje; se miran los dos.
  const t=((e&&e.message)||'')+' '+((e&&e.code)||'');
  for(const k in ERRORES) if(t.includes(k)) return ERRORES[k];
  if(t.includes('Invalid login')) return 'Correo o contraseña incorrectos.';
  if(t.includes('already registered')) return 'Ese correo ya tiene cuenta. Usa "Entrar".';
  if(t.includes('at least')) return 'La contraseña debe tener al menos 6 caracteres.';
  // El servicio de correo integrado de Supabase permite 2 envíos por hora, así que
  // esto aparece en cuanto se dan de alta varios profesores seguidos.
  if(t.includes('over_email_send_rate_limit')||t.includes('email rate limit'))
    return 'Supabase ya envió demasiados correos por ahora. Espera un rato y vuelve a intentarlo.';
  if(t.includes('email_address_invalid')) return 'Ese correo no es válido.';
  if(t.includes('Failed to fetch')||t.includes('NetworkError')||t.includes('Load failed'))
    return 'No hay conexión con el servidor. Revisa tu internet y vuelve a intentarlo.';
  if(t.includes('JWT')) return 'La sesión se cerró. Vuelve a entrar.';
  return 'No se pudo completar la acción. Intenta de nuevo.';
}

function esNoAutorizado(e){
  return (((e&&e.message)||'')+' '+((e&&e.code)||'')).includes('no_autorizado');
}

function mostrarIngreso(){
  $('cardPanel').classList.add('hide');
  $('cardAuth').classList.remove('hide');
}

// Un fallo de autorización deja la sesión abierta pero inútil: el botón de cerrar
// sesión vive dentro del panel, que sigue oculto, así que sin esto la persona no
// puede probar con otra cuenta salvo borrando el almacenamiento del navegador.
// Solo se cierra la sesión ante no_autorizado; un corte de red no debe expulsar a nadie.
async function manejarFalloDeIngreso(e){
  if(esNoAutorizado(e)){
    try{ await SB.auth.signOut(); }catch(_){}
    mostrarIngreso();
    aviso(SIN_AUTORIZACION);
    return;
  }
  aviso(traducir(e));
}
function aviso(t,color){
  const el = $('cardPanel').classList.contains('hide') ? $('authMsg') : $('panelMsg');
  el.style.color=color||'var(--pink)'; el.textContent=t;
  // El mensaje vive arriba del panel, y las acciones que lo disparan (equipo, enlace,
  // alumnos) ocurren abajo del todo: sin esto, un error queda FUERA DE PANTALLA justo
  // cuando mas se necesita, y la pantalla parece no responder. Paso de verdad.
  try{ el.scrollIntoView({block:'center', behavior:'smooth'}); }catch(e){}
}
function esc(t){ return String(t==null?'':t)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

// Dentro del panel, "no autorizado" casi siempre significa que el curso o el alumno
// ya no existe —lo borró otra pestaña, u otro profesor—, no que falten permisos. El
// servidor responde lo mismo en ambos casos a propósito: separarlos permitiría
// descubrir qué códigos existen probándolos uno por uno.
function errorPanel(e){
  return esNoAutorizado(e)
    ? 'No tienes permiso para esto, o el curso o alumno ya no existe.'
    : traducir(e);
}

// Vuelve al panel sin dejar la pantalla en blanco si la lista no se puede cargar.
function volverAlPanel(){
  irArriba();
  pintarLista().catch(e=>aviso(errorPanel(e)));
}

// Cada vista se abre desde arriba. Sin esto, el profesor que pulsa "Ver avance" desde
// el final de una lista de 35 alumnos cae en mitad de la tabla nueva, sin saber de qué
// curso es ni que hay filtros más arriba.
function irArriba(){ window.scrollTo(0,0); }

/* Textos de los objetivos de aprendizaje. El código HI08 OA 01 no le dice nada a
   nadie: sin el texto real, la tabla es ilegible para un profesor. */
// 'HI08' -> 'historia-8basico'. Se deriva del código (assets/js/niveles.js): el nivel
// vive dentro de él, así que no hay lista que mantener al agregar un curso.
const OA_CARPETA = {};
NIV.codigos().forEach(c => { OA_CARPETA[c] = NIV.carpeta(c); });
const OA_TEXTO = {};        // "HI08 OA 01" -> "Analizar, apoyándose en diversas fuentes…"
const OA_CARGADA = {};      // carpetas ya pedidas
const OA_TOTAL = {};        // 'HI08' -> cuántos OA tiene la asignatura (de oa.json)

async function cargarTextosOA(codigos){
  const carpetas = [...new Set(codigos.map(c => OA_CARPETA[String(c).slice(0,4)]).filter(Boolean))];
  await Promise.all(carpetas.map(async carpeta => {
    if(OA_CARGADA[carpeta]) return;
    OA_CARGADA[carpeta] = true;
    try{
      const r = await fetch('contenido/'+carpeta+'/oa.json');
      if(!r.ok) throw new Error('HTTP '+r.status);
      const d = await r.json();
      // Contar los OA de la asignatura para el denominador de cobertura del ranking. Sobre
      // un Set por carpeta para ser idempotente: cada carpeta es exactamente una asignatura,
      // así que vistos.size es su total de OA aunque se recargue.
      const vistos = OA_TOTAL['_set_'+carpeta] || (OA_TOTAL['_set_'+carpeta]=new Set());
      (d.oa||[]).forEach(o => {
        if(o && o.codigo){
          OA_TEXTO[o.codigo] = o.texto || o.codigo;
          vistos.add(o.codigo);
          OA_TOTAL[String(o.codigo).slice(0,4)] = vistos.size;
        }
      });
    }catch(e){
      // Si falla, se olvida la marca: de lo contrario un corte momentáneo dejaría a esa
      // asignatura mostrando códigos en vez de textos durante toda la sesión.
      OA_CARGADA[carpeta] = false;
      console.error('OA:', e.message||e);
    }
  }));
}

$('btnCambiar').onclick=()=>{
  MODO = MODO==='entrar' ? 'crear' : 'entrar';
  $('authTitulo').textContent = MODO==='entrar' ? 'Ingresar' : 'Crear mi cuenta';
  $('btnEntrar').textContent  = MODO==='entrar' ? 'Entrar' : 'Crear cuenta';
  $('btnCambiar').textContent = MODO==='entrar' ? 'Crear mi cuenta' : '← Ya tengo cuenta';
  $('nombre').classList.toggle('hide', MODO==='entrar');
  aviso('');
};

$('btnEntrar').onclick=async ()=>{
  const correo=($('correo').value||'').trim(), clave=$('clave').value||'';
  if(!correo||!clave){ aviso('Escribe tu correo y tu contraseña.'); return; }
  $('btnEntrar').disabled=true; aviso('Comprobando…','var(--dim)');
  try{
    if(MODO==='crear'){
      const {data,error}=await SB.auth.signUp({email:correo,password:clave});
      if(error) throw error;
      // Con la confirmación de correo activada, signUp no devuelve sesión.
      if(!data.session){
        aviso('Te enviamos un correo para confirmar tu cuenta. Confírmalo y entra con tu contraseña.','var(--cyan)');
        return;
      }
    }else{
      const {error}=await SB.auth.signInWithPassword({email:correo,password:clave});
      if(error) throw error;
    }
    await asegurarAlta($('nombre').value||'');
    await cargarPanel();
  }catch(e){ await manejarFalloDeIngreso(e); }
  finally{ $('btnEntrar').disabled=false; }
};

$('btnSalir').onclick=async ()=>{ await SB.auth.signOut(); location.reload(); };

// Completa el registro si esta cuenta todavía no tiene fila de profesor. Se llama
// al crear la cuenta Y al iniciar sesión, para que funcione con la confirmación de
// correo activada o desactivada.
async function asegurarAlta(nombre){
  if(await soyProfesor()) return;                   // ya está registrado
  const {error}=await SB.rpc('kimun_prof_alta',{p_nombre:nombre});
  if(error) throw error;
}

// OJO: kimun_prof_yo NO devuelve null para quien no es profesor, devuelve una fila
// con todos los campos vacíos, que en JavaScript es un objeto verdadero. Hay que
// mirar el id: sin esta comprobación, el panel se abre para cualquiera.
async function soyProfesor(){
  const {data,error}=await SB.rpc('kimun_prof_yo');
  // "No se pudo comprobar" no es lo mismo que "no eres profesor": si se traga el
  // error, un corte de red le dice a un profesor legítimo que pida un acceso que
  // ya tiene. Se propaga para que el mensaje diga lo que en verdad pasó.
  if(error) throw error;
  const fila = Array.isArray(data) ? data[0] : data;
  return (fila && fila.id) ? fila : null;
}

async function cargarPanel(){
  YO = await soyProfesor();
  if(!YO){ throw new Error('no_autorizado'); }
  $('cardAuth').classList.add('hide');
  $('cardPanel').classList.remove('hide');
  const esAdminColegio = !!(YO.es_admin || YO.es_super);
  window.ESADMINCOLEGIO = esAdminColegio;   // usado por pintarLista y el bloque de equipo
  const rango = YO.es_admin ? 'Administrador' : (YO.es_super ? 'SuperUsuario' : 'Profesor');
  $('profId').textContent = '👤 ' + (YO.nombre || YO.correo) + ' — ' + rango;
  $('panelTitulo').textContent = esAdminColegio ? 'Todos los cursos' : 'Mis cursos';
  await pintarLista();
}

async function pintarLista(){
  // Preservar qué cursos (y su sublista de alumnos) estaban desplegados, para que al
  // re-renderizar tras una acción (p. ej. agregar alumno) el curso no se contraiga solo.
  const abiertos=new Set([...document.querySelectorAll('details.curso[open]')].map(d=>d.dataset.cod));
  const aluAbiertos=new Set([...document.querySelectorAll('details.curso')]
    .filter(d=>{const a=d.querySelector('details.alumnos');return a&&a.open;}).map(d=>d.dataset.cod));
  $('panelTitulo').classList.remove('hide');   // las vistas de avance lo ocultan
  $('profId').classList.remove('hide');
  // Base del encabezado (sin cursos): se re-fija en cada render para no acumular.
  const rango = YO.es_admin ? 'Administrador' : (YO.es_super ? 'SuperUsuario' : 'Profesor');
  $('profId').textContent = '👤 ' + (YO.nombre || YO.correo) + ' — ' + rango;
  const {data,error}=await SB.rpc('kimun_prof_listar');
  if(error) throw error;
  const porCurso={};
  (data||[]).forEach(f=>{
    porCurso[f.curso_codigo]=porCurso[f.curso_codigo]||
      {nombre:f.curso, alumnos:[], gestiono:f.puede_gestionar, miRol:f.mi_rol,
       misAsig:f.mis_asignaturas, nivel:f.nivel||''};
    if(f.pid) porCurso[f.curso_codigo].alumnos.push(f);   // pid: id de perfil (siempre presente); codigo_acceso puede venir null para un profe de asignatura
  });
  const cursos=Object.entries(porCurso);
  // Cursos en el encabezado: Admin/Super → "Todos los cursos"; Profesor → sus cursos con su rol.
  if(window.ESADMINCOLEGIO){
    $('profId').textContent += ' · Todos los cursos';
  }else{
    const trozos = cursos.map(([cod,c])=>{
      const rol = c.miRol==='jefe' ? 'Jefe'
        : (c.misAsig&&c.misAsig.length ? c.misAsig.map(a=>ASIG_NOMBRE[a]||a).join(', ') : '—');
      return c.nombre+' ('+rol+')';
    });
    if(trozos.length) $('profId').textContent += ' · ' + trozos.join(' · ');
  }
  $('lista').innerHTML = (cursos.length ? cursos.map(([cod,c])=>`

        <span class="cur-chevron" aria-hidden="true">▸</span>
        <b class="cur-nom" style="color:var(--gold)">${esc(c.nombre)}</b>

        <span class="cur-alu">${c.alumnos.length} alumno${c.alumnos.length===1?'':'s'}${

        <span class="cur-part" data-cod="${esc(cod)}">Participación · …</span>
        ${window.ESADMINCOLEGIO?`<button class="ico ico-del delcurso" data-cod="${esc(cod)}" title="Eliminar curso">🗑️</button>`:''}
      </summary>
      <div class="curso-cuerpo">

        <details class="alumnos">
          <summary><span class="cur-chevron" aria-hidden="true">▸</span>👥 Alumnos (${c.alumnos.length})</summary>
          <div class="alumnos-cuerpo">
            ${c.alumnos.length ? c.alumnos.map(a=>`
              <div class="alu">
                <div class="alu-top">
                  <span>${esc(a.avatar)}</span><b class="alu-nom">${esc(a.alumno)}</b>
                  ${c.gestiono?`<button class="ico xp" data-cod="${esc(a.codigo_acceso)}" data-xp="${esc(a.xp)}"
                          title="Fijar XP" style="color:var(--gold)">✎</button>`:''}
                  <button class="ico avalum" data-pid="${esc(a.pid)}"
                          data-nom="${esc(a.alumno)}" title="Ver avance">📊</button>
                  ${c.gestiono?`<button class="ico ico-del del" data-cod="${esc(a.codigo_acceso)}"
                          title="Eliminar alumno">✕</button>`:''}
                </div>
                <div class="alu-sub">${a.codigo_acceso?`<code>${esc(a.codigo_acceso)}</code> · `:''}${esc(a.xp)} XP${a.autoinscrito?` · <span class="ins-chip" title="Se inscribió por el enlace: este nombre lo escribió el alumno, no tú">se inscribió solo</span>`:''}</div>
              </div>`).join('')
             : '<p style="color:var(--dim);font-size:12px">Sin alumnos todavía.</p>'}
            ${c.gestiono?`<div style="margin-top:8px">
              <input class="in-alumno" data-curso="${esc(cod)}" placeholder="Nombre del alumno nuevo">
              <button class="btn sec add-alumno" data-curso="${esc(cod)}">+ Agregar alumno</button>
            </div>
            <details class="masivo" style="margin-top:6px">
              <summary style="cursor:pointer;color:var(--cyan);font-size:13px;font-weight:800;list-style:none">➕ Cargar varios de una vez</summary>
              <p style="color:var(--dim);font-size:12px;margin:6px 0">Pega un nombre por línea (como los copias de una lista).</p>
              <textarea class="in-masivo" data-curso="${esc(cod)}" rows="5" placeholder="Ana Pérez&#10;Benjamín Soto&#10;Catalina Rivas"></textarea>
              <button class="btn sec add-masivo" data-curso="${esc(cod)}">Agregar todos</button>
            </details>`:''}
          </div>
        </details>
        ${c.gestiono?`<details class="inscripcion" data-cod="${esc(cod)}" data-nivel="${esc(c.nivel)}" style="margin-top:6px">

   + (window.ESADMINCOLEGIO ? `<div style="margin-top:10px;border-top:1px solid #ffffff22;padding-top:12px">

        <button class="btn sec" id="btnCurso">+ Crear curso</button>

  conectarAcciones();
  // Restaurar el estado desplegado que había antes del re-render.
  document.querySelectorAll('details.curso').forEach(d=>{
    const cod=d.dataset.cod;
    if(abiertos.has(cod)) d.open=true;

  document.querySelectorAll('details.equipo').forEach(det => det.addEventListener('toggle', () => {
    if(det.open && !det.dataset.cargado){ det.dataset.cargado='1'; cargarEquipo(det.dataset.cod, det.dataset.nivel); }
  }));
  cargarTitularesParticipacion(cursos.map(([cod])=>cod));
  cargarJefes(cursos.map(([cod])=>cod));

  if(window.ESADMINCOLEGIO){
    $('lista').insertAdjacentHTML('beforeend', `
      <div style="margin-top:16px;border-top:2px solid var(--violet);padding-top:12px">
        <h3 style="color:var(--violet);font-size:15px;margin:0 0 10px">Administración</h3>
        <input id="nuevoCorreo" type="email" placeholder="Correo del profesor nuevo">
        <button class="btn sec" id="btnAutorizar">+ Autorizar profesor</button>
        <div id="profes" style="margin:10px 0"></div>
        ${YO.es_admin?`<button class="btn sec" id="btnLimpiar">🧹 Limpiar perfiles de prueba</button>`:''}
        <button class="btn sec" id="btnTablero">📊 Tablero de avance</button>
        ${YO.es_admin?`<label style="font-size:12px;color:var(--dim)">🔗 Armar enlace de muestra</label>
        <select id="armarNivel">${NIVELES_MUESTRA.map(n=>`<option value="${n.ruta}">${n.nombre}</option>`).join('')}</select>
        <button class="btn sec" id="btnArmar">Abrir armador</button>`:''}
      </div>`);
    $('btnAutorizar').onclick=async ()=>{
      const c=($('nuevoCorreo').value||'').trim();
      if(!c){ aviso('Escribe un correo.'); return; }
      await accion(()=>SB.rpc('kimun_prof_autorizar',{p_correo:c}), 'Correo autorizado');
    };
    $('btnTablero').onclick=()=>{ window.location.href='dev/tablero.html'; };
    // "Limpiar perfiles de prueba" y el armador son de plataforma: solo el Admin los ve.
    if(YO.es_admin){
      $('btnLimpiar').onclick=limpiarPruebas;
      $('btnArmar').onclick=()=>{ window.location.href=$('armarNivel').value+'?armar=1'; };
    }
    const {data:profes,error:errProfes}=await SB.rpc('kimun_prof_profesores');
    if(errProfes){
      $('profes').innerHTML='<p style="color:var(--pink);font-size:12px">No se pudo cargar la lista de profesores.</p>';
    }else{
      $('profes').innerHTML=(profes||[]).map(p=>{
        const rango = p.es_admin ? 'Administrador' : (p.es_super ? 'SuperUsuario' : (p.registrado?'Profesor':'sin registrar'));
        // Solo el Admin puede cambiar el rol de SuperUsuario, y no sobre un Admin.
        const btnSuper = (YO.es_admin && p.registrado && !p.es_admin)
          ? `<button class="btn-chip super-toggle" data-correo="${esc(p.correo)}" data-on="${p.es_super?'0':'1'}">${p.es_super?'Quitar Super':'Hacer Super'}</button>`
          : '';
        // Revocar / cancelar invitación. Nunca a mí mismo ni a un Admin desde la UI;
        // un SuperUsuario no puede revocar a otro SuperUsuario (el servidor igual lo rechaza).
        const esYo = p.correo && (p.correo.toLowerCase() === (YO.correo||'').toLowerCase());
        const btnRevocar = (!esYo && !p.es_admin && (YO.es_admin || !p.es_super))
          ? `<button class="ico ico-del prof-quitar" data-correo="${esc(p.correo)}" data-reg="${p.registrado?'1':''}"
               title="${p.registrado?'Revocar profesor':'Cancelar invitación'}">✕</button>`
          : '';
        return `<div style="display:flex;gap:8px;align-items:center;padding:4px 0;font-size:13px;flex-wrap:wrap">
           <span class="pro-nom">${esc(p.correo)}</span>
           <span style="color:var(--dim)">${esc(rango)}</span>
           <span style="color:var(--cyan)">${p.cursos} curso${p.cursos===1?'':'s'}</span>
           ${btnSuper}${btnRevocar}
         </div>`;
      }).join('');
      document.querySelectorAll('.super-toggle').forEach(b=>b.onclick=async ()=>{
        const hacer=b.dataset.on==='1';
        if(!confirm(hacer?'¿Nombrar SuperUsuario a este profesor? Podrá administrar todos los cursos del colegio.'
                         :'¿Quitarle el rol de SuperUsuario?')) return;
        await accion(()=>SB.rpc('kimun_prof_super_fijar',{p_correo:b.dataset.correo, p_es_super:hacer}),
                     hacer?'Ahora es SuperUsuario':'Ya no es SuperUsuario');
      });
      document.querySelectorAll('.prof-quitar').forEach(b=>b.onclick=async ()=>{
        const reg=b.dataset.reg==='1';
        if(!confirm(reg
          ? '¿Revocar a este profesor?\n\nPierde el acceso y sale de la lista blanca; sus cursos NO se borran (quedan sin dueño hasta reasignarlos). No afecta el desempeño de los alumnos.'
          : '¿Cancelar la invitación de este correo? Ya no podrá registrarse.')) return;
        await accion(()=>SB.rpc('kimun_prof_quitar',{p_correo:b.dataset.correo}),
                     reg?'Profesor revocado':'Invitación cancelada');
      });
    }
  }
}

function conectarAcciones(){
  // El botón puede no existir: solo el admin de colegio ve "+ Crear curso".
  const bc=$('btnCurso');
  if(bc) bc.onclick=async ()=>{
    const n=($('cursoNombre').value||'').trim();
    if(!n){ aviso('Escribe un nombre.'); return; }
    const niv=($('cursoNivel')||{}).value||null;
    await accion(()=>SB.rpc('kimun_prof_curso_crear',{p_nombre:n, p_nivel:niv}), 'Curso creado');
  };
  document.querySelectorAll('.add-alumno').forEach(b=>b.onclick=async ()=>{
    const campo=document.querySelector('.in-alumno[data-curso="'+b.dataset.curso+'"]');
    const n=(campo.value||'').trim();
    if(!n){ aviso('Escribe un nombre.'); return; }
    await accion(()=>SB.rpc('kimun_prof_alumno_agregar',
      {p_curso_codigo:b.dataset.curso,p_nombre:n,p_avatar:'🦊'}), 'Alumno agregado');
  });
  // Carga masiva: un nombre por línea. Reusa la misma función, una llamada por nombre.
  document.querySelectorAll('.add-masivo').forEach(b=>b.onclick=async ()=>{
    const cod=b.dataset.curso;
    const ta=document.querySelector('.in-masivo[data-curso="'+cod+'"]');
    const nombres=(ta.value||'').split('\n').map(s=>s.trim()).filter(Boolean);
    if(!nombres.length){ aviso('Pega al menos un nombre (uno por línea).'); return; }
    b.disabled=true;
    let ok=0; const fallos=[];
    for(let i=0;i<nombres.length;i++){
      b.textContent='Agregando… '+(i+1)+'/'+nombres.length;
      try{ const {error}=await SB.rpc('kimun_prof_alumno_agregar',
             {p_curso_codigo:cod,p_nombre:nombres[i],p_avatar:'🦊'});
           if(error) throw error; ok++; }
      catch(e){ fallos.push(nombres[i]); }
    }
    await pintarLista();   // conserva el curso desplegado (ver pintarLista)
    const msg=ok+' alumno'+(ok===1?'':'s')+' agregado'+(ok===1?'':'s')
      +(fallos.length?' · '+fallos.length+' con error: '+fallos.slice(0,4).join(', ')+(fallos.length>4?'…':''):'');
    aviso(msg, fallos.length? undefined : 'var(--green)');
  });
  document.querySelectorAll('.xp').forEach(b=>b.onclick=async ()=>{
    const v=prompt('XP de este alumno:', b.dataset.xp);
    if(v===null) return;
    if(!/^\d+$/.test(v.trim())){ aviso('Escribe un número entero de 0 o más.'); return; }
    await accion(()=>SB.rpc('kimun_prof_xp_fijar',
      {p_codigo_acceso:b.dataset.cod,p_xp:parseInt(v,10)}), 'XP actualizado a '+parseInt(v,10));
  });
  document.querySelectorAll('.del').forEach(b=>b.onclick=async ()=>{
    if(!confirm('¿Eliminar a este alumno?\n\nPierde su lugar en el ranking y sus duelos. No se puede deshacer.')) return;
    await accion(()=>SB.rpc('kimun_prof_alumno_quitar',{p_codigo_acceso:b.dataset.cod}), 'Alumno eliminado');
  });
  document.querySelectorAll('.delcurso').forEach(b=>b.onclick=async (ev)=>{
    ev.stopPropagation(); ev.preventDefault();
    if(!confirm('¿Eliminar este curso?\n\nSe borran también todos sus alumnos y sus duelos. No se puede deshacer.')) return;
    await accion(()=>SB.rpc('kimun_prof_curso_quitar',{p_curso_codigo:b.dataset.cod}), 'Curso eliminado');
  });
  document.querySelectorAll('.avance').forEach(
    b=>b.onclick=()=>verAvance(b.dataset.cod, b.dataset.nom, b.dataset.gestiono==='1'));
  document.querySelectorAll('.avalum').forEach(
    b=>b.onclick=()=>verAvanceAlumno(b.dataset.pid, b.dataset.nom));
}

/* ===== Enlace de inscripción del curso (jefe/admin) =====
   Un solo enlace vivo por curso, garantizado por un índice único en la base: crear uno
   nuevo cierra el anterior, que es lo que uno espera al pedir otro. */
async function cargarInscripcion(cursoCodigo, nivel){
  const caja=document.querySelector('.inscripcion-cuerpo[data-cod="'+cursoCodigo+'"]');
  if(!caja) return;
  caja.innerHTML='<p style="color:var(--dim);font-size:12px">Cargando…</p>';
  let fila=null;
  try{
    const {data,error}=await SB.rpc('kimun_prof_inscripcion_estado',{p_curso_codigo:cursoCodigo});
    if(error) throw error; fila=(data&&data.length)?data[0]:null;
  }catch(e){ caja.innerHTML='<p style="color:var(--pink);font-size:12px">'+errorPanel(e)+'</p>'; return; }

  const opciones=NIVELES_MUESTRA.map(n=>`<option value="${n.ruta}">${n.nombre}</option>`).join('');
  caja.innerHTML =
    (fila?`<p style="font-size:12px;margin:6px 0">
             <b style="color:var(--green)">${fila.usados} de ${fila.cupo}</b> se inscribieron ·
             ${fila.experimental?'modo experimental (capítulos abiertos, jefes cerrados)':'juego normal'}</p>
           <label style="font-size:12px;color:var(--dim)">Nivel al que lleva el enlace
             <select class="ins-nivel">${opciones}</select></label>
           <input class="ins-url" readonly>
           <button class="btn sec ins-copiar">Copiar enlace</button>`
        :`<p style="color:var(--dim);font-size:12px;margin:6px 0">Este curso todavía no tiene enlace.</p>`)
  + `<details style="margin-top:8px">
       <summary style="cursor:pointer;color:var(--cyan);font-size:13px;font-weight:800;list-style:none">${
         fila?'♻️ Crear otro enlace (cierra el de arriba)':'➕ Crear el enlace'}</summary>
       <p style="color:var(--dim);font-size:12px;margin:6px 0">
         ⚠️ El enlace <b>es</b> la credencial: quien lo reciba entra al curso hasta llenar el
         cupo. Ajústalo al grupo en vez de dejarlo holgado.</p>
       <label style="font-size:12px;color:var(--dim)">Cupo
         <input class="ins-cupo" type="number" min="1" max="500" value="${fila?fila.cupo:30}"></label>
       <label style="display:block;font-size:12px;color:var(--dim);margin:6px 0">
         <input class="ins-exper" type="checkbox" style="width:auto;margin-right:6px" ${
           fila&&fila.experimental?'checked':''}>
         Modo experimental: todos los capítulos abiertos y los jefes cerrados</label>
       <button class="btn sec ins-crear">Crear enlace</button>
     </details>`;

  const sel=caja.querySelector('.ins-nivel'), url=caja.querySelector('.ins-url');
  // El enlace tiene que llevar al nivel del curso. Si el curso lo declara, se preselecciona
  // solo: mandarle a un 3o el enlace de /juego/ es el error facil de esta pantalla.
  if(sel && nivel){ const n=NIVELES_MUESTRA.find(x=>x.nivel===nivel); if(n) sel.value=n.ruta; }
  function pintarUrl(){ if(url&&sel&&fila) url.value=location.origin+sel.value+'?inscribir='+fila.token; }
  pintarUrl();
  if(sel) sel.onchange=pintarUrl;
  const cop=caja.querySelector('.ins-copiar');
  if(cop) cop.onclick=async ()=>{
    try{ await navigator.clipboard.writeText(url.value); aviso('Enlace copiado'); }
    // Si el navegador bloquea el portapapeles, se selecciona para copiar a mano, en vez
    // de dejar un botón que aparenta funcionar (mismo criterio que el armador).
    catch(e){ url.focus(); url.select(); aviso('Cópialo con Ctrl+C'); }
  };
  caja.querySelector('.ins-crear').onclick=async ()=>{
    const cupo=parseInt(caja.querySelector('.ins-cupo').value,10);
    const exp=caja.querySelector('.ins-exper').checked;
    if(!(cupo>=1&&cupo<=500)){ aviso('El cupo va entre 1 y 500.'); return; }
    if(fila && !confirm('Esto cierra el enlace actual: quien todavía no lo haya usado no podrá entrar. ¿Seguir?')) return;
    try{
      const {error}=await SB.rpc('kimun_prof_inscripcion_crear',
        {p_curso_codigo:cursoCodigo, p_cupo:cupo, p_experimental:exp});
      if(error) throw error;
      aviso('Enlace creado');
      cargarInscripcion(cursoCodigo, nivelDeCurso(cursoCodigo));
    }catch(e){ aviso(errorPanel(e)); }
  };
}

/* ===== Equipo del curso (jefe/admin) ===== */
async function cargarEquipo(cursoCodigo, nivel){
  const caja=document.querySelector('.equipo-cuerpo[data-cod="'+cursoCodigo+'"]');
  if(!caja) return;
  caja.innerHTML='<p style="color:var(--dim);font-size:12px">Cargando…</p>';
  let equipo=[];
  try{
    const {data,error}=await SB.rpc('kimun_prof_equipo',{p_curso_codigo:cursoCodigo});
    if(error) throw error; equipo=data||[];
  }catch(e){ caja.innerHTML='<p style="color:var(--pink);font-size:12px">'+errorPanel(e)+'</p>'; return; }
  const puedeJefe = !!window.ESADMINCOLEGIO;   // solo Admin/Super nombran o quitan Jefe
  const filas=equipo.map(m=>{
    const esJefe = m.rol==='jefe';
    const asigs = esJefe ? 'todas las asignaturas'
      : (m.asignaturas&&m.asignaturas.length ? m.asignaturas.map(a=>ASIG_NOMBRE[a]||a).join(', ')
                                             : 'sin asignaturas');
    // El ✕ del Jefe solo lo ve Admin/Super; el de asignatura, cualquiera que gestione.
    const puedeQuitar = esJefe ? puedeJefe : true;
    // Editar solo aplica a profes de asignatura (el Jefe alcanza todas).
    const btnEditar = esJefe ? '' :
      `<button class="ico eq-editar" data-cod="${esc(cursoCodigo)}" data-correo="${esc(m.correo)}"
        data-asig="${esc((m.asignaturas||[]).join('|'))}" title="Editar asignaturas" style="color:var(--gold)">✎</button>`;
    return `<div class="equipo-fila" style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:4px 0;font-size:13px">
      <b style="color:var(--gold)">${esJefe?'⭐ ':''}${esc(m.nombre||m.correo)}</b>
      <span style="color:var(--dim)">${esc(asigs)}</span>
      <span style="margin-left:auto"></span>
      ${btnEditar}
      ${puedeQuitar?`<button class="ico ico-del eq-quitar" data-cod="${esc(cursoCodigo)}" data-correo="${esc(m.correo)}" title="Quitar del curso">✕</button>`:''}
    </div>`;
  }).join('');
  // Solo las asignaturas de ESTE curso. Un curso sin nivel —creado antes de que la
  // columna existiera— las muestra todas, como siempre, y ofrece fijárselo.
  const casillas=asigsDeNivel(nivel).map(a=>
    `<label style="font-size:12px"><input type="checkbox" class="eq-asig" value="${a}"> ${ASIG_NOMBRE[a]}</label>`).join('');
  const avisoNivel = nivel ? '' : `
      <div style="margin:6px 0;padding:8px;border:1px dashed #ffffff33;border-radius:10px">
        <p style="color:var(--gold);font-size:12px;margin:0 0 6px">
          Este curso no tiene nivel, así que se muestran las asignaturas de todos. Fíjaselo
          y quedan solo las suyas.</p>
        <select class="eq-nivel">${NIVELES_MUESTRA.map(n=>`<option value="${n.nivel}">${n.nombre}</option>`).join('')}</select>
        <button class="btn sec eq-fijar-nivel">Fijar el nivel</button>
      </div>`;
  // El radio de rol solo aparece si puede nombrar Jefe; si no, se fuerza 'asignatura'.
  const selectorRol = puedeJefe ? `
      <div style="margin:6px 0">
        <label style="font-size:12px;margin-right:10px"><input type="radio" name="eqrol-${esc(cursoCodigo)}" class="eq-rol" value="asignatura" checked> Profe de asignatura</label>
        <label style="font-size:12px"><input type="radio" name="eqrol-${esc(cursoCodigo)}" class="eq-rol" value="jefe"> Profesor Jefe</label>
      </div>` : '';
  caja.innerHTML=`${filas||'<p style="color:var(--dim);font-size:12px">Solo estás tú.</p>'}
    <div style="margin-top:8px;border-top:1px solid #ffffff22;padding-top:8px">
      <input class="eq-correo" type="email" placeholder="Correo del profesor (ya registrado)" style="width:100%">
      ${selectorRol}
      ${avisoNivel}
      <div class="eq-casillas" style="margin:0 0 6px">${casillas}</div>
      <button class="btn sec eq-asignar" data-cod="${esc(cursoCodigo)}">+ Agregar al equipo</button>
    </div>`;
  const bFijar=caja.querySelector('.eq-fijar-nivel');
  if(bFijar) bFijar.onclick=async ()=>{
    const n=caja.querySelector('.eq-nivel').value;
    try{
      const {error}=await SB.rpc('kimun_prof_curso_nivel',{p_curso_codigo:cursoCodigo, p_nivel:n});
      if(error) throw error;
      aviso('Nivel fijado'); pintarLista();
    }catch(e){ aviso(errorPanel(e)); }
  };
  caja.querySelectorAll('.eq-quitar').forEach(b=>b.onclick=()=>equipoQuitar(b.dataset.cod, b.dataset.correo));
  // Editar: precarga correo + casillas y cambia el botón a "Guardar cambios".
  caja.querySelectorAll('.eq-editar').forEach(b=>b.onclick=()=>{
    caja.querySelector('.eq-correo').value=b.dataset.correo;
    const marcadas=new Set((b.dataset.asig||'').split('|').filter(Boolean));
    caja.querySelectorAll('.eq-asig').forEach(c=>c.checked=marcadas.has(c.value));
    if(puedeJefe){ const r=caja.querySelector('.eq-rol[value="asignatura"]'); if(r) r.checked=true; }
    const bt=caja.querySelector('.eq-asignar'); bt.textContent='Guardar cambios';
    caja.querySelector('.eq-correo').focus();
  });
  caja.querySelector('.eq-asignar').onclick=()=>{
    const correo=(caja.querySelector('.eq-correo').value||'').trim();
    if(!correo){ aviso('Escribe el correo del profesor.'); return; }
    const rolEl=caja.querySelector('.eq-rol:checked');
    const rol = rolEl ? rolEl.value : 'asignatura';   // sin selector → asignatura
    const asigs=[...caja.querySelectorAll('.eq-asig:checked')].map(c=>c.value);
    if(rol==='asignatura' && !asigs.length){ aviso('Marca al menos una asignatura.'); return; }
    equipoAsignar(cursoCodigo, correo, rol, asigs);
  };
}

/* El nivel lo lleva el <details> del curso en el DOM, que es donde ya vive. Hace falta
   porque los bloques se REPINTAN tras cada accion (crear el enlace, agregar al equipo) y
   sin esto la recarga pierde el nivel: las casillas vuelven a las de todos los niveles y
   el selector del enlace cae a la primera opcion, que es 8. Mordio dos veces. */
function nivelDeCurso(cod){
  const d=document.querySelector('details[data-cod="'+CSS.escape(cod)+'"][data-nivel]');
  return d ? (d.dataset.nivel||'') : '';
}
async function equipoAsignar(cursoCodigo, correo, rol, asigs){
  try{
    const {error}=await SB.rpc('kimun_prof_equipo_asignar',
      {p_curso_codigo:cursoCodigo, p_correo:correo, p_rol:rol, p_asignaturas:asigs});
    if(error) throw error; aviso('Profesor agregado al equipo','var(--green)');
    cargarEquipo(cursoCodigo, nivelDeCurso(cursoCodigo));
  }catch(e){ aviso(errorPanel(e)); }
}

async function equipoQuitar(cursoCodigo, correo){
  if(!confirm('¿Quitar a este profesor del curso?\n\nNo se borra ningún dato de los alumnos; solo pierde el acceso a este curso.')) return;
  try{
    const {error}=await SB.rpc('kimun_prof_equipo_quitar',{p_curso_codigo:cursoCodigo, p_correo:correo});
    if(error) throw error; aviso('Profesor quitado del curso','var(--green)');
    cargarEquipo(cursoCodigo, nivelDeCurso(cursoCodigo));
  }catch(e){ aviso(errorPanel(e)); }
}

/* ===== Avance por objetivo de aprendizaje ===== */

// El límite se dice con todas sus letras en las dos vistas: el dato viaja desde el
// teléfono del alumno, así que es una brújula para decidir qué repasar, no una nota.
const AVISO_NO_CALIFICA = 'El porcentaje es del <b>primer intento</b>: cuántos acertaron la '+
  'primera vez que vieron ese contenido. <b>No sirve para calificar:</b> el dato lo reporta '+
  'el teléfono del alumno. Ten en cuenta que, con cuatro opciones por pregunta, responder '+
  'al azar da 25%.';

// Encabezado que acompaña el desplazamiento: dice de quién es la tabla y deja el camino
// de vuelta siempre a mano. El título del panel ("Mis cursos") se oculta mientras tanto,
// porque aquí ya no describe lo que se está mirando.
function cabeceraAvance(titulo, sub){
  $('panelTitulo').classList.add('hide');
  $('profId').classList.add('hide');
  return `<div class="av-head">
    <button class="ico" id="btnVolverCab" title="Volver">←</button>
    <div style="min-width:0">
      <b class="av-head-tit">${esc(titulo)}</b>
      <div class="av-head-sub">${esc(sub)}</div>
    </div>
  </div>`;
}

const SIN_DATOS_ASIG =
  '<p style="color:var(--dim);font-size:13px">Esta asignatura todavía no tiene datos.</p>';
// Niveles con armador de enlaces de muestra. Un curso nuevo = una linea mas aca;
// la pantalla del armador (?armar=1) ya vive dentro de cada app.
/* LA lista de niveles y sus asignaturas. Todo sale de assets/js/niveles.js, que guarda
   SOLO lo que no se puede derivar: agregar un curso es una fila ahí, y nada más.
   Los nombres de estas tres constantes se conservan porque los usan ~20 sitios del panel;
   lo único que cambió es de dónde salen sus datos. Cada una deriva de NIV directamente y
   no de las otras, para que el orden de las declaraciones no pueda morder. */
const NIVELES_MUESTRA = NIV.NIVELES;
const NIVEL_NOMBRE = n => (NIVELES_MUESTRA.find(x=>x.nivel===n)||{}).nombre || '';
const asigsDeNivel = n => NIV.deNivel(n);
// Orden canónico: por nivel descendente y, dentro de cada uno, Historia · Matemática ·
// Ciencias · Lenguaje. Antes 3° iba en otro orden porque su lista se escribió a mano.
const ASIG_ORDEN = NIV.codigos();
const ASIG_NOMBRE = {};
ASIG_ORDEN.forEach(c => { ASIG_NOMBRE[c] = NIV.nombre(c); });;

// Filtro por asignatura. Con una sola asignatura no filtra nada y solo ocupa pantalla,
// así que no se dibuja.
function filtrosAsignatura(data){
  const hay = new Set(data.map(f => String(f.oa).slice(0,4)));
  const asigs = ASIG_ORDEN.filter(a => hay.has(a));
  if(asigs.length < 2) return '';
  return `<div class="av-filtros">
    <button class="av-chip on" data-asig="">Todas</button>
    ${asigs.map(a=>`<button class="av-chip" data-asig="${a}">${ASIG_NOMBRE[a]}</button>`).join('')}
  </div>`;
}

// Reparte a los alumnos del curso en cuatro grupos por su última entrada. La ventana es
// móvil (7 días hacia atrás), no "desde el lunes", para no depender de la zona horaria del
// servidor. "Nunca canjearon" se separa de "dejaron de jugar" porque la acción es distinta:
// volver a entregar el código, no insistirle al niño.
const PART_DIAS = 7;
function gruposParticipacion(filas){
  const g = {semana:[], viejo:[], sinJugar:[], sinCodigo:[]};
  const corte = Date.now() - PART_DIAS*24*60*60*1000;
  (filas||[]).forEach(f => {
    if(!f.vinculado){ g.sinCodigo.push(f); return; }
    if(!f.visto){ g.sinJugar.push(f); return; }
    (new Date(f.visto).getTime() >= corte ? g.semana : g.viejo).push(f);
  });
  return g;
}

// El bloque va plegado, con el titular en la línea visible: es el dato que hay que ver sin
// abrir nada. Se pinta primero con "Cargando…" y se rellena aparte, para no retrasar el mapa.
function bloqueParticipacionHTML(){
  return `<details id="partBloque" style="margin-bottom:12px;border:1px solid #ffffff22;
            border-radius:12px;padding:8px 10px">
    <summary style="cursor:pointer;list-style:none;color:var(--cyan);font-size:13px"
             id="partTitular">Participación · cargando…</summary>
    <div id="partCuerpo" style="padding-top:6px"></div>
  </details>`;
}

function pintarParticipacion(titular, cuerpo, filas){
  const g = gruposParticipacion(filas);
  const total = (filas||[]).length;
  titular.textContent =
    `Participación · ${g.semana.length} de ${total} jugaron esta semana`;
  cuerpo.innerHTML =
      grupoFichas('Jugaron esta semana', g.semana, 'var(--green)', false, '')
    + grupoFichas('Hace más de una semana', g.viejo, 'var(--gold)', false, '')
    + grupoFichas('Canjearon su código pero no han jugado', g.sinJugar, 'var(--dim)', true, '')
    + grupoFichas('Nunca canjearon su código', g.sinCodigo, 'var(--pink)', true,
        'Puede ser un código perdido o mal escrito, o que no tengan teléfono. La acción '
        + 'es volver a entregar el código. El dato lo reporta el teléfono: no es asistencia.')
    + (total ? '' : '<p style="color:var(--dim);font-size:12px">Este curso no tiene alumnos inscritos.</p>');
}

// Se lanza sin await desde verAvance: el mapa no la espera y su fallo no impide ver el
// avance. Si falla, el bloque lo dice y el mapa queda intacto.
//
// Los nodos se capturan ANTES del await: si el profesor cambia de curso mientras la
// consulta está en vuelo, verAvance repinta #lista con nodos nuevos (reusando los mismos
// ids) y estas referencias quedan huérfanas. Escribir en el nodo huérfano es inofensivo,
// en vez de pisar la participación del curso que ahora está a la vista. Mismo patrón
// defensivo que conectarFilasOA.
async function cargarParticipacion(cursoCodigo){
  const titular = $('partTitular'), cuerpo = $('partCuerpo');
  try{
    const {data,error} = await SB.rpc('kimun_prof_participacion',{p_curso_codigo:cursoCodigo});
    if(error) throw error;
    pintarParticipacion(titular, cuerpo, data);
  }catch(e){
    if(titular) titular.textContent = 'Participación · no se pudo cargar';
  }
}

// Titular de participación en la cabecera plegada de cada curso. Una consulta por curso,
// asíncrona, para no retrasar el render de la lista. El nodo se captura ANTES del await
// (mismo patrón defensivo que cargarParticipacion): si la lista se repinta mientras una
// consulta está en vuelo, la referencia vieja queda huérfana en vez de escribir el titular
// de un curso bajo la cabecera de otro.
function cargarTitularesParticipacion(codigos){
  (codigos||[]).forEach(async cod => {
    const nodo = document.querySelector('.cur-part[data-cod="'+CSS.escape(cod)+'"]');
    if(!nodo) return;
    try{
      const {data,error} = await SB.rpc('kimun_prof_participacion',{p_curso_codigo:cod});
      if(error) throw error;
      const g = gruposParticipacion(data);
      const total = (data||[]).length;
      nodo.textContent = `Participación · ${g.semana.length}/${total} jugaron esta semana`;
    }catch(e){
      nodo.textContent = 'Participación no disponible';
    }
  });
}

// Quién está a cargo de cada curso, en su encabezado. Sale de kimun_prof_equipo, que
// solo responde a Admin/Super/Jefe: a un profe de asignatura le da no_autorizado y la
// línea queda vacía, que es lo correcto (no es información suya).
// Un curso recién creado NACE SIN JEFE (desde la Sesión 38 el creador ya no se auto-nombra),
// así que decirlo en el encabezado es justo lo que hay que ver para acordarse de asignarlo.
function cargarJefes(codigos){
  (codigos||[]).forEach(async cod => {
    // El nodo se captura ANTES del await: si no, la respuesta lenta de un curso podría
    // escribirse bajo el encabezado de otro (la carrera de la Sesión 26).
    const nodo = document.querySelector('.cur-jefe[data-cod="'+CSS.escape(cod)+'"]');
    if(!nodo) return;
    try{
      const {data,error} = await SB.rpc('kimun_prof_equipo',{p_curso_codigo:cod});
      if(error) throw error;
      const equipo = data||[];
      const jefe = equipo.find(m => m.rol==='jefe');
      const otros = equipo.filter(m => m.rol!=='jefe').length;
      const cola = otros ? ` · ${otros} de asignatura` : '';
      if(jefe){
        nodo.classList.remove('sin');
        nodo.textContent = `👤 Profesor jefe: ${jefe.nombre || jefe.correo}${cola}`;
      }else{
        nodo.classList.add('sin');
        nodo.textContent = `⚠️ Sin profesor jefe${cola}`;
      }
    }catch(e){
      nodo.textContent = '';   // sin permiso para verlo: mejor nada que un error
    }
  });
}

// Cablea los chips. El filtro elegido se devuelve por callback, porque cada vista
// repinta cosas distintas.
function conectarFiltros(alCambiar){
  document.querySelectorAll('#lista .av-chip').forEach(chip => chip.onclick = () => {
    document.querySelectorAll('#lista .av-chip')
      .forEach(o => o.classList.toggle('on', o === chip));
    alCambiar(chip.dataset.asig || '');
    // La tabla nueva es más corta que la anterior: el punto donde estaba el profesor
    // ya no existe, así que se vuelve al principio en vez de dejarlo en el vacío.
    irArriba();
  });
}

// Carga perezosa: cada objetivo pide sus alumnos la primera vez que se abre. Con 50
// objetivos, pedirlos por adelantado serían 50 llamadas para algo que casi nunca se mira
// entero. Se vuelve a cablear cada vez que el filtro repinta el cuerpo.
function conectarFilasOA(cursoCodigo){
  document.querySelectorAll('#avCuerpo .oa-fila').forEach(det => det.addEventListener('toggle', async () => {
    if(!det.open || det.dataset.cargado) return;
    det.dataset.cargado = '1';
    const caja = det.querySelector('.oa-detalle');
    // Se limpia el mensaje del intento anterior: si no, al reabrir tras un fallo el
    // profesor sigue leyendo el error viejo mientras la consulta ya va en camino.
    caja.textContent = 'Cargando…';
    try{
      const {data,error} = await SB.rpc('kimun_prof_dominio_oa',
        {p_curso_codigo:cursoCodigo, p_oa:det.dataset.oa});
      if(error) throw error;
      caja.innerHTML = detalleApoyo(data);
    }catch(e){
      det.dataset.cargado = '';          // permite reintentar cerrando y abriendo
      caja.textContent = esNoAutorizado(e)
        ? 'No tienes permiso para esto, o el curso ya no existe.'
        : 'No se pudo cargar. Cierra y vuelve a abrir.';
    }
  }));
}

/* ===== Desafío de refuerzo (bloque en la vista de avance) ===== */

// Objetivos flojos de una asignatura: primer intento < 70% con evidencia (>=4 alumnos de
// primer intento), peores primero, tope 5. `filas` viene de kimun_prof_dominio. La
// asignatura llega como CÓDIGO de 4 letras (HI08…), la clave canónica del sistema.
function objetivosFlojos(filas, asigCodigo){
  return (filas||[])
    .filter(f => asigCodigo && String(f.oa).slice(0,4) === asigCodigo
                 && f.resp_1 > 0 && f.alumnos_1 >= 4
                 && (f.ok_1 / f.resp_1) < 0.70)
    .sort((a,b) => (a.ok_1/a.resp_1) - (b.ok_1/b.resp_1))
    .slice(0,5);
}

// Bloque "Refuerzo" bajo el mapa: muestra el desafío activo (seguimiento) o, si no hay, la
// sugerencia por asignatura con botón de lanzar. Se cablea aparte para poder repintarse tras
// lanzar/cerrar sin salir de la vista de avance (no usa `accion`, que vuelve al panel).
async function cargarRefuerzo(cursoCodigo, filasDominio){
  const cont = document.getElementById('refuerzoBloque');
  if(!cont) return;
  let est=null;
  try{ const {data}=await SB.rpc('kimun_prof_refuerzo_estado',{p_curso_codigo:cursoCodigo});
       est=(data&&data[0])||null; }catch(e){ est=null; }
  if(est){
    const acierto = est.total>0 ? Math.round(est.correctas/est.total*100) : 0;
    const pi = est.pi_resp>0 ? Math.round(est.pi_ok/est.pi_resp*100) : 0;
    cont.innerHTML = `
      <h3 style="color:var(--gold);font-size:15px;margin:0 0 8px">📣 Refuerzo de ${esc(ASIG_NOMBRE[est.asignatura]||est.asignatura)} · activo</h3>
      <p style="font-size:13px;margin:0 0 8px">Lo completaron <b>${est.completaron}/${est.inscritos}</b> ·
        acierto del curso <b>${acierto}%</b> (primer intento era <b>${pi}%</b>).</p>
      <button class="btn sec" id="refCerrar">Cerrar desafío</button>`;
    document.getElementById('refCerrar').onclick=async ()=>{
      if(!confirm('¿Cerrar el desafío de refuerzo? Dejará de aparecerles a los alumnos.')) return;
      try{ const {error}=await SB.rpc('kimun_prof_refuerzo_cerrar',{p_curso_codigo:cursoCodigo});
           if(error) throw error; aviso('Desafío cerrado','var(--green)'); }
      catch(e){ aviso(errorPanel(e)); }
      cargarRefuerzo(cursoCodigo, filasDominio);
    };
    return;
  }
  // Por su código canónico. Se lee del catálogo para no repetir la lista: cuando faltaba
  // Matemática aquí, no se podía lanzar su refuerzo y nadie lo notó (bug de la Sesión 37).
  const ASIGS = ASIG_ORDEN.map(c=>[c, ASIG_NOMBRE[c]||c]);
  const bloques=ASIGS.map(([cod,nom])=>{
    const objs=objetivosFlojos(filasDominio,cod);
    if(!objs.length) return '';
    const lista=objs.map(o=>{
      const pct=Math.round(o.ok_1/o.resp_1*100);
      return `<li style="font-size:12px;color:var(--dim)">${esc(OA_TEXTO[o.oa]||o.oa)} · ${pct}%</li>`;
    }).join('');
    return `<div style="margin-bottom:12px">
      <p style="font-size:13px;margin:0 0 4px"><b>${nom}</b> · ${objs.length} objetivo${objs.length===1?'':'s'} para reforzar</p>
      <ul style="margin:0 0 6px 16px;padding:0">${lista}</ul>
      <button class="btn-chip refLanzar" data-asig="${cod}" data-nom="${esc(nom)}"
        data-oas="${esc(objs.map(o=>o.oa).join('|'))}"
        >📣 Lanzar desafío de refuerzo de ${esc(nom)}</button></div>`;
  }).filter(Boolean).join('');
  cont.innerHTML = bloques
    ? `<h3 style="color:var(--gold);font-size:15px;margin:0 0 8px">Refuerzo sugerido</h3>${bloques}`
    : '<p style="color:var(--dim);font-size:12px">No hay objetivos bajo el umbral para reforzar por ahora.</p>';
  cont.querySelectorAll('.refLanzar').forEach(b=>b.onclick=async ()=>{
    const oas=b.dataset.oas.split('|');
    if(!confirm(`¿Lanzar el desafío de refuerzo de ${b.dataset.nom}?\n\nLes aparecerá a todos los alumnos del curso.`)) return;
    try{ const {error}=await SB.rpc('kimun_prof_refuerzo_lanzar',
      {p_curso_codigo:cursoCodigo,p_asignatura:b.dataset.asig,p_objetivos:oas});  // p_asignatura = código
      if(error) throw error; aviso('Desafío lanzado','var(--green)'); }
    catch(e){ aviso(errorPanel(e)); }
    cargarRefuerzo(cursoCodigo, filasDominio);
  });
}

/* ===== Ranking por asignatura (bloque en la vista de avance) ===== */
// Un ranking por cada asignatura presente en el mapa del curso. La asignatura se
// deduce del mapa que ya tenemos (data de kimun_prof_dominio), que el servidor ya
// filtró a las mías: si no aparece HI08 en el mapa, no pido su ranking.
async function cargarRankingAsignatura(cursoCodigo, filasDominio){
  const cont=document.getElementById('rankingBloque');
  if(!cont) return;
  // Asignaturas presentes en el mapa (código de 4 letras), en el orden fijo.
  const presentes = ASIG_ORDEN.filter(a =>
    (filasDominio||[]).some(f => String(f.oa).slice(0,4) === a
                                 || SB_asigDe(f.oa) === a));
  if(!presentes.length){ cont.innerHTML=''; return; }
  cont.innerHTML = `<h3 style="color:var(--cyan);font-size:15px;margin:0 0 8px">Ranking por asignatura</h3>
    <p style="color:var(--dim);font-size:12px;margin:0 0 8px">Acierto de primer intento. Necesita al menos 20 respuestas para contar; el resto queda en “aún sin datos suficientes”.</p>
    <div id="rankAsigTabs" class="av-filtros"></div>
    <div id="rankAsigCuerpo"></div>`;
  const tabs=document.getElementById('rankAsigTabs');
  tabs.innerHTML=presentes.map((a,i)=>
    `<button class="av-chip${i===0?' on':''}" data-asig="${a}">${ASIG_NOMBRE[a]}</button>`).join('');
  const pintar=async (asig)=>{
    const cuerpo=document.getElementById('rankAsigCuerpo');
    cuerpo.innerHTML='<p style="color:var(--dim);font-size:12px">Cargando…</p>';
    try{
      const {data,error}=await SB.rpc('kimun_prof_ranking_asignatura',
        {p_curso_codigo:cursoCodigo, p_asignatura:asig, p_minimo:20});
      if(error) throw error;
      cuerpo.innerHTML=rankingHTML(data||[], asig);
    }catch(e){ cuerpo.innerHTML='<p style="color:var(--pink);font-size:12px">'+errorPanel(e)+'</p>'; }
  };
  tabs.querySelectorAll('.av-chip').forEach(ch=>ch.onclick=()=>{
    tabs.querySelectorAll('.av-chip').forEach(o=>o.classList.toggle('on',o===ch));
    pintar(ch.dataset.asig);
  });
  pintar(presentes[0]);
}

// Devuelve la asignatura de un OA en el cliente, para saber qué rankings pedir.
// Refleja la regla de kimun_oa_asignatura para los códigos que llegan al mapa.
/* De un código de objetivo a su asignatura. Era un ESPEJO ESCRITO A MANO de la función
   `kimun_oa_asignatura` que vive en PostgreSQL: las dos hacían lo mismo línea por línea,
   y ese patrón ya causó un defecto real (Sesión 37). Ahora las dos derivan de la misma
   idea —el nivel vive dentro del código— y solo los módulos transversales van a mano. */
function SB_asigDe(oa){ return NIV.asigDe(oa); }

function rankingHTML(filas, asig){
  const total = OA_TOTAL[asig] || 0;
  const conDatos = filas.filter(f => f.suficiente);
  const sinDatos = filas.filter(f => !f.suficiente);
  const fila = f => {
    const cob = total ? ` · ${f.oa_tocados}/${total} objetivos` : '';
    return `<div style="display:flex;gap:8px;align-items:center;padding:4px 0;font-size:13px">
      <span>${esc(f.avatar||'🦊')}</span><b>${esc(f.alumno)}</b>
      <span style="margin-left:auto;color:var(--gold)">${f.pct==null?'—':f.pct+'%'}</span>
      <span style="color:var(--dim);font-size:11px">${f.resp_1} resp${cob}</span>
    </div>`;
  };
  const bloqueConDatos = conDatos.length
    ? conDatos.map(fila).join('')
    : '<p style="color:var(--dim);font-size:12px">Nadie llega aún a 20 respuestas en esta asignatura.</p>';
  const bloqueSin = sinDatos.length
    ? `<details style="margin-top:8px"><summary style="cursor:pointer;color:var(--dim);font-size:12px;list-style:none">Aún sin datos suficientes (${sinDatos.length})</summary>
         <div style="margin-top:6px">${sinDatos.map(fila).join('')}</div></details>`
    : '';
  return bloqueConDatos + bloqueSin;
}

// Tabla de dominio, ordenada de peor a mejor: lo que hay que reforzar queda arriba.
// El servidor ya la devuelve en ese orden, así que no se reordena.
async function verAvance(cursoCodigo, cursoNombre, gestiono){
  aviso('Cargando…','var(--dim)');
  try{
    const {data,error}=await SB.rpc('kimun_prof_dominio',{p_curso_codigo:cursoCodigo});
    if(error) throw error;
    const titulo = cursoNombre || cursoCodigo;
    if(!data || !data.length){
      $('lista').innerHTML = cabeceraAvance(titulo, 'Avance por objetivo')
        + bloqueParticipacionHTML() + `
        <p style="color:var(--dim);font-size:13px">
        Todavía no hay datos de avance de este curso. Aparecen cuando los alumnos juegan las campañas.</p>
        <button class="btn sec" id="btnVolverPanel">← Volver</button>`;
      $('btnVolverCab').onclick = volverAlPanel;
      $('btnVolverPanel').onclick = volverAlPanel;
      cargarParticipacion(cursoCodigo);
      irArriba(); aviso(''); return;
    }
    await cargarTextosOA(data.map(f => f.oa));
    $('lista').innerHTML = cabeceraAvance(titulo, 'Avance por objetivo')
      + bloqueParticipacionHTML() + `
      <p style="color:var(--dim);font-size:12px;margin-bottom:10px">
        Porcentaje de acierto por objetivo, de menor a mayor. ${AVISO_NO_CALIFICA}</p>
      ${filtrosAsignatura(data)}
      <div id="avCuerpo"></div>
      <div id="rankingBloque" style="margin-top:16px;border-top:1px solid #ffffff22;padding-top:12px"></div>
      <p style="color:var(--dim);font-size:11px;margin-top:12px">
        El camino de aprendizaje de Matemáticas sí aparece aquí cuando los alumnos juegan sus
        lecciones. El Reto de Cálculo no se mide: genera operaciones al momento, sin un objetivo
        del currículum asociado.</p>
      <div id="refuerzoBloque" style="margin-top:16px;border-top:1px solid #ffffff22;padding-top:12px"></div>
      <div style="margin-top:14px">
        ${gestiono?`<button class="btn sec" id="btnReiniciarMed">🔄 Reiniciar mediciones</button>`:''}
        <button class="btn sec" id="btnVolverPanel">← Volver</button>
      </div>`;
    $('btnVolverCab').onclick = volverAlPanel;
    $('btnVolverPanel').onclick = volverAlPanel;
    const bReinit=$('btnReiniciarMed'); if(bReinit) bReinit.onclick=()=>reiniciarMediciones(cursoCodigo, cursoNombre, gestiono);
    cargarParticipacion(cursoCodigo);

    let filtro = '';                                  // '' = todas las asignaturas
    const pintarCuerpo = () => {
      const filas = filtro ? data.filter(f => String(f.oa).slice(0,4) === filtro) : data;
      $('avCuerpo').innerHTML = filas.length ? bloquesAvance(filas) : SIN_DATOS_ASIG;
      conectarFilasOA(cursoCodigo);
    };
    conectarFiltros(a => { filtro = a; pintarCuerpo(); });
    pintarCuerpo();
    cargarRefuerzo(cursoCodigo, data);
    cargarRankingAsignatura(cursoCodigo, data);
    irArriba();
    aviso('');
  }catch(e){ aviso(errorPanel(e)); }
}

  aviso('Cargando…','var(--dim)');
  try{
    const {data,error}=await SB.rpc('kimun_prof_dominio_alumno',{p_perfil:perfilId});
    if(error) throw error;
    const titulo = alumnoNombre || 'Alumno';
    if(!data || !data.length){
      $('lista').innerHTML = cabeceraAvance(titulo, 'Avance por objetivo') + `
        <p style="color:var(--dim);font-size:13px">
        Este alumno todavía no tiene datos. Aparecen cuando juega las campañas.</p>
        <button class="btn sec" id="btnVolverPanel">← Volver</button>`;
      $('btnVolverCab').onclick = volverAlPanel;
      $('btnVolverPanel').onclick = volverAlPanel;
      irArriba(); aviso(''); return;
    }
    await cargarTextosOA(data.map(f => f.oa));
    $('lista').innerHTML = cabeceraAvance(titulo, 'Avance por objetivo') + `
      <p style="color:var(--dim);font-size:12px;margin-bottom:10px">
        Objetivos de este alumno, de menor a mayor acierto. ${AVISO_NO_CALIFICA}</p>
      ${filtrosAsignatura(data)}
      <div id="avCuerpo"></div>
      <button class="btn sec" id="btnVolverPanel" style="margin-top:14px">← Volver</button>`;
    $('btnVolverCab').onclick = volverAlPanel;
    $('btnVolverPanel').onclick = volverAlPanel;

    let filtro = '';
    const pintarCuerpo = () => {
      const filas = filtro ? data.filter(f => String(f.oa).slice(0,4) === filtro) : data;
      $('avCuerpo').innerHTML = filas.length ? filas.map(filaAvance).join('') : SIN_DATOS_ASIG;
      // Aquí la fila NO se despliega: esta vista es de un solo alumno, así que no hay
      // grupos que mostrar. Sin esto quedaría un desplegable con "Cargando…" para siempre.
      document.querySelectorAll('#avCuerpo .oa-fila').forEach(det => {
        det.querySelector('summary').style.cursor = 'default';
        det.addEventListener('click', e => e.preventDefault());   // no despliega
        // Como no se puede desplegar, el recorte a dos líneas dejaría los textos largos
        // truncados para siempre; en esta vista se muestran enteros.
        const t = det.querySelector('.oa-texto'); if(t) t.classList.remove('oa-texto');
        const d = det.querySelector('.oa-detalle'); if(d) d.remove();
      });
    };
    conectarFiltros(a => { filtro = a; pintarCuerpo(); });
    pintarCuerpo();
    irArriba();
    aviso('');
  }catch(e){ aviso(errorPanel(e)); }
}

// Una fila del mapa. El porcentaje es el del PRIMER intento: cuántos acertaron la primera
// vez que vieron ese contenido. El acumulado con reintentos se muestra aparte, como señal
// de cuánto costó, porque mezclarlos sesga el número (quien no entiende reintenta, y así
// pesa más en el promedio del curso).
function filaAvance(f){
  const r1 = Number(f.resp_1)||0, o1 = Number(f.ok_1)||0;
  const total = Number(f.respondidas)||0;
  const alumnos = Number(f.alumnos_1 != null ? f.alumnos_1 : f.alumnos)||0;
  const reintentos = Math.max(0, total - r1);
  const pct = r1 ? Math.round(o1*100/r1) : 0;
  // Cortes calibrados al piso del azar: con 4 opciones, responder sin saber da 25%.
  // Un 50% no es "la mitad": es un tercio de dominio real.
  const color = pct >= 70 ? 'var(--green)' : pct >= 45 ? 'var(--gold)' : 'var(--pink)';
  // En la vista de curso el respaldo son los alumnos; en la de un alumno concreto no hay
  // tal conteo, así que se muestran sus preguntas de primer intento.
  const base = alumnos ? `${alumnos} alumno${alumnos===1?'':'s'}`
             : r1     ? `${r1} pregunta${r1===1?'':'s'}`
             : 'sin primer intento';
  const detalle = base + (reintentos ? ` · ${reintentos} reintento${reintentos===1?'':'s'}` : '');
  // El detalle se pide al abrir, no al cargar la tabla: con 50 objetivos serían 50
  // llamadas por adelantado para algo que casi nunca se mira entero.
  const idOa = String(f.oa).replace(/[^A-Za-z0-9]/g,'');
  return `<details class="oa-fila" data-oa="${esc(f.oa)}" id="oa-${idOa}"
                   style="padding:8px 0;border-bottom:1px solid #ffffff14">
    <summary style="cursor:pointer;list-style:none">
      <div class="oa-texto">${esc(OA_TEXTO[f.oa]||f.oa)}</div>
      <div style="display:flex;align-items:center;gap:8px">
        <div style="flex:1;height:8px;background:#ffffff14;border-radius:4px;overflow:hidden">
          <div style="width:${pct}%;height:100%;background:${color}"></div>
        </div>
        <b style="color:${color};min-width:42px;text-align:right">${pct}%</b>
        <small style="color:var(--dim);min-width:120px;text-align:right">${detalle}</small>
      </div>
    </summary>
    <div class="oa-detalle" style="padding-top:6px;color:var(--dim);font-size:12px">Cargando…</div>
  </details>`;
}

// Reparte a los alumnos de un objetivo en cuatro grupos. Los umbrales son los mismos que
// los colores del mapa (45 y 70), que ya están calibrados al piso del azar.
// "Sin evidencia" recoge a quienes no lo jugaron y a quienes tienen menos de 4 preguntas
// de primer intento: con una sola pregunta —caso típico de un jefe final, donde cae una de
// cada objetivo— un alumno queda en 0% o 100%, y mandarlo al refuerzo por eso sería una
// decisión injusta tomada sobre nada.
const APOYO_MIN_PREGUNTAS = 4;
function gruposApoyo(filas){
  const g = {apoyo:[], camino:[], logrado:[], sinDatos:[]};
  (filas||[]).forEach(f => {
    const r1 = Number(f.resp_1)||0, o1 = Number(f.ok_1)||0;
    if(r1 < APOYO_MIN_PREGUNTAS){ g.sinDatos.push(f); return; }
    const pct = o1*100/r1;
    if(pct <  45) g.apoyo.push(f);
    else if(pct < 70) g.camino.push(f);
    else g.logrado.push(f);
  });
  return g;
}

// Los nombres van como fichas en línea: 35 alumnos en columna serían cuatro pantallas
// en un teléfono. Sin porcentaje individual, a propósito: esta vista sirve para armar un
// grupo de refuerzo, no para comparar niños entre sí.
function fichasAlumnos(filas){
  return filas.map(f =>
    `<span style="display:inline-block;background:#ffffff14;border-radius:12px;
                  padding:3px 9px;margin:2px 3px 2px 0;font-size:12px">
       ${esc(f.avatar||'🦊')} ${esc(f.alumno)}</span>`).join('');
}

// Un grupo de alumnos como fichas dentro de un <details>. Compartido por la vista de
// apoyo (por objetivo) y por la de participación (por curso).
function grupoFichas(titulo, lista, color, plegado, nota){
  return !lista.length ? '' : `
    <details ${plegado?'':'open'} style="margin:6px 0 6px 10px">
      <summary style="color:${color};font-size:12px;cursor:pointer;padding:3px 0">
        ${titulo} (${lista.length})</summary>
      <div style="padding:4px 0">${fichasAlumnos(lista)}</div>
      ${nota?`<p style="color:var(--dim);font-size:11px;margin:2px 0 0">${nota}</p>`:''}
    </details>`;
}

function detalleApoyo(filas){
  const g = gruposApoyo(filas);
  return grupoFichas('Necesitan apoyo', g.apoyo, 'var(--pink)', false, '')
       + grupoFichas('En camino', g.camino, 'var(--gold)', false, '')
       + grupoFichas('Lo lograron', g.logrado, 'var(--green)', true, '')
       + grupoFichas('Todavía sin evidencia', g.sinDatos, 'var(--dim)', true,
               'No lo han jugado, o respondieron muy pocas preguntas para saberlo.');
}

// Separa por base en vez de atenuar. Ordenar de peor a mejor y a la vez atenuar las bases
// pequeñas se peleaba: la posición decía "mira esto primero" y la opacidad decía "ignora
// esto", de modo que la primera fila podía ser justo la menos confiable.
function bloquesAvance(data){
  const conBase = data.filter(f => (Number(f.alumnos_1)||0) >= 10);
  const sinBase = data.filter(f => (Number(f.alumnos_1)||0) <  10);
  const pctDe = f => (Number(f.resp_1)||0) ? (Number(f.ok_1)||0)*100/(Number(f.resp_1)||1) : 0;
  const reforzar = conBase.filter(f => pctDe(f) <  70);
  const bien     = conBase.filter(f => pctDe(f) >= 70);
  const seccion = (titulo, filas, plegada) => !filas.length ? '' : `
    <details ${plegada?'':'open'} style="margin-bottom:10px">
      <summary style="color:var(--cyan);font-size:13px;cursor:pointer;padding:6px 0">
        ${titulo} (${filas.length})</summary>
      ${filas.map(filaAvance).join('')}
    </details>`;
  return seccion('Para reforzar', reforzar, false)
       + seccion('Van bien', bien, false)
       + seccion('Todavía con pocos datos', sinBase, true);
}

async function reiniciarMediciones(cursoCodigo, cursoNombre, gestiono){
  if(!confirm('¿Reiniciar las mediciones de este curso?\n\n'+
    'Los porcentajes vuelven a cero y se empieza a medir de nuevo. Sirve al comenzar una '+
    'unidad o un semestre. No se borra ningún alumno ni su XP, pero las mediciones '+
    'anteriores no se pueden recuperar.')) return;
  try{
    const {error}=await SB.rpc('kimun_prof_dominio_reiniciar',{p_curso_codigo:cursoCodigo});
    if(error) throw error;
    await verAvance(cursoCodigo, cursoNombre, gestiono);
    aviso('Mediciones reiniciadas','var(--green)');
  }catch(e){ aviso(errorPanel(e)); }
}

// Ejecuta una acción, informa y refresca la lista. Centraliza el manejo de errores:
// supabase-js no lanza excepción cuando la función SQL falla, devuelve {data, error}.
async function accion(fn, exito){
  try{
    const {error}=await fn();
    if(error) throw error;
    await pintarLista();
    aviso(exito,'var(--green)');
  }catch(e){
    aviso(errorPanel(e));                   // ver el comentario de errorPanel
    try{ await pintarLista(); }catch(_){}   // refresca para mostrar la realidad
  }
}

async function limpiarPruebas(){
  try{
    const {data:n,error}=await SB.rpc('kimun_prof_limpiar_pruebas',{p_ejecutar:false});
    if(error) throw error;
    if(!n){ aviso('No hay perfiles de prueba','var(--green)'); return; }
    if(!confirm('Se van a borrar '+n+' perfil'+(n===1?'':'es')+' de prueba.\n\n'+
      'Son los que se crean solos cuando alguien abre el juego y nunca escribió un código de alumno.\n\n'+
      'También se pierden sus duelos. No se borran los alumnos inscritos ni los rivales de práctica.\n\n¿Continuar?')) return;
    const {data:b,error:e2}=await SB.rpc('kimun_prof_limpiar_pruebas',{p_ejecutar:true});
    if(e2) throw e2;
    await pintarLista();
    aviso('Se borraron '+b+' perfil'+(b===1?'':'es')+' de prueba','var(--green)');
  }catch(e){ aviso(traducir(e)); }
}

// Volver arriba. Aparece solo cuando hay trecho que subir: una tabla de 60 objetivos
// mide varias pantallas, y el encabezado pegado no basta para alcanzar los filtros.
(function(){
  const btn = $('btnArriba');
  const revisar = () => btn.classList.toggle('hide', window.scrollY < 600);
  window.addEventListener('scroll', revisar, {passive:true});
  btn.onclick = irArriba;
  revisar();
})();

// Si ya había sesión abierta, entrar directo al panel
(async ()=>{
  const {data:{session}}=await SB.auth.getSession();
  if(session){ try{ await cargarPanel(); }catch(e){ await manejarFalloDeIngreso(e); } }
})();
