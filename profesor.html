  // El enlace tiene que llevar al nivel del curso. Si el curso lo declara, se preselecciona
  // solo: mandarle a un 3o el enlace de /8vo/ es el error facil de esta pantalla.
  if(sel && nivel){ const n=NIVELES_MUESTRA.find(x=>x.nivel===nivel); if(n) sel.value=n.ruta; }
  function pintarUrl(){
    if(url&&sel&&fila){
      url.value=location.origin+sel.value+'?inscribir='+fila.token;
      // QR del enlace de inscripción (assets/js/qr.js). Respaldo vacío: inocuo si no cargó.
      if(window.QR) QR.pintar(caja.querySelector('.ins-qr'), url.value);
      const g=caja.querySelector('.ins-qr-grande');
      if(g) g.onclick=()=>QR.grande(url.value);
    }
  }
  pintarUrl();
  if(sel) sel.onchange=pintarUrl;
  const cop=caja.querySelector('.ins-copiar');
  if(cop) cop.onclick=async ()=>{
    try{ await navigator.clipboard.writeText(url.value); aviso('Enlace copiado'); }
    // Si el navegador bloquea el portapapeles, se selecciona para copiar a mano, en vez
    // de dejar un botón que aparenta funcionar (mismo criterio que el armador).
    catch(e){ url.focus(); url.select(); aviso('Cópialo con Ctrl+C'); }
  };
  caja.querySelector('.ins-crear').onclick=async ()=>{
    const cupo=parseInt(caja.querySelector('.ins-cupo').value,10);
    const exp=caja.querySelector('.ins-exper').checked;
    if(!(cupo>=1&&cupo<=500)){ aviso('El cupo va entre 1 y 500.'); return; }
    if(fila && !confirm('Esto cierra el enlace actual: quien todavía no lo haya usado no podrá entrar. ¿Seguir?')) return;
    try{
      const {error}=await SB.rpc('kimun_prof_inscripcion_crear',
        {p_curso_codigo:cursoCodigo, p_cupo:cupo, p_experimental:exp});
      if(error) throw error;
      aviso('Enlace creado');
      cargarInscripcion(cursoCodigo, nivelDeCurso(cursoCodigo));
    }catch(e){ aviso(errorPanel(e)); }
  };
}

/* ===== Equipo del curso (jefe/admin) ===== */
async function cargarEquipo(cursoCodigo, nivel){
  const caja=document.querySelector('.equipo-cuerpo[data-cod="'+cursoCodigo+'"]');
  if(!caja) return;
  caja.innerHTML='<p style="color:var(--dim);font-size:12px">Cargando…</p>';
  let equipo=[];
  try{
    const {data,error}=await SB.rpc('kimun_prof_equipo',{p_curso_codigo:cursoCodigo});
    if(error) throw error; equipo=data||[];
  }catch(e){ caja.innerHTML='<p style="color:var(--pink);font-size:12px">'+errorPanel(e)+'</p>'; return; }
  const puedeJefe = !!window.ESADMINCOLEGIO;   // solo Admin/Super nombran o quitan Jefe
  const filas=equipo.map(m=>{
    const esJefe = m.rol==='jefe';
    const asigs = esJefe ? 'todas las asignaturas'
      : (m.asignaturas&&m.asignaturas.length ? m.asignaturas.map(a=>ASIG_NOMBRE[a]||a).join(', ')
                                             : 'sin asignaturas');
    // El ✕ del Jefe solo lo ve Admin/Super; el de asignatura, cualquiera que gestione.
    const puedeQuitar = esJefe ? puedeJefe : true;
    // Editar solo aplica a profes de asignatura (el Jefe alcanza todas).
    const btnEditar = esJefe ? '' :
      `<button class="ico eq-editar" data-cod="${esc(cursoCodigo)}" data-correo="${esc(m.correo)}"
        data-asig="${esc((m.asignaturas||[]).join('|'))}" title="Editar asignaturas" style="color:var(--gold)">✎</button>`;
    return `<div class="equipo-fila" style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:4px 0;font-size:13px">
      <b style="color:var(--gold)">${esJefe?'⭐ ':''}${esc(m.nombre||m.correo)}</b>
      <span style="color:var(--dim)">${esc(asigs)}</span>
      <span style="margin-left:auto"></span>
      ${btnEditar}
      ${puedeQuitar?`<button class="ico ico-del eq-quitar" data-cod="${esc(cursoCodigo)}" data-correo="${esc(m.correo)}" title="Quitar del curso">✕</button>`:''}
    </div>`;
  }).join('');
  // Solo las asignaturas de ESTE curso. Un curso sin nivel —creado antes de que la
  // columna existiera— las muestra todas, como siempre, y ofrece fijárselo.
  const casillas=asigsDeNivel(nivel).map(a=>
    `<label style="font-size:12px"><input type="checkbox" class="eq-asig" value="${a}"> ${ASIG_NOMBRE[a]}</label>`).join('');
  const avisoNivel = nivel ? '' : `
      <div style="margin:6px 0;padding:8px;border:1px dashed #ffffff33;border-radius:10px">
        <p style="color:var(--gold);font-size:12px;margin:0 0 6px">
          Este curso no tiene nivel, así que se muestran las asignaturas de todos. Fíjaselo
          y quedan solo las suyas.</p>
        <select class="eq-nivel">${NIVELES_MUESTRA.map(n=>`<option value="${n.nivel}">${n.nombre}</option>`).join('')}</select>
        <button class="btn sec eq-fijar-nivel">Fijar el nivel</button>
      </div>`;
  // El radio de rol solo aparece si puede nombrar Jefe; si no, se fuerza 'asignatura'.
  const selectorRol = puedeJefe ? `
      <div style="margin:6px 0">
        <label style="font-size:12px;margin-right:10px"><input type="radio" name="eqrol-${esc(cursoCodigo)}" class="eq-rol" value="asignatura" checked> Profe de asignatura</label>
        <label style="font-size:12px"><input type="radio" name="eqrol-${esc(cursoCodigo)}" class="eq-rol" value="jefe"> Profesor Jefe</label>
      </div>` : '';
  caja.innerHTML=`${filas||'<p style="color:var(--dim);font-size:12px">Solo estás tú.</p>'}
    <div style="margin-top:8px;border-top:1px solid #ffffff22;padding-top:8px">
      <input class="eq-correo" type="email" placeholder="Correo del profesor (ya registrado)" style="width:100%">
      ${selectorRol}
      ${avisoNivel}
      <div class="eq-casillas" style="margin:0 0 6px">${casillas}</div>
      <button class="btn eq-asignar" data-cod="${esc(cursoCodigo)}">+ Agregar al equipo</button>
    </div>`;
  const bFijar=caja.querySelector('.eq-fijar-nivel');
  if(bFijar) bFijar.onclick=async ()=>{
    const n=caja.querySelector('.eq-nivel').value;
    try{
      const {error}=await SB.rpc('kimun_prof_curso_nivel',{p_curso_codigo:cursoCodigo, p_nivel:n});
      if(error) throw error;
      aviso('Nivel fijado'); pintarLista();
    }catch(e){ aviso(errorPanel(e)); }
  };
  caja.querySelectorAll('.eq-quitar').forEach(b=>b.onclick=()=>equipoQuitar(b.dataset.cod, b.dataset.correo));
  // Editar: precarga correo + casillas y cambia el botón a "Guardar cambios".
  caja.querySelectorAll('.eq-editar').forEach(b=>b.onclick=()=>{
    caja.querySelector('.eq-correo').value=b.dataset.correo;
    const marcadas=new Set((b.dataset.asig||'').split('|').filter(Boolean));
    caja.querySelectorAll('.eq-asig').forEach(c=>c.checked=marcadas.has(c.value));
    if(puedeJefe){ const r=caja.querySelector('.eq-rol[value="asignatura"]'); if(r) r.checked=true; }
    const bt=caja.querySelector('.eq-asignar'); bt.textContent='Guardar cambios';
    caja.querySelector('.eq-correo').focus();
  });
  caja.querySelector('.eq-asignar').onclick=()=>{
    const correo=(caja.querySelector('.eq-correo').value||'').trim();
    if(!correo){ aviso('Escribe el correo del profesor.'); return; }
    const rolEl=caja.querySelector('.eq-rol:checked');
    const rol = rolEl ? rolEl.value : 'asignatura';   // sin selector → asignatura
    const asigs=[...caja.querySelectorAll('.eq-asig:checked')].map(c=>c.value);
    if(rol==='asignatura' && !asigs.length){ aviso('Marca al menos una asignatura.'); return; }
    equipoAsignar(cursoCodigo, correo, rol, asigs);
  };
}

/* El nivel lo lleva el <details> del curso en el DOM, que es donde ya vive. Hace falta
   porque los bloques se REPINTAN tras cada accion (crear el enlace, agregar al equipo) y
   sin esto la recarga pierde el nivel: las casillas vuelven a las de todos los niveles y
   el selector del enlace cae a la primera opcion, que es 8. Mordio dos veces. */
function nivelDeCurso(cod){
  const d=document.querySelector('details[data-cod="'+CSS.escape(cod)+'"][data-nivel]');
  return d ? (d.dataset.nivel||'') : '';
}
async function equipoAsignar(cursoCodigo, correo, rol, asigs){
  try{
    const {error}=await SB.rpc('kimun_prof_equipo_asignar',
      {p_curso_codigo:cursoCodigo, p_correo:correo, p_rol:rol, p_asignaturas:asigs});
    if(error) throw error; aviso('Profesor agregado al equipo','var(--green)');
    cargarEquipo(cursoCodigo, nivelDeCurso(cursoCodigo));
  }catch(e){ aviso(errorPanel(e)); }
}

async function equipoQuitar(cursoCodigo, correo){
  if(!confirm('¿Quitar a este profesor del curso?\n\nNo se borra ningún dato de los alumnos; solo pierde el acceso a este curso.')) return;
  try{
    const {error}=await SB.rpc('kimun_prof_equipo_quitar',{p_curso_codigo:cursoCodigo, p_correo:correo});
    if(error) throw error; aviso('Profesor quitado del curso','var(--green)');
    cargarEquipo(cursoCodigo, nivelDeCurso(cursoCodigo));
  }catch(e){ aviso(errorPanel(e)); }
}

/* ===== Avance por objetivo de aprendizaje ===== */

// El límite se dice con todas sus letras en las dos vistas: el dato viaja desde el
// teléfono del alumno, así que es una brújula para decidir qué repasar, no una nota.
const AVISO_NO_CALIFICA = 'El porcentaje es del <b>primer intento</b>: cuántos acertaron la '+
  'primera vez que vieron ese contenido. <b>No sirve para calificar:</b> el dato lo reporta '+
  'el teléfono del alumno. Ten en cuenta que, con cuatro opciones por pregunta, responder '+
  'al azar da 25%.';

// Encabezado que acompaña el desplazamiento: dice de quién es la tabla y deja el camino
// de vuelta siempre a mano. El título del panel ("Mis cursos") se oculta mientras tanto,
// porque aquí ya no describe lo que se está mirando.
function cabeceraAvance(titulo, sub){
  $('panelTitulo').classList.add('hide');
  $('profId').classList.add('hide');
  return `<div class="av-head">
    <button class="ico" id="btnVolverCab" title="Volver">←</button>
    <div style="min-width:0">
      <b class="av-head-tit">${esc(titulo)}</b>
      <div class="av-head-sub">${esc(sub)}</div>
    </div>
  </div>`;
}

const SIN_DATOS_ASIG =
  '<p style="color:var(--dim);font-size:13px">Esta asignatura todavía no tiene datos.</p>';
// Niveles con armador de enlaces de muestra. Un curso nuevo = una linea mas aca;
// la pantalla del armador (?armar=1) ya vive dentro de cada app.
/* LA lista de niveles y sus asignaturas. Todo sale de assets/js/niveles.js, que guarda
   SOLO lo que no se puede derivar: agregar un curso es una fila ahí, y nada más.
   Los nombres de estas tres constantes se conservan porque los usan ~20 sitios del panel;
   lo único que cambió es de dónde salen sus datos. Cada una deriva de NIV directamente y
   no de las otras, para que el orden de las declaraciones no pueda morder. */
const NIVELES_MUESTRA = NIV.NIVELES;
const NIVEL_NOMBRE = n => (NIVELES_MUESTRA.find(x=>x.nivel===n)||{}).nombre || '';
const asigsDeNivel = n => NIV.deNivel(n);
// Orden canónico: por nivel descendente y, dentro de cada uno, Historia · Matemática ·
// Ciencias · Lenguaje. Antes 3° iba en otro orden porque su lista se escribió a mano.
const ASIG_ORDEN = NIV.codigos();
const ASIG_NOMBRE = {};
ASIG_ORDEN.forEach(c => { ASIG_NOMBRE[c] = NIV.nombre(c); });;

/* Filtro por asignatura y agrupador, que son cosas distintas: filtrar deja UNA a la vista;
   agrupar las muestra todas, ordenadas.
   ⚠️ Y tienen guards DISTINTOS. El filtro por asignatura no sirve con una sola —no filtra
   nada y ocupa pantalla—, pero **agrupar por UNIDAD sirve justo con una**: es el caso del
   profe de asignatura, que quiere ver su año por unidades. Los dos vivían bajo el mismo
   `if`, así que el agrupador entero desaparecía para él. */
function filtrosAsignatura(data){
  const hay = new Set(data.map(f => String(f.oa).slice(0,4)));
  const asigs = ASIG_ORDEN.filter(a => hay.has(a));
  const multi = asigs.length >= 2;
  const filtro = multi ? `<div class="av-filtros">
    <button class="av-chip on" data-asig="">Todas</button>
    ${asigs.map(a=>`<button class="av-chip" data-asig="${a}">${ASIG_NOMBRE[a]}</button>`).join('')}
  </div>` : '';
  return filtro + `
  <div class="av-filtros" id="avAgrupar">
    <span style="color:var(--dim);font-size:12px;align-self:center;margin-right:2px">Agrupar por</span>
    <button class="av-chip on" data-agr="">Rendimiento</button>
    <button class="av-chip" data-agr="unidad">Unidad</button>
    ${multi?`<button class="av-chip" data-agr="asig">Asignatura</button>`:''}
  </div>`;
}

/* ===== El pulso del colegio (vista de dirección / UTP) =====
   La única pantalla del panel que mira TODOS los cursos a la vez. Existe porque hasta
   ahora un SuperUsuario —la UTP o la dirección— veía lo mismo que un profesor y tenía que
   entrar curso por curso, así que no había forma de responder "¿dónde va el programa?" ni
   de llevarse nada a un consejo.

   ⚠️ Muestra COBERTURA y PARTICIPACIÓN, y ningún porcentaje de acierto. No es una omisión
   por falta de tiempo: un tablero que ordene cursos por rendimiento es un ranking de
   profesores con otro nombre, y este proyecto lo tiene advertido desde la Sesión 24. La
   cobertura es cuánto se ha trabajado del programa y la participación es quién está
   entrando: los dos son HECHOS. El acierto es juicio, y se mira dentro de cada curso.
   La restricción vive además en la firma de kimun_prof_pulso, que no devuelve ni
   porcentajes ni nombres. */

const PULSO_NOTA =
  'Un objetivo cuenta como <b>trabajado</b> cuando algún alumno del curso lo jugó, no todos. '+
  '<b>Aquí no va el porcentaje de acierto:</b> esta hoja dice cuánto se ha avanzado del '+
  'programa y quiénes están entrando, que son hechos. El acierto se mira dentro de cada '+
  'curso, objetivo por objetivo, y no sirve para calificar: lo reporta el teléfono del alumno.';

// "7 de septiembre de 2026". La hoja impresa se lee semanas después, así que sin fecha
// se confunde con una foto de hoy.
function fechaLarga(d){
  const M = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto',
             'septiembre','octubre','noviembre','diciembre'];
  return d.getDate() + ' de ' + M[d.getMonth()] + ' de ' + d.getFullYear();
}

// Una fila = un curso. El desglose por asignatura va en la segunda línea porque es lo que
// vuelve accionable el número: "43 de 93" no dice qué hacer y "Ciencias 0/14" sí.
function filaPulso(f){
  const nivel = f.nivel ? NIVEL_NOMBRE(f.nivel) : '';
  const ident = `<b class="pul-nom">${esc(f.curso)}</b>`
    + `<span class="pul-sub">${nivel ? esc(nivel)+' · ' : ''}<code>${esc(f.curso_codigo)}</code></span>`;

  let cob;
  if(!f.inscritos){
    /* Sin alumnos no hay nada que medir, y un "0 de 99 · 99 sin empezar" sería cierto y
       aun así se leería como reproche a un curso que todavía no existe de verdad. La
       explicación va en la celda de al lado, que dice que no hay alumnos inscritos. */
    cob = `<span class="pul-falta">—</span>`;
  }else if(f.cobertura == null){
    // Sin nivel no hay denominador. Se dice qué falta y dónde se arregla, en vez de un
    // cero que se leería como "este curso no ha trabajado".
    cob = `<span class="pul-falta">Sin nivel asignado</span>`
        + `<span class="pul-sub">Fíjaselo en «Equipo del curso» para ver su cobertura</span>`;
  }else{
    const asigs  = NIV.deNivel(f.nivel);
    const por    = f.cobertura || {};
    const total  = totalOaNivel(f.nivel);
    if(!total){
      // Un oa.json que no cargó. Mejor decirlo que mostrar un denominador parcial, que
      // haría ver al curso más adelantado de lo que va.
      cob = `<span class="pul-falta">Cobertura no disponible</span>`
          + `<span class="pul-sub">No se pudo leer el temario de este nivel</span>`;
    }else{
      // Se acota por si un banco pierde un OA que algún alumno alcanzó a jugar: un
      // "94 de 93" desacreditaría la hoja entera.
      const hechos  = Math.min(asigs.reduce((s,a)=>s+(por[a]||0), 0), total);
      const detalle = asigs.map(a =>
        `${esc(NIV.ASIGS[a.slice(0,2)].nombre)} ${por[a]||0}/${OA_TOTAL[a]||0}`).join(' · ');
      cob = `<b>${hechos} de ${total}</b> objetivos trabajados`
          + `<span class="pul-sub">${total-hechos} sin empezar · ${detalle}</span>`;
    }
  }

  const part = f.inscritos > 0
    ? `<b>${f.jugaron_semana} de ${f.inscritos}</b> jugaron esta semana`
    : `<span class="pul-falta">Sin alumnos inscritos</span>`;

  return `<tr>
    <td data-rot="Curso">${ident}</td>
    <td data-rot="Cobertura del programa">${cob}</td>
    <td data-rot="Participación">${part}</td>
    <td class="no-print"><button class="btn-chip pul-ver" data-cod="${esc(f.curso_codigo)}"
      data-nom="${esc(f.curso)}" data-gestiono="${f.puede_gestionar?'1':''}">Ver avance</button></td>
  </tr>`;
}

async function verPulso(){
  aviso('Cargando…','var(--dim)');
  try{
    const {data,error} = await SB.rpc('kimun_prof_pulso');
    if(error) throw error;
    // Mismo orden que la lista de cursos, por la misma función: dos criterios distintos
    // para lo mismo es como terminan discrepando.
    const filas = (data||[]).slice().sort((a,b) =>
      ordenCursos({nombre:a.curso, nivel:a.nivel}, {nombre:b.curso, nivel:b.nivel}));
    /* Los oa.json de las CUATRO asignaturas de cada nivel presente, no solo de las que ya
       tienen actividad: si no, la asignatura que nadie ha jugado se queda sin denominador
       y desaparece justo del desglose donde más importa verla en cero. */
    await cargarTextosOA([...new Set(
      filas.filter(f=>f.nivel).flatMap(f=>NIV.deNivel(f.nivel)))]);

    const hoy = new Date();
    $('lista').innerHTML = cabeceraAvance('El pulso del colegio',
        filas.length + (filas.length===1 ? ' curso' : ' cursos'))
      /* Encabezado del PAPEL, oculto en pantalla. El colegio no existe como entidad en el
         modelo y no se inventa aquí; la hoja se titula con lo que el sistema sí sabe. */
      + `<div class="solo-print pul-hoja">
           <b>El pulso del colegio</b>
           <div>VULPO · ${filas.length} curso${filas.length===1?'':'s'} · impreso el ${esc(fechaLarga(hoy))}</div>
           <div>${esc(YO.nombre || YO.correo)}</div>
           <div>«Esta semana» son los 7 días anteriores a la impresión.</div>
         </div>`
      + (filas.length ? `<table class="pulso">
          <thead><tr><th>Curso</th><th>Cobertura del programa</th><th>Participación</th>
            <th class="no-print"></th></tr></thead>
          <tbody>${filas.map(f=>filaPulso(f)).join('')}</tbody>
        </table>`
        : `<p style="color:var(--dim);font-size:13px">Todavía no hay cursos creados.</p>`)
      + `<p class="pul-nota">${PULSO_NOTA}</p>`
      + `<div class="btn-fila no-print">
           <button class="btn sec" id="btnImprimirPulso">🖨️ Imprimir</button>
           <button class="btn txt" id="btnVolverPanel">← Volver</button>
         </div>`;

    /* En el papel esta cabecera sobra: .solo-print ya trae el título, y en la primera
       prueba salió dos veces. Se marca aquí y no en el CSS porque `.av-head` lo comparten
       las otras vistas, donde SÍ tiene que imprimirse: es lo único que dice de qué curso
       es la hoja. */
    document.querySelector('.av-head').classList.add('no-print');
    $('btnVolverCab').onclick   = volverAlPanel;
    $('btnVolverPanel').onclick = volverAlPanel;
    $('btnImprimirPulso').onclick = () => window.print();
    // El permiso lo manda el SERVIDOR (puede_gestionar), no se asume en el cliente.
    document.querySelectorAll('.pul-ver').forEach(b => b.onclick = () =>
      verAvance(b.dataset.cod, b.dataset.nom, !!b.dataset.gestiono));
    irArriba(); aviso('');
  }catch(e){ aviso(errorPanel(e)); }
}

/* ============================================================================
   EL INFORME DE CIERRE (A55)

   Responde la pregunta con la que Roberto planteó todo esto: *"no sirve mostrar avances
   en diciembre de asignaturas que se pasaron en abril"*. El mapa muestra el estado de
   HOY; esto muestra cómo estaba el curso cuando la unidad terminó, reconstruido de la
   foto del domingo que la cierra.

   ⚠️ La foto NO hay que tomarla: ya se está tomando. `dominio_semanal` guarda el detalle
   alumno×objetivo cada domingo desde la Sesión 36, así que no existe ningún botón de
   "cerrar unidad" que alguien pueda olvidar, las fechas se pueden poner después —incluso
   a fin de año— y los niños pueden seguir jugando sin contaminar el pasado.

   ⚠️ Y por eso la comparación con hoy va A LA VISTA y no escondida: es el argumento
   entero. Un objetivo que cerró en 78% y hoy marca 61% no bajó — entraron alumnos nuevos
   que lo tocaron por primera vez en otra unidad, y su primer intento se sumó al promedio
   de abril. Ver los dos números juntos es lo que lo explica.
   ============================================================================ */

const FOTOS_CACHE = {};   // 'CUR-BA04|2026-05-03' -> filas de esa foto

async function pedirFoto(cursoCodigo, semana){
  const k = cursoCodigo + '|' + semana;
  if(FOTOS_CACHE[k]) return FOTOS_CACHE[k];
  const {data,error} = await SB.rpc('kimun_prof_dominio_foto',
    {p_curso_codigo:cursoCodigo, p_semana:semana});
  if(error) throw error;
  return (FOTOS_CACHE[k] = data||[]);
}

const pctDeFila = f => {
  const r = Number(f.resp_1)||0;
  return r ? Math.round((Number(f.ok_1)||0)*100/r) : null;
};
const colorPct = p => p >= 70 ? 'var(--green)' : p >= 45 ? 'var(--gold)' : 'var(--pink)';

/* Una fila del informe de cierre. Es hermana de filaAvance pero NO la reusa, por dos
   motivos: aquí no hay desplegable —la foto no guarda el detalle por alumno que ese
   desplegable pide— y hace falta la columna "hoy", que el mapa no tiene. Tocar filaAvance
   para esto habría cambiado la tabla que está en producción. */
function filaCierre(f, hoy){
  const pct = pctDeFila(f);
  const alumnos = Number(f.alumnos_1)||0;
  const pHoy = hoy ? pctDeFila(hoy) : null;
  const dif = (pct != null && pHoy != null && pHoy !== pct) ? pHoy - pct : null;
  return `<div class="cie-fila">
    <div class="cie-texto">${esc(OA_TEXTO[f.oa]||f.oa)}</div>
    <div class="cie-medida">
      <div class="cie-barra"><div style="width:${pct||0}%;background:${colorPct(pct||0)}"></div></div>
      <b style="color:${colorPct(pct||0)}">${pct==null?'—':pct+'%'}</b>
      <small>${alumnos} alumno${alumnos===1?'':'s'}</small>
      ${dif != null ? `<small class="cie-hoy" title="Así se ve hoy el mismo objetivo. La diferencia casi siempre son alumnos que lo tocaron por primera vez DESPUÉS del cierre: su primer intento entra al promedio de esta unidad aunque el curso ya esté en otra.">hoy ${pHoy}%</small>` : ''}
    </div>
  </div>`;
}

// El bloque de UNA unidad dentro del informe: su encabezado y sus objetivos.
function bloqueCierre(asig, uni, titulo, termino, foto, filas, mapaHoy){
  const mios = filas.filter(f => String(f.oa).slice(0,4) === asig
    && OA_UNIDAD[f.oa] && OA_UNIDAD[f.oa].id === uni);
  const hoyPorOa = {};
  (mapaHoy||[]).forEach(f => { hoyPorOa[f.oa] = f; });
  const pcts = mios.map(pctDeFila).filter(p => p != null);
  const prom = pcts.length ? Math.round(pcts.reduce((a,b)=>a+b,0)/pcts.length) : null;
  const bajos = pcts.filter(p => p < 70).length;
  return `<div class="cie-bloque">
    <div class="cie-tit">${esc(ASIG_NOMBRE[asig]||asig)} · ${esc(uni)} ${esc(titulo)}</div>
    <div class="cie-sub">Cerrada el ${esc(fechaCortita(termino))} · foto del domingo ${
      esc(fechaCortita(foto))} · ${mios.length} objetivo${mios.length===1?'':'s'}${
      prom!=null ? ' · promedio ' + prom + '%' : ''}${
      bajos ? ' · ' + bajos + ' bajo 70%' : ''}</div>
    ${mios.length ? mios.map(f => filaCierre(f, hoyPorOa[f.oa])).join('')
      : `<p class="cie-vacio">Esta unidad no registra actividad en esa foto. Puede que el
         curso la haya trabajado fuera de VULPO, o que las fechas no correspondan.</p>`}
  </div>`;
}

// Las unidades que SE PUEDEN cerrar: con fecha de término y con una foto que la cubra.
function unidadesCerrables(asigs){
  const out = [];
  (asigs||[]).forEach(asig => (UNIDADES[asig]||[]).forEach(u => {
    const p = PLAN[claveUnidad(asig, u.id)];
    if(!p || !p.termino) return;
    const foto = fotoDeCierre(p.termino);
    if(foto) out.push({asig, uni:u.id, titulo:u.titulo, termino:p.termino, foto});
  }));
  return out;
}

/* Una unidad, o todas las cerradas si `sola` es null. La misma vista sirve para las dos:
   el informe de fin de año es este mismo informe con más de un bloque, y hacer dos
   pantallas para eso habría sido escribir dos veces lo mismo. */
async function verCierre(cursoCodigo, cursoNombre, sola){
  aviso('Cargando…','var(--dim)');
  try{
    const info = CURSO_INFO[cursoCodigo] || {};
    const asigs = (info.misAsig && info.misAsig.length ? info.misAsig
                  : NIV.deNivel(info.nivel||'')).filter(a => ASIG_NOMBRE[a]);
    const lista = sola ? [sola] : unidadesCerrables(asigs);
    if(!lista.length){ aviso('Todavía no hay unidades cerradas con una foto que las cubra.'); return; }
    await cargarTextosOA(asigs);

    // Una consulta por FOTO distinta, no por unidad: varias unidades suelen cerrar el
    // mismo domingo, y el caché evita pedir la misma foto cuatro veces.
    const semanas = [...new Set(lista.map(u => u.foto))];
    const fotos = {};
    await Promise.all(semanas.map(async s => { fotos[s] = await pedirFoto(cursoCodigo, s); }));
    // El mapa de hoy, para la columna de comparación. Su fallo no impide ver el informe:
    // sin él, las filas salen sin el "hoy", que es un extra y no el contenido.
    let mapaHoy = [];
    try{
      const r = await SB.rpc('kimun_prof_dominio',{p_curso_codigo:cursoCodigo});
      if(!r.error) mapaHoy = r.data||[];
    }catch(e){}

    const hoyFecha = new Date();
    const tit = sola ? 'Cómo quedó la unidad' : 'Unidades cerradas del año';
    $('lista').innerHTML = cabeceraAvance(tit, cursoNombre)
      + `<div class="solo-print pul-hoja">
           <b>${esc(tit)} · ${esc(cursoNombre)}</b>
           <div>VULPO · impreso el ${esc(fechaLarga(hoyFecha))}</div>
           <div>${esc(YO.nombre || YO.correo)}</div>
           <div>Cada unidad se muestra como estaba en la foto del domingo que la cierra,
                no como está hoy.</div>
         </div>`
      + lista.map(u => bloqueCierre(u.asig, u.uni, u.titulo, u.termino, u.foto,
                                    fotos[u.foto]||[], mapaHoy)).join('')
      + `<p class="pul-nota">${AVISO_NO_CALIFICA}
         <br>Los números son los de la foto semanal del domingo indicado, no los de hoy:
         por eso el módulo puede seguir abierto sin que el informe cambie.
         ${SEMANAS.length ? 'El historial de este curso empieza el '
           + esc(fechaCortita(SEMANAS[0].semana)) + '.' : ''}</p>`
      + `<div class="btn-fila no-print">
           <button class="btn sec" id="btnImprimirCierre">🖨️ Imprimir</button>
           <button class="btn txt" id="btnVolverPanel">← Volver</button>
         </div>`;
    // Igual que en el pulso: en el papel esta cabecera sobra porque .solo-print ya trae el
    // título, y sin esto sale dos veces.
    document.querySelector('.av-head').classList.add('no-print');
    $('btnVolverCab').onclick   = volverAlPanel;
    $('btnVolverPanel').onclick = volverAlPanel;
    $('btnImprimirCierre').onclick = () => window.print();
    irArriba(); aviso('');
  }catch(e){ aviso(errorPanel(e)); }
}

// Reparte a los alumnos del curso en cuatro grupos por su última entrada. La ventana es
// móvil (7 días hacia atrás), no "desde el lunes", para no depender de la zona horaria del
// servidor. "Nunca canjearon" se separa de "dejaron de jugar" porque la acción es distinta:
// volver a entregar el código, no insistirle al niño.
const PART_DIAS = 7;
function gruposParticipacion(filas){
  const g = {semana:[], viejo:[], sinJugar:[], sinCodigo:[]};
  const corte = Date.now() - PART_DIAS*24*60*60*1000;
  (filas||[]).forEach(f => {
    if(!f.vinculado){ g.sinCodigo.push(f); return; }
    if(!f.visto){ g.sinJugar.push(f); return; }
    (new Date(f.visto).getTime() >= corte ? g.semana : g.viejo).push(f);
  });
  return g;
}

// El bloque va plegado, con el titular en la línea visible: es el dato que hay que ver sin
// abrir nada. Se pinta primero con "Cargando…" y se rellena aparte, para no retrasar el mapa.
function bloqueParticipacionHTML(){
  return `<details id="partBloque" style="margin-bottom:12px;border:1px solid #ffffff22;
            border-radius:12px;padding:8px 10px">
    <summary style="cursor:pointer;list-style:none;color:var(--cyan);font-size:13px"
             id="partTitular">Participación · cargando…</summary>
    <div id="partCuerpo" style="padding-top:6px"></div>
  </details>`;
}

function pintarParticipacion(titular, cuerpo, filas){
  const g = gruposParticipacion(filas);
  const total = (filas||[]).length;
  titular.textContent =
    `Participación · ${g.semana.length} de ${total} jugaron esta semana`;
  cuerpo.innerHTML =
      grupoFichas('Jugaron esta semana', g.semana, 'var(--green)', false, '')
    + grupoFichas('Hace más de una semana', g.viejo, 'var(--gold)', false, '')
    + grupoFichas('Canjearon su código pero no han jugado', g.sinJugar, 'var(--dim)', true, '')
    + grupoFichas('Nunca canjearon su código', g.sinCodigo, 'var(--pink)', true,
        'Puede ser un código perdido o mal escrito, o que no tengan teléfono. La acción '
        + 'es volver a entregar el código. El dato lo reporta el teléfono: no es asistencia.')
    + (total ? '' : '<p style="color:var(--dim);font-size:12px">Este curso no tiene alumnos inscritos.</p>');
}

// Se lanza sin await desde verAvance: el mapa no la espera y su fallo no impide ver el
// avance. Si falla, el bloque lo dice y el mapa queda intacto.
//
// Los nodos se capturan ANTES del await: si el profesor cambia de curso mientras la
// consulta está en vuelo, verAvance repinta #lista con nodos nuevos (reusando los mismos
// ids) y estas referencias quedan huérfanas. Escribir en el nodo huérfano es inofensivo,
// en vez de pisar la participación del curso que ahora está a la vista. Mismo patrón
// defensivo que conectarFilasOA.
async function cargarParticipacion(cursoCodigo){
  const titular = $('partTitular'), cuerpo = $('partCuerpo');
  try{
    const {data,error} = await SB.rpc('kimun_prof_participacion',{p_curso_codigo:cursoCodigo});
    if(error) throw error;
    pintarParticipacion(titular, cuerpo, data);
  }catch(e){
    if(titular) titular.textContent = 'Participación · no se pudo cargar';
  }
}

/* ===== Planificación del año: fechas de inicio y término por unidad =====
   Nace de un problema concreto: en diciembre el mapa mezcla los objetivos que se pasaron
   en abril con los de la semana pasada, así que un 45% no dice si hay que actuar o si eso
   ya se reforzó hace ocho meses. Con las fechas declaradas, cada unidad se lee en su
   momento del año.

   La UTP carga la planificación a principio de año y el profesor de asignatura la AJUSTA
   con una justificación —el aula no calza con el papel—. Es el mismo acto, así que es una
   sola pantalla y una sola función; lo que cambia es el portero.

   ⚠️ El historial de cambios lo ve la UTP, por decisión de Roberto y sobre una advertencia
   escrita: es el registro de quién movió qué fecha y por qué, o sea material de evaluación
   docente. Está dicho en supabase/schema.sql, donde vive la tabla. */

let PLAN = {};        // 'HI08|U1' -> {inicio, termino, nota, fijada_por, cambios}
let PLAN_SUG = {};    // 'HI08|U1' -> {inicio, termino} propuesto desde las fotos semanales
let SEMANAS = [];     // las fotos que existen para este curso, en orden: [{semana,objetivos,alumnos}]
/* ⚠️ DE QUÉ CURSO es lo que hay en PLAN, y no es una comodidad: la ficha de un alumno
   también lo consulta, y a ella se llega desde cualquier curso. Sin esta marca, abrir un
   alumno de 3° después de haber mirado el avance de 8° le aplicaría las fechas de 8° y
   mandaría al historial las unidades equivocadas — el cruce de identidad que la Sesión 26
   ya pagó con la participación. Vale `null` mientras no haya plan cargado, y con eso el
   corte abiertas/cerradas simplemente no se aplica. */
let PLAN_CURSO = null;

const claveUnidad = (asig, uni) => asig + '|' + uni;

/* Trae la planificación de un curso a PLAN. Aparte de `cargarPlan` porque esta la necesitan
   DOS pantallas —el avance del curso y la ficha de un alumno— y la segunda no tiene bloque
   de planificación que pintar, ni sugerencias que pedir, ni fotos que listar: pedirle esas
   dos consultas de más sería pagarlas para nada. */
async function traerPlan(cursoCodigo){
  const {data, error} = await SB.rpc('kimun_prof_plan', {p_curso_codigo:cursoCodigo});
  if(error) throw error;
  fijarPlan(cursoCodigo, data);
  return data||[];
}

/* El ÚNICO lugar que escribe PLAN y PLAN_CURSO, y por eso existe: son dos variables que
   tienen que moverse juntas, y las llenan dos caminos distintos. Separadas, el día que
   alguien agregue un tercero se le olvida la marca del curso y el defecto es mudo. */
function fijarPlan(cursoCodigo, filas){
  PLAN = {};
  (filas||[]).forEach(f => { PLAN[claveUnidad(f.asignatura, f.unidad)] = f; });
  PLAN_CURSO = cursoCodigo;
}

/* ===== En qué punto del año está cada unidad =====
   Tres estados y no dos, porque "abierta" mezclaba dos cosas que piden acciones distintas:
   la unidad que el curso está pasando ESTA SEMANA y la que empieza en dos meses. En el 8°
   de prueba pasa hoy mismo — U3 corre del 20/07 al 25/09 y U4 arranca el 28/09—, así que
   sin separarlas el profesor ve juntos un objetivo urgente y uno que no ha visto nadie. */
/* ⚠️ Los iconos NO son puntos de color, y es deliberado: en este panel el verde, el ámbar
   y el rosa significan RENDIMIENTO, así que un 🟢 junto a una unidad se leería como "esta
   va bien" en vez de "se está pasando". La metáfora del libro no compite con nada: abierto
   lo que se está leyendo, guardado lo que ya se leyó. */
const ESTADO_UNIDAD = {
  clases:  {ico:'📖', txt:'En clases ahora'},
  futura:  {ico:'🕒', txt:'Todavía no empieza'},
  cerrada: {ico:'📚', txt:'Terminada'}
};

/* ⚠️ SIN FECHAS devuelve '' y no un estado inventado, y esa guarda decide el caso más
   común: la planificación es opcional y hoy casi ningún curso la tiene llena. Adivinar
   ahí llenaría la pantalla de marcas falsas. */
function estadoUnidad(asig, uid){
  const p = PLAN_CURSO ? PLAN[claveUnidad(asig, uid)] : null;
  if(!p || (!p.inicio && !p.termino)) return '';
  const hoy = new Date().toISOString().slice(0,10);
  if(p.termino && p.termino < hoy) return 'cerrada';
  if(p.inicio  && p.inicio  > hoy) return 'futura';
  return 'clases';               // empezó y no ha terminado, o solo tiene una de las dos
}

/* El estado de un OBJETIVO, que es el de su unidad.
   ⚠️ Un objetivo que vive en VARIAS unidades —los 9 de Lenguaje de 3°, uno en cuatro— toma
   el estado MÁS ACTIVO de todas: si alguna se está pasando es de esta semana, y si alguna
   está por venir todavía hay algo que hacer con él. Solo es historial cuando todas
   cerraron; mandarlo antes sería esconder trabajo pendiente. */
function estadoDeOA(oa){
  const u = OA_UNIDAD[oa]; if(!u) return '';
  const asig = String(oa).slice(0,4);
  const ids  = (u.ids && u.ids.size) ? Array.from(u.ids) : [u.id];
  const est  = ids.map(id => estadoUnidad(asig, id)).filter(Boolean);
  if(!est.length) return '';
  if(est.includes('clases')) return 'clases';
  if(est.includes('futura')) return 'futura';
  return 'cerrada';
}

const unidadCerrada = oa => estadoDeOA(oa) === 'cerrada';

// El sello de una unidad, para el encabezado de su grupo. Vacío si nadie le puso fechas.
function selloUnidad(asig, uid){
  const e = ESTADO_UNIDAD[estadoUnidad(asig, uid)];
  return e ? ` <span class="uni-sello uni-${estadoUnidad(asig, uid)}">${e.ico} ${
    esc(e.txt)}</span>` : '';
}

/* La foto que CIERRA una unidad: la primera tomada en la fecha de término o después.
   ⚠️ La PRIMERA POSTERIOR y no la anterior más cercana, y la diferencia importa: si la
   unidad terminó un martes, la foto del domingo anterior no incluye el lunes ni el martes,
   así que le faltaría el final de la unidad. La posterior la captura entera; el costo es
   incluir hasta seis días en que el curso ya está en otra unidad, y como el porcentaje es
   de primer intento —y esos objetivos ya se abrieron— ese ruido es mínimo.
   Devuelve null si no hay ninguna: la unidad terminó después de la última foto, o cerró
   antes de que existiera el historial. Las dos cosas se dicen, no se rellenan. */
function fotoDeCierre(termino){
  if(!termino || !SEMANAS.length) return null;
  const t = String(termino).slice(0,10);
  const f = SEMANAS.find(s => String(s.semana).slice(0,10) >= t);
  return f ? String(f.semana).slice(0,10) : null;
}

// "12 mar" · "12 mar 2025" si fue otro año. Corta a propósito: van dos por fila.
function fechaCortita(iso){
  if(!iso) return '';
  const M = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  // Se parte a mano y no con new Date(iso): un 'YYYY-MM-DD' se interpreta como UTC y en
  // Chile puede mostrar el día anterior. Es el mismo cuidado que la franja de tendencia.
  const p = String(iso).slice(0,10).split('-');
  if(p.length < 3) return '';
  const y = +p[0], m = +p[1] - 1, d = +p[2];
  return d + ' ' + (M[m]||'') + (y !== new Date().getFullYear() ? ' ' + y : '');
}

function bloquePlanHTML(){
  return `<details id="planBloque" style="margin-bottom:12px;border:1px solid #ffffff22;
            border-radius:12px;padding:8px 10px">
    <summary style="cursor:pointer;list-style:none;color:var(--cyan);font-size:13px"
             id="planTitular">Planificación del año · cargando…</summary>
    <div id="planCuerpo" style="padding-top:6px"></div>
  </details>`;
}

/* Se lanza sin await desde verAvance, como la tendencia y la participación: su fallo no
   impide ver el mapa. Y los nodos se capturan ANTES del await, para que la respuesta
   tardía de un curso no se escriba bajo el encabezado de otro (la carrera de la Sesión 26). */
async function cargarPlan(cursoCodigo){
  const titular = $('planTitular'), cuerpo = $('planCuerpo');
  const info = CURSO_INFO[cursoCodigo] || {};
  const asigs = (info.misAsig && info.misAsig.length ? info.misAsig
                : NIV.deNivel(info.nivel || '')).filter(a => ASIG_NOMBRE[a]);
  try{
    if(!asigs.length) throw new Error('sin_asignaturas');
    // Los oa.json de TODAS mis asignaturas, no solo las que ya tienen actividad: las
    // unidades que faltan por pasar son justo las que hay que planificar.
    await cargarTextosOA(asigs);
    const [plan, sug, sem] = await Promise.all([
      SB.rpc('kimun_prof_plan',        {p_curso_codigo:cursoCodigo}),
      SB.rpc('kimun_prof_plan_sugerir',{p_curso_codigo:cursoCodigo}),
      SB.rpc('kimun_prof_semanas',     {p_curso_codigo:cursoCodigo})
    ]);
    if(plan.error) throw plan.error;
    PLAN_SUG = {};
    // Las fotos disponibles. Su fallo no rompe nada: sin ellas no se ofrece el informe de
    // cierre, que es exactamente lo que corresponde cuando no hay historial que leer.
    SEMANAS = (sem.error ? [] : (sem.data||[]));
    fijarPlan(cursoCodigo, plan.data);
    /* La propuesta llega por OBJETIVO y se agrupa por unidad: la primera semana en que
       alguno empezó y la última en que alguno se movió.
       ⚠️ Solo hay fotos desde el 30/08/2026, así que de una unidad cerrada antes no hay
       nada que proponer. Su fallo no rompe la pantalla: se planifica a mano. */
    if(!sug.error) (sug.data||[]).forEach(f => {
      const u = OA_UNIDAD[f.oa]; if(!u) return;
      const k = claveUnidad(String(f.oa).slice(0,4), u.id);
      const s = PLAN_SUG[k] || (PLAN_SUG[k] = {inicio:null, termino:null});
      if(f.primera && (!s.inicio  || f.primera < s.inicio))  s.inicio  = f.primera;
      if(f.ultima  && (!s.termino || f.ultima  > s.termino)) s.termino = f.ultima;
    });
    pintarPlan(titular, cuerpo, cursoCodigo, asigs);
  }catch(e){
    if(titular) titular.textContent = 'Planificación del año · no se pudo cargar';
  }
}

function pintarPlan(titular, cuerpo, cursoCodigo, asigs){
  let total = 0, conFecha = 0, hayCierres = false;
  const secciones = asigs.map(asig => {
    const unis = UNIDADES[asig] || [];
    if(!unis.length) return '';
    return `<div class="oa-grupo">
      <div class="oa-grupo-tit">${esc(ASIG_NOMBRE[asig]||asig)}</div>
      ${unis.map(u => {
        total++;
        const k = claveUnidad(asig, u.id);
        const p = PLAN[k], s = PLAN_SUG[k];
        if(p && (p.inicio || p.termino)) conFecha++;
        const fechas = p && (p.inicio || p.termino)
          ? `<b>${esc(fechaCortita(p.inicio) || '?')} → ${esc(fechaCortita(p.termino) || '?')}</b>`
          : `<span style="color:var(--dim)">sin fechas</span>`;
        // La propuesta solo se ofrece si esa unidad no tiene fechas todavía: insistir con
        // una sugerencia sobre una fecha ya declarada sería discutirle al profesor.
        const sug = (!p || (!p.inicio && !p.termino)) && s && s.inicio
          ? `<button class="btn-chip plan-sug" data-k="${esc(k)}" data-asig="${esc(asig)}"
               data-uni="${esc(u.id)}" data-tit="${esc(u.titulo)}"
               data-ini="${esc(s.inicio)}" data-fin="${esc(s.termino||s.inicio)}"
               title="Fechas deducidas de cuándo el curso trabajó estos objetivos"
               >usar ${esc(fechaCortita(s.inicio))} → ${esc(fechaCortita(s.termino||s.inicio))}</button>`
          : '';
        const cambios = p && Number(p.cambios) > 1
          ? `<span class="plan-cambios">${p.cambios} cambios</span>` : '';
        /* El informe de cierre, solo donde de verdad hay algo que reconstruir: la unidad
           tiene fecha de término Y existe una foto de esa fecha en adelante. Sin las dos
           condiciones el botón prometería un informe vacío. */
        const foto = p && p.termino ? fotoDeCierre(p.termino) : null;
        if(foto) hayCierres = true;
        const cierre = foto
          ? `<button class="btn-chip plan-cierre" data-asig="${esc(asig)}" data-uni="${esc(u.id)}"
               data-tit="${esc(u.titulo)}" data-fin="${esc(p.termino)}" data-foto="${esc(foto)}"
               title="Cómo estaba el curso en esta unidad cuando la cerraste, reconstruido de la foto del ${esc(fechaCortita(foto))}"
               >📸 Cómo quedó</button>` : '';
        return `<div class="plan-fila" data-k="${esc(k)}">
          <div class="plan-nom">${esc(u.id)} · ${esc(u.titulo)}${
            selloUnidad(asig, u.id)}${cambios}</div>
          <div class="plan-fechas">${fechas}</div>
          <div class="plan-acc">${sug}${cierre}
            <button class="ico plan-edit" data-asig="${esc(asig)}" data-uni="${esc(u.id)}"
              data-tit="${esc(u.titulo)}" title="Fijar fechas" style="color:var(--gold)">✎</button>
          </div>
          ${p && p.nota ? `<div class="plan-nota">“${esc(p.nota)}”${
              p.fijada_por ? ' · ' + esc(p.fijada_por) : ''}</div>` : ''}
          <div class="plan-form" hidden></div>
        </div>`;
      }).join('')}
    </div>`;
  }).join('');

  titular.textContent = `Planificación del año · ${conFecha} de ${total} unidades con fechas`;
  cuerpo.innerHTML = secciones + `
    <p style="color:var(--dim);font-size:11px;line-height:1.5;margin:10px 0 0;max-width:70ch">
      Con las fechas puestas, el avance de cada unidad se lee en su momento del año: en
      diciembre, un 45% de abril y uno de esta semana piden cosas muy distintas.
      ${PLAN_SUG && Object.keys(PLAN_SUG).length ? '' :
        'Todavía no hay fotos semanales para proponer fechas: se toman cada domingo, así que la propuesta aparece desde la semana que viene. '}
      Los niños pueden seguir jugando: la foto de cierre se reconstruye de las fotos
      semanales, no del estado de hoy.
      ${SEMANAS.length ? 'El historial empieza el ' + esc(fechaCortita(SEMANAS[0].semana))
        + ': de una unidad cerrada antes no se puede reconstruir nada.' : ''}
    </p>
    ${hayCierres ? `<button class="btn-chip principal" id="btnCierreAnio"
        style="margin-top:8px">📅 Informe de las unidades cerradas</button>` : ''}
    ${window.ESADMINCOLEGIO ? `<button class="btn-chip" id="btnPlanHist"
        style="margin-top:8px">Ver los cambios de fechas</button>
      <div id="planHist"></div>` : ''}`;
  conectarPlan(cursoCodigo, titular, cuerpo, asigs);
}

function conectarPlan(cursoCodigo, titular, cuerpo, asigs){
  // Aceptar la propuesta: un clic, sin escribir dos fechas.
  cuerpo.querySelectorAll('.plan-sug').forEach(b => b.onclick = () =>
    guardarPlan(cursoCodigo, b.dataset.asig, b.dataset.uni, b.dataset.tit,
                b.dataset.ini, b.dataset.fin, '', titular, cuerpo, asigs));

  // El informe de cierre. El nombre del curso sale de CURSO_INFO y no de la pantalla:
  // esta vista reemplaza #lista, así que la cabecera de la que se podría leer ya no
  // existe cuando se pinta.
  const nomCurso = (CURSO_INFO[cursoCodigo]||{}).nombre || cursoCodigo;
  cuerpo.querySelectorAll('.plan-cierre').forEach(b => b.onclick = () =>
    verCierre(cursoCodigo, nomCurso, {asig:b.dataset.asig, uni:b.dataset.uni,
      titulo:b.dataset.tit, termino:b.dataset.fin, foto:b.dataset.foto}));
  const btnAnio = cuerpo.querySelector('#btnCierreAnio');
  if(btnAnio) btnAnio.onclick = () => verCierre(cursoCodigo, nomCurso, null);

  cuerpo.querySelectorAll('.plan-edit').forEach(b => b.onclick = () => {
    const fila = b.closest('.plan-fila');
    const caja = fila.querySelector('.plan-form');
    if(!caja.hidden){ caja.hidden = true; caja.innerHTML = ''; return; }
    const p = PLAN[fila.dataset.k] || {};
    caja.hidden = false;
    caja.innerHTML = `
      <label class="campo">Empieza <input type="date" class="plan-ini" value="${esc(p.inicio||'')}"></label>
      <label class="campo">Termina <input type="date" class="plan-fin" value="${esc(p.termino||'')}"></label>
      <label class="campo">Por qué (si cambias una fecha que puso otra persona)
        <input type="text" class="plan-nota-in" maxlength="200"
          placeholder="Ej.: se corrió dos semanas por el paro" value=""></label>
      <div class="btn-fila">
        <button class="btn sec plan-guardar">Guardar</button>
        ${p.inicio||p.termino ? `<button class="btn txt plan-quitar">Quitar fechas</button>` : ''}
      </div>`;
    caja.querySelector('.plan-guardar').onclick = () => guardarPlan(cursoCodigo,
      b.dataset.asig, b.dataset.uni, b.dataset.tit,
      caja.querySelector('.plan-ini').value, caja.querySelector('.plan-fin').value,
      caja.querySelector('.plan-nota-in').value, titular, cuerpo, asigs);
    const q = caja.querySelector('.plan-quitar');
    if(q) q.onclick = async () => {
      if(!confirm('¿Quitar las fechas de esta unidad?')) return;
      try{
        const {error} = await SB.rpc('kimun_prof_plan_quitar', {p_curso_codigo:cursoCodigo,
          p_asignatura:b.dataset.asig, p_unidad:b.dataset.uni});
        if(error) throw error;
        await cargarPlan(cursoCodigo);
      }catch(e){ aviso(errorPlan(e)); }
    };
  });

  const bh = document.getElementById('btnPlanHist');
  if(bh) bh.onclick = () => cargarPlanHistorial(cursoCodigo);
}

// Los errores de esta pantalla se dicen con sus palabras: "no se pudo completar la acción"
// no le enseña a nadie que la justificación es obligatoria.
function errorPlan(e){
  const m = String((e && (e.message||e.error_description)) || '');
  if(m.indexOf('falta_justificacion') >= 0)
    return 'Esta unidad ya tenía fechas puestas por otra persona: escribe por qué la mueves.';
  if(m.indexOf('fechas_invertidas') >= 0) return 'La fecha de término es anterior a la de inicio.';
  if(m.indexOf('asignatura_ajena') >= 0)  return 'Solo puedes planificar tus asignaturas.';
  return errorPanel(e);
}

async function guardarPlan(cursoCodigo, asig, uni, tit, ini, fin, nota, titular, cuerpo, asigs){
  try{
    const {error} = await SB.rpc('kimun_prof_plan_fijar', {
      p_curso_codigo:cursoCodigo, p_asignatura:asig, p_unidad:uni, p_titulo:tit,
      p_inicio: ini || null, p_termino: fin || null, p_nota: nota || null});
    if(error) throw error;
    aviso('Fechas guardadas', 'var(--green)');
    await cargarPlan(cursoCodigo);
  }catch(e){ aviso(errorPlan(e)); }
}

async function cargarPlanHistorial(cursoCodigo){
  const caja = document.getElementById('planHist');
  if(!caja) return;
  caja.innerHTML = '<p style="color:var(--dim);font-size:12px">Cargando…</p>';
  try{
    const {data,error} = await SB.rpc('kimun_prof_plan_historial', {p_curso_codigo:cursoCodigo});
    if(error) throw error;
    if(!data || !data.length){
      caja.innerHTML = '<p style="color:var(--dim);font-size:12px">Todavía no se ha movido ninguna fecha.</p>';
      return;
    }
    caja.innerHTML = data.map(l => `<div class="plan-log">
      <b>${esc(ASIG_NOMBRE[l.asignatura]||l.asignatura)} · ${esc(l.unidad)}</b>
      ${esc(fechaCortita(l.inicio_ant))||'—'} → ${esc(fechaCortita(l.termino_ant))||'—'}
      <span style="color:var(--dim)">pasa a</span>
      ${esc(fechaCortita(l.inicio))||'—'} → ${esc(fechaCortita(l.termino))||'—'}
      <div class="plan-log-pie">${esc(l.quien||'—')} · ${esc(fechaCortita(l.creado))}${
        l.nota ? ' · “' + esc(l.nota) + '”' : ''}</div>
    </div>`).join('');
  }catch(e){ caja.innerHTML = '<p style="color:var(--dim);font-size:12px">'+esc(errorPlan(e))+'</p>'; }
}

/* ===== Tendencia semanal (bloque en la vista de avance) =====
   Lee las fotos que kimun_foto_semanal viene tomando cada domingo desde la Sesión 36 y
   que NINGUNA pantalla había leído nunca. Responde lo que el acumulado del año no
   contesta: cómo le fue al curso ESTA semana.

   ⚠️ Lo que se grafica es el ACIERTO DE LA SEMANA, o sea la diferencia entre dos fotos:
   (correctas_N − correctas_N−1) / (respondidas_N − respondidas_N−1). NO es el porcentaje
   del mapa, que es de primer intento y queda congelado a propósito (Sesión 24): en dos
   semanas seguidas da casi el mismo número, así que graficarlo se vería roto sin estarlo. */

// Bajo este número de respuestas nuevas, el porcentaje de la semana es ruido: se muestra
// igual —esconderlo sería peor— pero atenuado, para que nadie tome una decisión sobre él.
const TEND_MIN_RESP = 10;

// Los acumulados de cada foto se convierten en lo que pasó esa semana. La primera no
// tiene contra qué compararse, y una semana con delta negativo tampoco: eso ocurre de
// verdad cuando el profesor usa "Reiniciar mediciones", que está en esta misma pantalla.
function semanasTendencia(filas){
  const f = (filas||[]).slice().sort((a,b)=> String(a.semana) < String(b.semana) ? -1 : 1);
  const n = x => Number(x)||0;
  return f.map((r,i) => {
    const p = i>0 ? f[i-1] : null;
    const dResp = p ? n(r.respondidas)-n(p.respondidas) : null;
    const dOk   = p ? n(r.correctas)  -n(p.correctas)   : null;
    return {
      semana:r.semana, enCurso:!!r.en_curso,
      resp:dResp, ok:dOk,
      obj: p ? n(r.objetivos)-n(p.objetivos) : null,
      xp:  p ? n(r.xp)       -n(p.xp)        : null,
      pct: (dResp!=null && dResp>0) ? Math.round(dOk*100/dResp) : null,
      firme: (dResp||0) >= TEND_MIN_RESP
    };
  });
}

// La fecha llega como 'AAAA-MM-DD'. Se parte a mano en vez de con Date: new Date de una
// fecha sin hora se interpreta en UTC, y en Chile eso muestra el día anterior.
function fechaCorta(s){
  const p = String(s).split('-');
  return p.length===3 ? p[2]+'/'+p[1] : String(s);
}

function pintarTendencia(titular, cuerpo, filas){
  if(!titular || !cuerpo) return;
  const sem = semanasTendencia(filas);
  // ⚠️ El corte es por CUÁNTAS FOTOS hay, no por si alguna es comparable. Son dos cosas
  // distintas y confundirlas produce un mensaje falso: un curso con dos fotos donde nadie
  // jugó, o donde el profesor acaba de usar "Reiniciar mediciones" —el botón está en esta
  // misma pantalla—, leía "todavía sin comparación", o sea que le faltaba historia al
  // sistema cuando lo que pasaba era otra cosa.
  if(sem.length < 2){
    titular.textContent = 'Tendencia · todavía sin comparación';
    cuerpo.innerHTML = `<p style="color:var(--dim);font-size:12px;margin:4px 0">
      VULPO guarda una foto del curso cada domingo, y con dos fotos ya puede decir cómo le
      fue al curso en la semana. Por ahora hay ${sem.length===1?'una sola':'ninguna'}.</p>`;
    return;
  }
  const ultima = sem[sem.length-1];
  const anteriores = sem.filter(s => s !== ultima && s.pct != null);
  const previa = anteriores.length ? anteriores[anteriores.length-1] : null;
  const cuando = ultima.enCurso ? 'Esta semana' : 'Última semana';
  titular.textContent =
      ultima.pct != null
        ? `${cuando} · ${ultima.resp} respuesta${ultima.resp===1?'':'s'} · ${ultima.pct}% de acierto`
          + (previa ? ` (antes ${previa.pct}%)` : '')
          // Un 100% sobre cuatro respuestas no es un 100%: se dice en el titular, que es
          // lo único que se lee sin desplegar el bloque.
          + (ultima.firme ? '' : ' · muy pocas para concluir')
      : ultima.resp < 0 ? `${cuando} · se reiniciaron las mediciones`
      :                   `${cuando} · nadie ha respondido todavía`;

  const color = s => s.pct==null ? 'var(--dim)'
    : s.pct>=70 ? 'var(--green)' : s.pct>=45 ? 'var(--gold)' : 'var(--pink)';
  const nota = s => s.pct!=null
    ? `${s.resp} respuesta${s.resp===1?'':'s'}`
      + (s.obj>0 ? ` · ${s.obj} objetivo${s.obj===1?'':'s'} nuevo${s.obj===1?'':'s'}` : '')
      + (s.xp>0  ? ` · +${s.xp} XP` : '')
      + (s.firme ? '' : ' · muy pocas respuestas para sacar conclusiones')
    : s.resp==null ? 'Primera foto: no hay una semana anterior con que compararla'
    : s.resp<0     ? 'Las mediciones se reiniciaron, así que esta semana no es comparable'
    :                'Sin respuestas nuevas en esta semana';

  cuerpo.innerHTML = `<div class="tend-franja">${sem.map(s=>`
      <div class="tend-sem${s.enCurso?' ahora':''}${s.pct!=null&&!s.firme?' tend-vacio':''}"
           title="${esc(nota(s))}">
        <div class="tend-barra"><i style="height:${s.pct==null?0:Math.max(3,Math.round(s.pct*0.64))}px;
             background:${color(s)}"></i></div>
        <div class="tend-pct" style="color:${color(s)}">${s.pct==null?'—':s.pct+'%'}</div>
        <div class="tend-fecha">${s.enCurso?'en curso':esc(fechaCorta(s.semana))}</div>
      </div>`).join('')}</div>
    <p style="font-size:12px;margin:2px 0 0"><b>${esc(cuando)}:</b> ${esc(nota(ultima))}</p>
    <p style="color:var(--dim);font-size:12px;margin:4px 0 0">
      Acierto de <b>lo respondido en esa semana</b>, no del año acumulado. Es distinto del
      porcentaje del mapa de abajo, que mide el <b>primer intento</b> y no se mueve al
      repasar.</p>`;
  // La franja arranca en la semana más antigua, así que en un teléfono lo ÚLTIMO —que es
  // justo lo que se viene a ver— queda fuera de la pantalla hasta que alguien la arrastre.
  const franja = cuerpo.querySelector('.tend-franja');
  if(franja) franja.scrollLeft = franja.scrollWidth;
}

// Se lanza sin await desde verAvance, igual que la participación: el mapa no la espera y
// su fallo no impide ver el avance. Los nodos se capturan ANTES del await, para que la
// respuesta lenta de un curso no se escriba bajo el encabezado de otro (Sesión 26).
async function cargarTendencia(cursoCodigo){
  const titular = $('tendTitular'), cuerpo = $('tendCuerpo');
  try{
    const {data,error} = await SB.rpc('kimun_prof_tendencia',{p_curso_codigo:cursoCodigo});
    if(error) throw error;
    pintarTendencia(titular, cuerpo, data);
  }catch(e){
    if(titular) titular.textContent = 'Tendencia · no se pudo cargar';
  }
}

function bloqueTendenciaHTML(){
  return `<details id="tendBloque" open style="margin-bottom:12px;border:1px solid #ffffff22;
            border-radius:12px;padding:8px 10px">
    <summary style="cursor:pointer;list-style:none;color:var(--cyan);font-size:13px"
             id="tendTitular">Esta semana · cargando…</summary>
    <div id="tendCuerpo" style="padding-top:6px"></div>
  </details>`;
}

/* Titular de participación y franja de atención: los dos salen de UNA consulta.
   Antes era una llamada de participación POR CURSO —con seis cursos, seis—, y la franja
   habría sumado otras seis. `kimun_prof_resumen()` las devuelve todas juntas.

   ⚠️ Si la función no está aplicada, esto degrada al camino viejo en vez de dejar la
   lista muda: el panel tiene que seguir sirviendo con el esquema atrasado, que es
   doctrina del proyecto desde que un `drop function` dejó producción rota unos minutos. */
async function cargarResumen(codigos){
  try{
    const {data,error} = await SB.rpc('kimun_prof_resumen');
    if(error) throw error;
    const filas = data||[];
    filas.forEach(f => pintarTitularCurso(f));
    pintarFranja(filas);
  }catch(e){
    cargarTitularesParticipacion(codigos);   // respaldo: el titular sin contexto
    const fr = $('franjaAtencion'); if(fr) fr.innerHTML = '';
  }
}

/* El titular de la tarjeta del curso. Antes decía "15/22 jugaron esta semana" y NO decía
   si eso está bien o mal, que era justo lo que le faltaba: en marzo, con el curso recién
   inscrito, 15 de 22 no significa lo mismo que en agosto.
   Ahora lleva el porcentaje y la comparación con la semana pasada.
   ⚠️ Los dos números salen de fuentes distintas —la semana en curso de `visto`, la
   anterior del delta de XP entre dos fotos— porque la semana en curso todavía no tiene
   foto. Se dice en el `title` en vez de esconderlo. Y el primero NO se cambia: tiene que
   seguir siendo el mismo número que el pulso del colegio y que el bloque de
   participación, o el panel se contradice a sí mismo. */
function pintarTitularCurso(f){
  const nodo = document.querySelector('.cur-part[data-cod="'+CSS.escape(f.curso_codigo)+'"]');
  if(!nodo) return;
  const tot = Number(f.inscritos)||0, hoy = Number(f.jugaron_semana)||0;
  if(!tot){ nodo.textContent = 'Sin alumnos inscritos'; return; }
  const pct = Math.round(100*hoy/tot);
  let flecha = '', ayuda = 'De los ' + tot + ' alumnos inscritos, ' + hoy
    + ' abrieron el juego en los últimos 7 días.';
  if(f.hay_previa){
    const ant = Number(f.jugaron_previa)||0;
    flecha = hoy > ant ? ' ↑' : (hoy < ant ? ' ↓' : ' →');
    ayuda += ' La semana pasada jugaron ' + ant + '. Este número sale de la última vez que '
           + 'cada alumno abrió el juego; el de la semana pasada, de las fotos del domingo.';
  }else{
    ayuda += ' Todavía no hay una semana anterior con la que comparar.';
  }
  nodo.textContent = `Participación · ${hoy} de ${tot} esta semana · ${pct}%${flecha}`;
  nodo.title = ayuda;
  nodo.classList.toggle('part-baja', pct < 50);
}

/* La franja de "qué necesita tu atención", arriba de todo. El panel abría en una lista de
   cursos plegados: correcta, ordenada y muda — para enterarse de algo había que abrir un
   curso, entrar a Ver avance y leer. Esto es la diferencia entre una base de datos y una
   herramienta.

   ⚠️ NINGUNA línea nombra a un alumno. Son conteos, y al tocarlos se abre el curso, donde
   los nombres ya se muestran con el cuidado que corresponde (alfabéticos, sin fecha
   individual, sin orden por inactividad). La restricción vive además en la firma de
   `kimun_prof_resumen`, que no devuelve un solo nombre.

   ⚠️ Cuando no hay nada que atender, la franja LO DICE en vez de desaparecer: una franja
   que unos días está y otros no hace dudar de si cargó. */
const FRANJA_MAX = 4;
function pintarFranja(filas){
  const cont = $('franjaAtencion');
  if(!cont) return;
  /* ⚠️ UNA LÍNEA POR CURSO, no una por hallazgo. La primera versión ponía cada cosa en su
     renglón y con seis cursos salieron NUEVE líneas de dos renglones: 830 px en un
     teléfono de 780, o sea que el primer curso quedaba a 1.300 px de scroll. Se pidió ver
     mejor y la franja tapaba justo lo que había que ver. Se vio MIRANDO la captura; el
     conteo decía "sin desborde, cero errores".
     Y las tres cosas de un curso se resuelven en la MISMA pantalla —el mapa, la
     participación y el refuerzo viven los tres en Ver avance—, así que agruparlas no
     pierde ninguna acción. */
  const cursos = [];
  (filas||[]).forEach(f => {
    const tot = Number(f.inscritos)||0, hoy = Number(f.jugaron_semana)||0;
    const fuera = tot ? tot - hoy : 0;
    const bajos = Number(f.oa_bajos)||0, refu = Number(f.refuerzos)||0;
    if(!fuera && !bajos && !refu && !f.sin_jefe) return;
    const partes = [];
    if(fuera) partes.push(fuera + (fuera===1 ? ' sin entrar' : ' sin entrar'));
    if(bajos) partes.push(bajos + (bajos===1 ? ' objetivo bajo 70%' : ' objetivos bajo 70%'));
    if(refu)  partes.push(refu  + (refu===1  ? ' refuerzo abierto' : ' refuerzos abiertos'));
    if(f.sin_jefe) partes.push('sin profesor jefe');
    cursos.push({cod:f.curso_codigo, nom:f.curso, partes, sinJefe:!!f.sin_jefe,
      // Proporción y no número absoluto: 20 de 20 es un curso detenido y 5 de 22 es una
      // semana normal, y en números crudos el segundo puede parecer peor.
      urgencia: tot ? fuera/tot : 0});
  });
  if(!cursos.length){
    cont.innerHTML = '<div class="franja franja-ok">✅ Nada pendiente: todos entraron esta '
      + 'semana y no hay objetivos bajo 70% con datos suficientes.</div>';
    return;
  }
  /* Orden: primero lo que falta CONFIGURAR (un curso sin jefe no es un curso que va mal,
     es uno que no está listo), después por proporción de alumnos que no entraron. */
  cursos.sort((a,b) => (b.sinJefe?1:0) - (a.sinJefe?1:0) || b.urgencia - a.urgencia);
  const ver = cursos.slice(0, FRANJA_MAX), resto = cursos.length - ver.length;
  cont.innerHTML = '<div class="franja"><div class="franja-tit">Necesita tu atención</div>'
    + ver.map(c => '<button type="button" class="franja-li" data-cod="'+esc(c.cod)+'"'
        + ' data-nom="'+esc(c.nom)+'">'
        + '<span class="franja-ico">'+(c.sinJefe?'⚠️':'👥')+'</span>'
        + '<span><b>'+esc(c.nom)+'</b> · '+esc(c.partes.join(' · '))+'</span>'
        + '<span class="franja-ver">ver ›</span></button>').join('')
    + (resto ? '<div class="franja-resto">y '+resto+(resto===1?' curso más':' cursos más')
        +' con algo pendiente, más abajo.</div>' : '')
    + '</div>';
  /* Todas llevan a Ver avance, que es donde viven las tres cosas. Salvo el curso sin jefe:
     eso se arregla en su tarjeta, en "Equipo del curso". */
  cont.querySelectorAll('.franja-li').forEach(b => b.onclick = () => {
    const cod = b.dataset.cod, info = CURSO_INFO[cod]||{};
    const c = cursos.find(x => x.cod === cod);
    if(c && c.sinJefe){
      const det = document.querySelector('details.curso[data-cod="'+CSS.escape(cod)+'"]');
      if(det){ det.open = true; det.scrollIntoView({behavior:'smooth', block:'center'}); }
      return;
    }
    verAvance(cod, b.dataset.nom, !!info.gestiono);
  });
}

// Titular de participación en la cabecera plegada de cada curso. Una consulta por curso,
// asíncrona, para no retrasar el render de la lista. El nodo se captura ANTES del await
// (mismo patrón defensivo que cargarParticipacion): si la lista se repinta mientras una
// consulta está en vuelo, la referencia vieja queda huérfana en vez de escribir el titular
// de un curso bajo la cabecera de otro.
//
// Queda como RESPALDO de cargarResumen, para cuando el esquema todavía no trae
// kimun_prof_resumen. Da el número sin el contexto, que es mejor que no dar nada.
function cargarTitularesParticipacion(codigos){
  (codigos||[]).forEach(async cod => {
    const nodo = document.querySelector('.cur-part[data-cod="'+CSS.escape(cod)+'"]');
    if(!nodo) return;
    try{
      const {data,error} = await SB.rpc('kimun_prof_participacion',{p_curso_codigo:cod});
      if(error) throw error;
      const g = gruposParticipacion(data);
      const total = (data||[]).length;
      nodo.textContent = `Participación · ${g.semana.length}/${total} jugaron esta semana`;
    }catch(e){
      nodo.textContent = 'Participación no disponible';
    }
  });
}

// Quién está a cargo de cada curso, en su encabezado. Sale de kimun_prof_equipo, que
// solo responde a Admin/Super/Jefe: a un profe de asignatura le da no_autorizado y la
// línea queda vacía, que es lo correcto (no es información suya).
// Un curso recién creado NACE SIN JEFE (desde la Sesión 38 el creador ya no se auto-nombra),
// así que decirlo en el encabezado es justo lo que hay que ver para acordarse de asignarlo.
function cargarJefes(codigos){
  (codigos||[]).forEach(async cod => {
    // El nodo se captura ANTES del await: si no, la respuesta lenta de un curso podría
    // escribirse bajo el encabezado de otro (la carrera de la Sesión 26).
    const nodo = document.querySelector('.cur-jefe[data-cod="'+CSS.escape(cod)+'"]');
    if(!nodo) return;
    try{
      const {data,error} = await SB.rpc('kimun_prof_equipo',{p_curso_codigo:cod});
      if(error) throw error;
      const equipo = data||[];
      const jefe = equipo.find(m => m.rol==='jefe');
      const otros = equipo.filter(m => m.rol!=='jefe').length;
      const cola = otros ? ` · ${otros} de asignatura` : '';
      if(jefe){
        nodo.classList.remove('sin');
        nodo.textContent = `👤 Profesor jefe: ${jefe.nombre || jefe.correo}${cola}`;
      }else{
        nodo.classList.add('sin');
        nodo.textContent = `⚠️ Sin profesor jefe${cola}`;
      }
    }catch(e){
      nodo.textContent = '';   // sin permiso para verlo: mejor nada que un error
    }
  });
}

// Cablea los chips. El filtro elegido se devuelve por callback, porque cada vista
// repinta cosas distintas.
function conectarFiltros(alCambiar){
  document.querySelectorAll('#lista .av-chip').forEach(chip => chip.onclick = () => {
    document.querySelectorAll('#lista .av-chip')
      .forEach(o => o.classList.toggle('on', o === chip));
    alCambiar(chip.dataset.asig || '');
    // La tabla nueva es más corta que la anterior: el punto donde estaba el profesor
    // ya no existe, así que se vuelve al principio en vez de dejarlo en el vacío.
    irArriba();
  });
}

// Los chips de agrupación. Aparte de conectarFiltros porque el filtro repinta y este
// también, pero responden a preguntas distintas: cuál miro / cómo lo ordeno.
function conectarAgrupar(alCambiar){
  const caja = document.getElementById('avAgrupar');
  if(!caja) return;                       // con una sola asignatura no se dibuja
  caja.querySelectorAll('.av-chip').forEach(chip => chip.onclick = () => {
    caja.querySelectorAll('.av-chip').forEach(o => o.classList.toggle('on', o === chip));
    // Pasa el VALOR ('', 'unidad' o 'asig'), no un booleano: desde que hay tres formas de
    // agrupar, un true/false no alcanza para decir cuál.
    alCambiar(chip.dataset.agr || '');
    irArriba();
  });
}

// Carga perezosa: cada objetivo pide sus alumnos la primera vez que se abre. Con 50
// objetivos, pedirlos por adelantado serían 50 llamadas para algo que casi nunca se mira
// entero. Se vuelve a cablear cada vez que el filtro repinta el cuerpo.
function conectarFilasOA(cursoCodigo){
  document.querySelectorAll('#avCuerpo .oa-fila').forEach(det => det.addEventListener('toggle', async () => {
    if(!det.open || det.dataset.cargado) return;
    det.dataset.cargado = '1';
    const caja = det.querySelector('.oa-detalle');
    // Se limpia el mensaje del intento anterior: si no, al reabrir tras un fallo el
    // profesor sigue leyendo el error viejo mientras la consulta ya va en camino.
    caja.textContent = 'Cargando…';
    try{
      const {data,error} = await SB.rpc('kimun_prof_dominio_oa',
        {p_curso_codigo:cursoCodigo, p_oa:det.dataset.oa});
      if(error) throw error;
      caja.innerHTML = detalleApoyo(data);
    }catch(e){
      det.dataset.cargado = '';          // permite reintentar cerrando y abriendo
      caja.textContent = esNoAutorizado(e)
        ? 'No tienes permiso para esto, o el curso ya no existe.'
        : 'No se pudo cargar. Cierra y vuelve a abrir.';
    }
  }));
}

/* ===== Desafío de refuerzo (bloque en la vista de avance) ===== */

// Objetivos flojos de una asignatura: primer intento < 70% con evidencia (>=4 alumnos de
// primer intento), peores primero, tope 5. `filas` viene de kimun_prof_dominio. La
// asignatura llega como CÓDIGO de 4 letras (HI08…), la clave canónica del sistema.
function objetivosFlojos(filas, asigCodigo){
  return (filas||[])
    .filter(f => asigCodigo && String(f.oa).slice(0,4) === asigCodigo
                 && f.resp_1 > 0 && f.alumnos_1 >= 4
                 && (f.ok_1 / f.resp_1) < 0.70)
    .sort((a,b) => (a.ok_1/a.resp_1) - (b.ok_1/b.resp_1))
    .slice(0,5);
}

// Bloque "Refuerzo" bajo el mapa: muestra el desafío activo (seguimiento) o, si no hay, la
// sugerencia por asignatura con botón de lanzar. Se cablea aparte para poder repintarse tras
// lanzar/cerrar sin salir de la vista de avance (no usa `accion`, que vuelve al panel).
async function cargarRefuerzo(cursoCodigo, filasDominio){
  const cont = document.getElementById('refuerzoBloque');
  if(!cont) return;
  let est=null;
  try{ const {data}=await SB.rpc('kimun_prof_refuerzo_estado',{p_curso_codigo:cursoCodigo});
       est=(data&&data[0])||null; }catch(e){ est=null; }
  if(est){
    const acierto = est.total>0 ? Math.round(est.correctas/est.total*100) : 0;
    const pi = est.pi_resp>0 ? Math.round(est.pi_ok/est.pi_resp*100) : 0;
    cont.innerHTML = `
      <h3 style="color:var(--gold);font-size:15px;margin:0 0 8px">📣 Refuerzo de ${esc(ASIG_NOMBRE[est.asignatura]||est.asignatura)} · activo</h3>
      <p style="font-size:13px;margin:0 0 8px">Lo completaron <b>${est.completaron}/${est.inscritos}</b> ·
        acierto del curso <b>${acierto}%</b> (primer intento era <b>${pi}%</b>).</p>
      <button class="btn sec" id="refCerrar">Cerrar desafío</button>`;
    document.getElementById('refCerrar').onclick=async ()=>{
      if(!confirm('¿Cerrar el desafío de refuerzo? Dejará de aparecerles a los alumnos.')) return;
      try{ const {error}=await SB.rpc('kimun_prof_refuerzo_cerrar',{p_curso_codigo:cursoCodigo});
           if(error) throw error; aviso('Desafío cerrado','var(--green)'); }
      catch(e){ aviso(errorPanel(e)); }
      cargarRefuerzo(cursoCodigo, filasDominio);
    };
    return;
  }
  // Por su código canónico. Se lee del catálogo para no repetir la lista: cuando faltaba
  // Matemática aquí, no se podía lanzar su refuerzo y nadie lo notó (bug de la Sesión 37).
  const ASIGS = ASIG_ORDEN.map(c=>[c, ASIG_NOMBRE[c]||c]);
  const bloques=ASIGS.map(([cod,nom])=>{
    const objs=objetivosFlojos(filasDominio,cod);
    if(!objs.length) return '';
    const lista=objs.map(o=>{
      const pct=Math.round(o.ok_1/o.resp_1*100);
      return `<li style="font-size:12px;color:var(--dim)">${esc(OA_TEXTO[o.oa]||o.oa)} · ${pct}%</li>`;
    }).join('');
    return `<div style="margin-bottom:12px">
      <p style="font-size:13px;margin:0 0 4px"><b>${nom}</b> · ${objs.length} objetivo${objs.length===1?'':'s'} para reforzar</p>
      <ul style="margin:0 0 6px 16px;padding:0">${lista}</ul>
      <button class="btn-chip refLanzar" data-asig="${cod}" data-nom="${esc(nom)}"
        data-oas="${esc(objs.map(o=>o.oa).join('|'))}"
        >📣 Lanzar desafío de refuerzo de ${esc(nom)}</button></div>`;
  }).filter(Boolean).join('');
  cont.innerHTML = bloques
    ? `<h3 style="color:var(--gold);font-size:15px;margin:0 0 8px">Refuerzo sugerido</h3>${bloques}`
    : '<p style="color:var(--dim);font-size:12px">No hay objetivos bajo el umbral para reforzar por ahora.</p>';
  cont.querySelectorAll('.refLanzar').forEach(b=>b.onclick=async ()=>{
    const oas=b.dataset.oas.split('|');
    if(!confirm(`¿Lanzar el desafío de refuerzo de ${b.dataset.nom}?\n\nLes aparecerá a todos los alumnos del curso.`)) return;
    try{ const {error}=await SB.rpc('kimun_prof_refuerzo_lanzar',
      {p_curso_codigo:cursoCodigo,p_asignatura:b.dataset.asig,p_objetivos:oas});  // p_asignatura = código
      if(error) throw error; aviso('Desafío lanzado','var(--green)'); }
    catch(e){ aviso(errorPanel(e)); }
    cargarRefuerzo(cursoCodigo, filasDominio);
  });
}

/* ===== Ranking por asignatura (bloque en la vista de avance) ===== */
// Un ranking por cada asignatura presente en el mapa del curso. La asignatura se
// deduce del mapa que ya tenemos (data de kimun_prof_dominio), que el servidor ya
// filtró a las mías: si no aparece HI08 en el mapa, no pido su ranking.
async function cargarRankingAsignatura(cursoCodigo, filasDominio){
  const cont=document.getElementById('rankingBloque');
  if(!cont) return;
  // Asignaturas presentes en el mapa (código de 4 letras), en el orden fijo.
  const presentes = ASIG_ORDEN.filter(a =>
    (filasDominio||[]).some(f => String(f.oa).slice(0,4) === a
                                 || SB_asigDe(f.oa) === a));
  if(!presentes.length){ cont.innerHTML=''; return; }
  /* La pestaña "General" solo aparece con MÁS DE UNA asignatura a la vista, o sea para el
     Profesor Jefe y el SuperUsuario. A un profe de asignatura sería su propia pestaña
     repetida con otro nombre, y ya vio ese número. */
  const hayGeneral = presentes.length > 1;
  cont.innerHTML = `<h3 style="color:var(--cyan);font-size:15px;margin:0 0 8px">Ranking del curso</h3>
    <p style="color:var(--dim);font-size:12px;margin:0 0 8px">Acierto de primer intento. Necesita al menos 20 respuestas para contar; el resto queda en “aún sin datos suficientes”.</p>
    <div id="rankAsigTabs" class="av-filtros"></div>
    <div id="rankAsigCuerpo"></div>`;
  const tabs=document.getElementById('rankAsigTabs');
  tabs.innerHTML=(hayGeneral?`<button class="av-chip on" data-asig="">General</button>`:'')
    + presentes.map((a,i)=>
    `<button class="av-chip${(!hayGeneral&&i===0)?' on':''}" data-asig="${a}">${ASIG_NOMBRE[a]}</button>`).join('');
  const pintar=async (asig)=>{
    const cuerpo=document.getElementById('rankAsigCuerpo');
    cuerpo.innerHTML='<p style="color:var(--dim);font-size:12px">Cargando…</p>';
    try{
      const {data,error} = asig
        ? await SB.rpc('kimun_prof_ranking_asignatura',
            {p_curso_codigo:cursoCodigo, p_asignatura:asig, p_minimo:20})
        : await SB.rpc('kimun_prof_ranking_general',
            {p_curso_codigo:cursoCodigo, p_minimo:20});
      if(error) throw error;
      cuerpo.innerHTML=rankingHTML(data||[], asig, presentes.length);
    }catch(e){ cuerpo.innerHTML='<p style="color:var(--pink);font-size:12px">'+errorPanel(e)+'</p>'; }
  };
  tabs.querySelectorAll('.av-chip').forEach(ch=>ch.onclick=()=>{
    tabs.querySelectorAll('.av-chip').forEach(o=>o.classList.toggle('on',o===ch));
    pintar(ch.dataset.asig);
  });
  pintar(hayGeneral ? '' : presentes[0]);
}

// Devuelve la asignatura de un OA en el cliente, para saber qué rankings pedir.
// Refleja la regla de kimun_oa_asignatura para los códigos que llegan al mapa.
/* De un código de objetivo a su asignatura. Era un ESPEJO ESCRITO A MANO de la función
   `kimun_oa_asignatura` que vive en PostgreSQL: las dos hacían lo mismo línea por línea,
   y ese patrón ya causó un defecto real (Sesión 37). Ahora las dos derivan de la misma
   idea —el nivel vive dentro del código— y solo los módulos transversales van a mano. */
function SB_asigDe(oa){ return NIV.asigDe(oa); }

// `asig` vacío = el ranking general (todas las asignaturas del profesor). `nAsigs` es
// cuántas hay a la vista, para poder decir "3 de 4" cuando un alumno no jugó todas.
function rankingHTML(filas, asig, nAsigs){
  const total = OA_TOTAL[asig] || 0;
  const conDatos = filas.filter(f => f.suficiente);
  const sinDatos = filas.filter(f => !f.suficiente);
  const fila = f => {
    /* En el general el respaldo NO es la cobertura de objetivos sino EN CUÁNTAS
       ASIGNATURAS tiene evidencia: un 78% sobre dos materias y un 72% sobre cuatro no son
       comparables, y sin ese número el ranking invita justo a compararlos. */
    const cob = asig
      ? (total ? ` · ${f.oa_tocados}/${total} objetivos` : '')
      : (f.asignaturas!=null ? ` · ${f.asignaturas} de ${nAsigs} asignaturas` : '');
    return `<div style="display:flex;gap:8px;align-items:center;padding:4px 0;font-size:13px">
      <span>${esc(f.avatar||'🦊')}</span><b>${esc(f.alumno)}</b>
      <span style="margin-left:auto;color:var(--gold)">${f.pct==null?'—':f.pct+'%'}</span>
      <span style="color:var(--dim);font-size:11px">${f.resp_1} resp${cob}</span>
    </div>`;
  };
  const bloqueConDatos = conDatos.length
    ? (asig ? '' : `<p style="color:var(--dim);font-size:12px;margin:0 0 6px">
         Promedio de sus asignaturas, cada una pesando igual — no el acierto total, que lo
         decidiría la materia que más se jugó. Una asignatura entra al promedio con 20
         respuestas o más.</p>`)
      + conDatos.map(fila).join('')
    : '<p style="color:var(--dim);font-size:12px">Nadie llega aún a 20 respuestas'
      + (asig ? ' en esta asignatura.' : ' en ninguna asignatura.') + '</p>';
  const bloqueSin = sinDatos.length
    ? `<details style="margin-top:8px"><summary style="cursor:pointer;color:var(--dim);font-size:12px;list-style:none">Aún sin datos suficientes (${sinDatos.length})</summary>
         <div style="margin-top:6px">${sinDatos.map(fila).join('')}</div></details>`
    : '';
  return bloqueConDatos + bloqueSin;
}

// Tabla de dominio, ordenada de peor a mejor: lo que hay que reforzar queda arriba.
// El servidor ya la devuelve en ese orden, así que no se reordena.
async function verAvance(cursoCodigo, cursoNombre, gestiono){
  aviso('Cargando…','var(--dim)');
  try{
    const {data,error}=await SB.rpc('kimun_prof_dominio',{p_curso_codigo:cursoCodigo});
    if(error) throw error;
    const titulo = cursoNombre || cursoCodigo;
    if(!data || !data.length){
      $('lista').innerHTML = cabeceraAvance(titulo, 'Avance por objetivo')
        // La planificación va también aquí, y aquí es donde MÁS sirve: un curso que
        // todavía no juega es justo el que la UTP está preparando a principio de año.
        + bloquePlanHTML() + bloqueParticipacionHTML() + `
        <p style="color:var(--dim);font-size:13px">
        Todavía no hay datos de avance de este curso. Aparecen cuando los alumnos juegan las campañas.</p>
        <button class="btn sec" id="btnVolverPanel">← Volver</button>`;
      $('btnVolverCab').onclick = volverAlPanel;
      $('btnVolverPanel').onclick = volverAlPanel;
      cargarParticipacion(cursoCodigo);
      cargarPlan(cursoCodigo);
      irArriba(); aviso(''); return;
    }
    await cargarTextosOA(data.map(f => f.oa));
    $('lista').innerHTML = cabeceraAvance(titulo, 'Avance por objetivo')
      + bloqueTendenciaHTML() + bloquePlanHTML() + bloqueParticipacionHTML() + `
      <p style="color:var(--dim);font-size:12px;margin-bottom:10px">
        Porcentaje de acierto por objetivo, de menor a mayor. ${AVISO_NO_CALIFICA}</p>
      ${filtrosAsignatura(data)}
      <div id="avCuerpo"></div>
      <div id="rankingBloque" style="margin-top:16px;border-top:1px solid #ffffff22;padding-top:12px"></div>
      <p style="color:var(--dim);font-size:11px;margin-top:12px">
        El camino de aprendizaje de Matemáticas sí aparece aquí cuando los alumnos juegan sus
        lecciones. El Reto de Cálculo no se mide: genera operaciones al momento, sin un objetivo
        del currículum asociado.</p>
      <div id="refuerzoBloque" style="margin-top:16px;border-top:1px solid #ffffff22;padding-top:12px"></div>
      <div class="btn-fila" style="margin-top:14px">
        <button class="btn sec" id="btnVolverPanel">← Volver</button>
        ${gestiono?`<button class="btn peligro" id="btnReiniciarMed">🔄 Reiniciar mediciones</button>`:''}
      </div>`;
    $('btnVolverCab').onclick = volverAlPanel;
    $('btnVolverPanel').onclick = volverAlPanel;
    const bReinit=$('btnReiniciarMed'); if(bReinit) bReinit.onclick=()=>reiniciarMediciones(cursoCodigo, cursoNombre, gestiono);
    cargarTendencia(cursoCodigo);
    const planListo = cargarPlan(cursoCodigo);
    cargarParticipacion(cursoCodigo);

    let filtro = '';                                  // '' = todas las asignaturas
    let agrupar = '';                                 // '' | 'unidad' | 'asig'
    const pintarCuerpo = () => {
      const filas = filtro ? data.filter(f => String(f.oa).slice(0,4) === filtro) : data;
