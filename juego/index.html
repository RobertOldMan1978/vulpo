<!-- Ruta ABSOLUTA: esta pagina no lleva <base href="/">, asi que una relativa
     resolveria a /juego/assets/... y daria 404. -->
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<!-- REENVIO. 8 basico se servia en /juego/ hasta el 02/09/2026 y se mudo a /8vo/, para que
     los seis cursos sigan la misma convencion (/3ro, /4to, /5to, /6to, /7mo, /8vo) en vez de
     tener uno llamado "juego". Esta pagina existe SOLO para que no muera nada de lo repartido.

     GitHub Pages es estatico: NO hay redireccion 301 posible, asi que el reenvio es del lado
     del cliente. Por eso conserva `search` y `hash` -sin eso un enlace de muestra (?solo=, ?m=),
     el de inscripcion (?inscribir=) o el de revision (?rev=1) llegarian al juego COMPLETO y sin
     su acotamiento, que es peor que un 404 porque no se nota-.

     Va `location.replace` y no `href`: asi el "atras" del telefono vuelve a donde el papa
     estaba, y no a esta pagina, que lo dejaria rebotando.

     NO BORRAR sin comprobar antes que ningun enlace de 8 basico siga circulando: enlaces de
     muestra, el de inscripcion de un curso vivo, y la app que alguien haya instalado con el
     scope viejo. -->
<script>location.replace('/8vo/' + location.search + location.hash);</script>
